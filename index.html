function rf(){

 const a=(rngS.a=(rngS.a+0x6d2b79f5)>>>0);let x=a;

function withStream(seed,fn){const keep=rngS;rngS={a:seed>>>0};try{return fn();}finally{rngS=keep;}}

 if(idbConn)return cb(idbConn);
 try{
  const rq=indexedDB.open(IDB_NAME,1);
  rq.onupgradeneeded=function(){rq.result.createObjectStore('s');};
  rq.onsuccess=function(){idbConn=rq.result;idbConn.onclose=idbConn.onversionchange=function(){idbConn=null;};cb(idbConn);};
  rq.onerror=rq.onblocked=function(){cb(null);};
 }catch(e){cb(null);}
}
// writes are coalesced: one transaction in flight, only the newest value waits behind it
function idbFlush(){
 if(idbBusy||idbWant===undefined)return;idbBusy=true;
 idbOpen(function(db){
  const v=idbWant;idbWant=undefined;
  if(!db){idbBusy=false;return;}
  const done=function(){idbBusy=false;idbFlush();};
  try{const tx=db.transaction('s','readwrite');tx.objectStore('s').put(v,'run2');tx.oncomplete=tx.onerror=tx.onabort=done;}catch(e){idbBusy=false;}
 });
}
function idbPutRun(v){idbWant=v;idbFlush();}
function save(){
 if(!G||G.over)return;if(metaDirty){saveMeta();metaDirty=false;}
 if(rngS)G.rs=rngS.a;G.ts=Date.now();let js;try{js=JSON.stringify(G);}catch(e){return;}
 try{localStorage.setItem(RUN_KEY,js);}catch(e){}
 idbPutRun(js);
}
function clearSave(){try{localStorage.removeItem(RUN_KEY);}catch(e){}idbPutRun('');}
// boot: if the IndexedDB mirror is newer than (or contradicts) localStorage, adopt it and refresh the title screen
function syncRunFromIdb(){
 idbOpen(function(db){if(!db)return;let g;try{g=db.transaction('s','readonly').objectStore('s').get('run2');}catch(e){return;}g.onsuccess=function(){
  try{db.transaction('s','readwrite').objectStore('s').delete('run');}catch(e){}   // stale pre-v2 mirror entry
  const v=g.result;if(v===undefined||G)return;
  let ls=null,lsTs=-1;try{const r=localStorage.getItem(RUN_KEY);if(r){ls=r;lsTs=JSON.parse(r).ts||0;}}catch(e){}
  try{
   if(v===''){if(ls)localStorage.removeItem(RUN_KEY);else return;}
   else{if(!runStrOk(v))return;const o=JSON.parse(v);if(ls&&lsTs>=(o.ts||0))return;localStorage.setItem(RUN_KEY,v);}
  }catch(e){return;}
  if($('title').style.display!=='none'&&$('modal').style.display==='none')showTitle(1);
 };});
}

  G.mod=modOf(G.mod)?G.mod:null;G.variant=G.variant|0;G.water=Array.isArray(G.water)?G.water:[];G.cracks=Array.isArray(G.cracks)?G.cracks.filter(c=>c&&inb(c.x,c.y)):[];G.crackT=G.crackT|0;G.wade=0;G.hard=G.hard?1:0;G.daily=typeof G.daily==='string'?G.daily:null;

  {const a=(G.auto&&typeof G.auto==='object')?G.auto:{},wasOn=!!a.on;G.auto={on:0,used:a.used?1:0,noticed:a.noticed?1:0};autoReset();autoWas=wasOn;}   // Auto never starts acting on load: the run comes back paused

// [freq, seconds, wave, volume, endFreq]

  for(const n of SFX[k]){
   const o=a.createOscillator(),g=a.createGain();o.type=n[2];o.frequency.setValueAtTime(n[0],t);
   if(n[4])o.frequency.exponentialRampToValueAtTime(n[4],t+n[1]);
   g.gain.setValueAtTime(n[3],t);g.gain.exponentialRampToValueAtTime(0.0001,t+n[1]);
   o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+n[1]+0.03);t+=n[1]*0.9;

// items.js - gear (weapon / armor / off-hand / charm): names, derived stats, generation, comparison, drops, pickup, consumables.

const SLOTS=['weapon','armor','off','charm'];
const SLOT_LABEL={weapon:'Weapon',armor:'Armor',off:'Off-hand',charm:'Charm'};
function eqi(slot){return G.p.eq[slot]||null;}
function eqKind(slot){const i=eqi(slot);return i?i.k:null;}
function traitOf(slot){const i=eqi(slot);return i&&i.tr?i.tr:null;}
function kindTable(slot){return slot==='weapon'?WP:slot==='armor'?ARM:slot==='off'?OFF:CH;}
function itemIcon(it){const t=it&&kindTable(it.t)[it.k];return t?t.e:'❔';}
function gearName(it){
 if(!it)return 'Nothing';
 const kt=kindTable(it.t)[it.k];if(!kt)return 'Strange item';
 let base=kt.n;
 if(it.t==='weapon')base=TIERS[Math.min(5,Math.floor(it.v/BAL.gear.tierDiv))]+' '+base;
 else if(it.t==='armor')base=TIERS[Math.min(5,it.v)]+' '+base;
 return it.tr&&TR[it.tr]?TR[it.tr].n+' '+base:base;
}
function itemRule(it){
 if(!it)return '';
 return it.t==='weapon'?wpRule(it.k):it.t==='armor'?armRule(it.k):it.t==='off'?offRule(it.k):charmRule(it.k);
}
function armorDef(it){if(!it)return 0;const a=ARM[it.k];if(!a||a.noDef)return 0;return Math.max(0,it.v+(a.def||0));}
function wpK(){const w=eqi('weapon');return w?WP[w.k]:null;}
function armK(){const a=eqi('armor');return a?ARM[a.k]:null;}
function wv(){const w=eqi('weapon');return w?w.v:0;}
function atkMod(){return traitOf('armor')==='spiked'?BAL.trait.spikedAtk:0;}
function meleeAtk(){const k=wpK();return Math.max(1,G.p.atk+wv()+(k?k.atk:0)+atkMod());}
function spellBase(){return Math.max(1,G.p.atk+wv()+atkMod());}   // spells ignore the weapon's melee offset
function defTotal(){return G.p.def+armorDef(eqi('armor'));}
function critChance(){const p=G.p,k=wpK(),t=traitOf('weapon');return Math.max(0,Math.min(1,p.crit+(k&&k.crit||0)+(t==='keen'?BAL.trait.keenCrit:0)+(t==='brutal'?BAL.trait.brutalCrit:0)));}
function lifeRate(){return Math.max(0,G.p.life+(traitOf('weapon')==='vamp'?BAL.trait.vampLife:0));}
function dodgeChance(){const k=armK();return Math.min(BAL.combat.dodgeCap,G.p.dodge+(k&&k.dodge||0));}
function thornsDmg(){return G.p.thorns+(traitOf('armor')==='spiked'?BAL.trait.spikedThorns:0);}
function spellMul(){const k=wpK(),a=armK();return 1+(k&&k.spell||0)+(a&&a.spell||0)+pc('arcana')*BAL.perk.arcanaSpell;}
function mmax(){
 const p=G.p;if(!(p.mbase>0))return 0;
 const k=wpK(),a=armK(),ar=eqi('armor');let m=p.mbase+(k&&k.mana||0);
 if(a){m+=(a.mana||0);if(a.manaBase)m+=a.manaBase+a.manaPerV*ar.v;}
 return Math.max(1,m);
}
function manaRegen(){const a=armK();return BAL.mana.regen*(a&&a.manaRegenMul||1);}
function maxKnives(){return BAL.ability.knife.max+(eqKind('off')==='quiver'?BAL.offhand.quiverKnives:0)+(pc('bando')?BAL.perk.bandoMax:0);}
// stat vector used by the equip comparison: what changes if `it` replaces the current item in its slot
function statVec(){return {attack:meleeAtk(),defense:defTotal(),crit:Math.round(critChance()*100),dodge:Math.round(dodgeChance()*100),spell:Math.round((spellMul()-1)*100),mana:mmax()};}
function gearDelta(it){
 const p=G.p,old=p.eq[it.t],a=statVec();p.eq[it.t]={t:it.t,k:it.k,v:it.v,tr:it.tr||null};const b=statVec();p.eq[it.t]=old;
 const o=[];for(const k in a){const d=b[k]-a[k];if(d)o.push(k+' '+sgn(d)+((k==='crit'||k==='dodge'||k==='spell')?'%':''));}
 return o;
}
function itemDesc(it){
 let t=it.t==='weapon'?'+'+it.v+' attack. ':it.t==='armor'?'Defense '+armorDef(it)+'. ':'';
 t+=itemRule(it);if(it.tr)t+=' '+traitLine(it.tr);return t;
}
function traitLine(tr){return tr&&TR[tr]?TR[tr].n+': '+TR[tr].d:'';}
function applyTrait(v,tr){return tr&&TR[tr]?Math.max(1,v+TR[tr].dv):v;}
function rollTrait(slot,f){
 if(rf()>=Math.min(BAL.trait.chanceCap,BAL.trait.chanceBase+BAL.trait.chancePerFloor*f))return null;
 const pool=Object.keys(TR).filter(k=>TR[k].slot===slot&&TR[k].minF<=f);
 return pool.length?pick(pool):null;
}
function pickW(tbl){
 const ks=Object.keys(tbl);let tot=0;for(const k of ks)tot+=tbl[k].w||1;
 let r=rf()*tot;for(const k of ks){r-=tbl[k].w||1;if(r<0)return k;}return ks[0];
}
function classOffs(cls){return Object.keys(OFF).filter(k=>OFF[k].cls===cls);}
// a fresh piece of gear for floor f. forced = treasure room / merchant: weapon and armor always carry a trait.
function newGear(slot,f,forced){
 if(slot==='off')return {t:'off',k:pick(classOffs(G.p.cls)),v:0,tr:null};
 if(slot==='charm')return {t:'charm',k:pick(Object.keys(CH)),v:0,tr:null};
 const fg=BAL.forcedGear,sp=BAL.spawn;
 let tr=null;
 if(forced){const pool=Object.keys(TR).filter(k=>TR[k].slot===slot&&TR[k].minF<=Math.max(f,fg.minTraitFloor));tr=pick(pool);}
 else tr=rollTrait(slot,f);
 if(slot==='weapon'){
  const raw=forced?rnd(fg.weaponMin,fg.weaponMax)+Math.floor(f*fg.weaponPerFloor):rnd(sp.weaponMin,sp.weaponMax)+Math.floor(f*sp.weaponPerFloor);
  return {t:'weapon',k:pickW(WP),v:applyTrait(raw,tr),tr:tr};
 }

}
function forcedGear(f,slot){return newGear(slot,f,true);}
function dropAt(x,y,it){
 let t=[x,y];
 if(itemAt(x,y)){for(const [dx,dy] of DIRS){const a=x+dx,b=y+dy;if(inb(a,b)&&G.map[ix(a,b)]===1&&!itemAt(a,b)&&!trapAt(a,b)&&!merchantAt(a,b)){t=[a,b];break;}}}
 it.x=t[0];it.y=t[1];G.items.push(it);
}
function clampRes(){const p=G.p;p.mana=Math.min(p.mana||0,mmax());G.knives=Math.min(G.knives||0,maxKnives());}
// put `it` on the player and return what it replaced
function equipItem(it){
 const p=G.p,old=p.eq[it.t];p.eq[it.t]={t:it.t,k:it.k,v:it.v,tr:it.tr||null};clampRes();return old;
}
function worthKeeping(old){return !!old&&(old.v>0||!!old.tr||old.t==='off'||old.t==='charm');}
function pickup(){
 const p=G.p;stepEffects();
 const here=G.items.filter(i=>i.x===p.x&&i.y===p.y);
 for(const it of here)pickOne(it);
}
function sellGear(it,why){const g=Math.round((BAL.item.weakSaleBase+G.floor)*G.p.goldMul);G.p.gold+=g;msg(why+' '+gearName(it)+' sold for '+g+' gold.');}
function pickOne(it){
 const p=G.p;
 let take=true;
 if(it.t==='gold'){const g=Math.round(it.v*p.goldMul*goldMod());p.gold+=g;msg('You pick up '+g+' gold.');checkAch();}
 else if(it.t==='potion'){
  if(G.inv.pot<p.potCap){G.inv.pot++;msg('You pick up a health potion.');}
  else{msg('Potion belt is full.');take=false;}
 }
 else if(it.t==='knife'){
  if(G.knives<maxKnives()){G.knives++;msg('You pick up a throwing knife.');}
  else take=false;
 }
 else if(SLOTS.indexOf(it.t)>=0){
  const cur=p.eq[it.t];
  if(cur&&cur.k===it.k&&!it.tr&&!cur.tr){
   if(it.t==='off'||it.t==='charm')sellGear(it,'You already own this:');
   else if(it.v>cur.v){equipItem(it);msg('Equipped '+gearName(it)+'.');}
   else sellGear(it,'Weak');
  }else{gearQ=it;take=false;}
 }
 else if(it.t==='fire'){G.inv.fire++;msg('Found a flame scroll.');}
 else if(it.t==='tele'){G.inv.tele++;msg('Found a Teleport scroll.');}
 else if(it.t==='key'){G.keys=(G.keys||0)+1;msg('You pick up a brass key!');}
 if(take){G.items=G.items.filter(o=>o!==it);sfx('pickup');}

}
function drink(){
 const p=G.p;
 if(G.inv.pot<=0){msg('No potions. Find them in the dungeon.');return;}
 if(p.hp>=p.mhp){msg('Already at full health.');return;}

function teleport(){

// perks.js - perk lookup, granting, synergies.

function pc(id){return (G&&G.perks&&G.perks[id])||0;}
function perkById(id){return PERKS.find(x=>x.id===id);}
function checkSyn(){
 for(const s of SYN)if(pc(s.a)&&pc(s.b)&&!G.syn[s.id]){G.syn[s.id]=1;msg('Synergy! '+s.n+': '+s.d+'.');}
}
function addPerk(id){
 const pk=perkById(id);if(!G||!pk||pc(id)>=pk.max)return false;
 G.perks[id]=pc(id)+1;if(pk.f)pk.f(G.p);
 msg('Perk gained: '+pk.n+(pk.max>1?' (Lv '+pc(id)+')':'')+'.');checkSyn();return true;
}

// perks the current player can still be offered: unlocked, not maxed, and for their class
function perkPool(){return PERKS.filter(pk=>(!pk.lock||meta.unl[pk.lock])&&(!pk.cls||pk.cls===G.p.cls)&&pc(pk.id)<pk.max);}
function randomPerkId(){const pool=perkPool();return pool.length?pick(pool).id:null;}

// fov.js - line of sight, field of view, breadth-first distance maps and click-to-walk path finding.

function los(x0,y0,x1,y1,ub){
 let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx-dy,x=x0,y=y0;
 while(!(x===x1&&y===y1)){
  if(!(x===x0&&y===y0)){const t=G.map[ix(x,y)];if(t===0||t===3||t===5)return false;if(ub&&enemyAt(x,y))return false;}
  const e2=2*err;
  if(e2>-dy){err-=dy;x+=sx;}
  if(e2<dx){err+=dx;y+=sy;}
 }
 return true;
}
function bfsDist(sx,sy){
 const d=new Array(W*H).fill(9999);d[ix(sx,sy)]=0;const q=[[sx,sy]];
 for(let i=0;i<q.length;i++){const [x,y]=q[i];
  for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;
   if(walkable(nx,ny)&&d[ix(nx,ny)]===9999){d[ix(nx,ny)]=d[ix(x,y)]+1;q.push([nx,ny]);}}}
 return d;
}

function computeVis(){
 const p=G.p,R=visRadius();G.vis=new Array(W*H).fill(false);
 for(let y=p.y-R;y<=p.y+R;y++)for(let x=p.x-R;x<=p.x+R;x++){
  if(!inb(x,y))continue;
  if((x-p.x)*(x-p.x)+(y-p.y)*(y-p.y)>R*R+1)continue;
  if(!los(p.x,p.y,x,y))continue;
  const i=ix(x,y);G.vis[i]=true;G.seen[i]=true;
  if(G.map[i]!==0){G.exp[i]=true;
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(inb(x+dx,y+dy))G.seen[ix(x+dx,y+dy)]=true;}
 }
 const rr=pc('trapper')?BAL.vis.trapfinderRange:1;
 for(const t of G.traps)if(!t.rev&&!t.done&&Math.max(Math.abs(t.x-p.x),Math.abs(t.y-p.y))<=rr&&(rr===1||los(p.x,p.y,t.x,t.y))){t.rev=1;G.seen[ix(t.x,t.y)]=true;msg('You spot '+(t.k==='alarm'?'an ':'a ')+TRAPS[t.k].n.toLowerCase()+'!');}
}

function bfsPath(sx,sy,tx,ty){
 const dz=dangerSet(),tz=trapSet(),cz=crackSet();
 const prev=new Map(),start=ix(sx,sy);prev.set(start,-1);const q=[[sx,sy]];
 const goal=ix(tx,ty);
 for(let i=0;i<q.length;i++){const [x,y]=q[i];if(ix(x,y)===goal)break;
  for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,k=ix(nx,ny);
   if(!inb(nx,ny)||prev.has(k)||!G.seen[k]||G.map[k]===0||dz.has(k)||(cz.has(k)&&k!==goal))continue;

// mapgen.js - dungeon layout: rooms, corridors, doors, caves, the locked treasure room.

function genFloor(f){
 for(let attempt=0;attempt<BAL.map.attempts;attempt++){
  const m=new Array(W*H).fill(0),rooms=[];
  for(let i=0;i<BAL.map.roomTries&&rooms.length<BAL.map.maxRooms;i++){
   const big=f===MAXF&&rooms.length===0;
   const w=big?BAL.map.bossRoomW:rnd(BAL.map.roomMinW,BAL.map.roomMaxW),h=big?BAL.map.bossRoomH:rnd(BAL.map.roomMinH,BAL.map.roomMaxH),x=rnd(1,Math.min(W,BAL.map.span)-w-1),y=rnd(1,Math.min(H,BAL.map.span)-h-1);   // rooms only use the top-left span x span corner: shorter corridors, shorter runs
   if(rooms.some(r=>x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y))continue;
   const rcx=x+(w>>1),rcy=y+(h>>1);
   rooms.push({x,y,w,h,cx:rcx,cy:rcy});
   const cave=f>=BAL.map.caveFrom&&f<=BAL.map.caveTo&&!big&&rf()<BAL.map.caveChance;
   for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){
    m[ix(xx,yy)]=1;
    if(cave&&xx!==rcx&&yy!==rcy){
     const ring=(xx===x||xx===x+w-1||yy===y||yy===y+h-1);
     if(rf()<(ring?BAL.map.caveRingWall:BAL.map.caveInnerWall))m[ix(xx,yy)]=0;
    }
   }
  }
  if(rooms.length<BAL.map.minRooms)continue;
  if(f===MAXF)rooms.push(rooms.shift());
  for(let i=0;i<rooms.length-1;i++){
   const a=rooms[i],b=rooms[i+1];let x=a.cx,y=a.cy;
   while(x!==b.cx){m[ix(x,y)]=1;x+=b.cx>x?1:-1;}
   while(y!==b.cy){m[ix(x,y)]=1;y+=b.cy>y?1:-1;}
   m[ix(x,y)]=1;
  }
  const last=rooms[rooms.length-1];
  if(f<MAXF)m[ix(last.cx,last.cy)]=2;
  // verify connectivity
  const seen=new Array(W*H).fill(false),q=[[rooms[0].cx,rooms[0].cy]];seen[ix(q[0][0],q[0][1])]=true;
  for(let i=0;i<q.length;i++){const [x,y]=q[i];for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;
   if(inb(nx,ny)&&m[ix(nx,ny)]!==0&&!seen[ix(nx,ny)]){seen[ix(nx,ny)]=true;q.push([nx,ny]);}}}
  if(!seen[ix(last.cx,last.cy)])continue;
  let ok=true;for(const r of rooms)if(!seen[ix(r.cx,r.cy)])ok=false;
  if(!ok)continue;
  // doors on straight corridor tiles right next to a room
  const inRoom=(x,y)=>rooms.some(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h);
  const fl=(x,y)=>inb(x,y)&&m[ix(x,y)]!==0;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
   if(m[ix(x,y)]!==1||inRoom(x,y))continue;
   let isD=false;
   if(fl(x-1,y)&&fl(x+1,y)&&!fl(x,y-1)&&!fl(x,y+1)&&(inRoom(x-1,y)||inRoom(x+1,y)))isD=true;
   if(fl(x,y-1)&&fl(x,y+1)&&!fl(x-1,y)&&!fl(x+1,y)&&(inRoom(x,y-1)||inRoom(x,y+1)))isD=true;
   if(isD&&rf()<BAL.map.doorChance)m[ix(x,y)]=3;
  }
  return {m,rooms};
 }
 // fallback: simple open map
 const m=new Array(W*H).fill(0);for(let y=2;y<W-2;y++)for(let x=2;x<W-2;x++)m[ix(x,y)]=1;
 if(f<MAXF)m[ix(W-4,H-4)]=2;
 return {m,rooms:[{x:2,y:2,w:26,h:26,cx:3,cy:3},{x:2,y:2,w:26,h:26,cx:W-4,cy:H-4}]};
}
function carveTreasure(rooms,f){
 const cand=rooms.filter((r,i)=>i>0&&!(f===MAXF&&i===rooms.length-1));
 for(let a=0;a<60&&cand.length;a++){
  const r=pick(cand),side=rnd(0,3),dx=[1,-1,0,0][side],dy=[0,0,1,-1][side];
  const ddx=dx?(dx>0?r.x+r.w:r.x-1):r.cx,ddy=dx?r.cy:(dy>0?r.y+r.h:r.y-1);
  const cx=ddx+dx*2,cy=ddy+dy*2;let ok=true;
  for(let y=cy-2;y<=cy+2&&ok;y++)for(let x=cx-2;x<=cx+2;x++){if(x<1||y<1||x>W-2||y>H-2||G.map[ix(x,y)]!==0){ok=false;break;}}

 }

}

  if(modIs('horde')){hp*=M.horde.hpMul;atk*=M.horde.atkMul;}

// Flooded: a few pools per room on plain floor tiles that hold nothing else. Water never blocks movement, so reachability is untouched.
function placeWater(rooms,taken){

  if(r.w>=BAL.map.bossRoomW)continue;

function dangerSet(){const st=new Set();if(!G)return st;for(const e of G.enemies)if(e.wind&&!e.dead)for(const t of e.wind.tiles)st.add(ix(t[0],t[1]));return st;}
function dangerNear(dz){const p=G.p;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dz.has(ix(p.x+dx,p.y+dy))&&inb(p.x+dx,p.y+dy))return true;return false;}

function canEscape(tiles){

  if(t===0||t===3||t===5||merchantAt(nx,ny)||enemyAt(nx,ny))continue;if(!st.has(ix(nx,ny)))return true;}

 for(const e of G.enemies.slice()){
  if(p.hp<=0)break;if(e.dead)continue;
  const d=EN[e.t];if(!free&&e.cd>0)e.cd--;if(!free&&e.hcd>0)e.hcd--;
  if(d.boss&&!free)bossPhase(e);
  if(e.stun>0||e.frz>0){e.wind=null;if(!free){if(e.stun>0)e.stun--;if(e.frz>0)e.frz--;}continue;}
  if(e.wade){if(!free)e.wade=0;continue;}   // Flooded: it waded into water and loses this move
  if(G.smoke&&inSmoke(e.x,e.y))e.blind=Math.max(e.blind||0,2);
  const blindNow=e.blind>0;if(!free&&e.blind>0)e.blind--;
  if(G.vanish>0){e.awake=false;e.wind=null;continue;}
  if(free&&(e.wind||d.slowAct))continue;
  if(e.wind){resolveWind(e,d);continue;}
  const md=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);
  const sightR=Math.max(1,enemySight()-(eqKind('charm')==='veil'?BAL.charm.veilSight:0));
  const see=!blindNow&&md<=(G.smoke&&inSmoke(p.x,p.y)?1:sightR)&&los(e.x,e.y,p.x,p.y);
  if(see)e.awake=true;
  if(!e.awake)continue;
  if(!see&&!e.alarm&&dist[ix(e.x,e.y)]>BAL.enemyAi.loseTrackDist){e.awake=false;continue;}
  if(d.slowAct){if(e.rest){e.rest=0;continue;}e.rest=1;}
  if(d.boss&&!e.enraged&&e.hp<e.mhp*(G.hard?BAL.hard.enrageFrac:BAL.enemyAi.enrageFrac)){e.enraged=1;e.atk=Math.round(e.atk*BAL.enemyAi.enrageAtkMul);msg('The '+d.n+' roars in fury!');floatFx(e.x,e.y,'ENRAGED','#f55');}
  if(d.heal&&!free&&!(e.hcd>0)){
   let tg=null,bf=BAL.enemyAi.healBelow;
   for(const o of G.enemies){if(o===e||o.dead)continue;const fr=o.hp/o.mhp;
    if(fr<bf&&manh(o,e)<=BAL.enemyAi.healRange&&los(e.x,e.y,o.x,o.y)){bf=fr;tg=o;}}
   if(tg){const h=Math.max(1,Math.round(tg.mhp*BAL.enemyAi.healFrac));tg.hp=Math.min(tg.mhp,tg.hp+h);e.hcd=BAL.enemyAi.healEvery;
    floatFx(tg.x,tg.y,'+'+h,'#8f8');if(G.vis[ix(tg.x,tg.y)])msg('The '+d.n+' mends the '+nm(tg)+'.');continue;}
  }
  const steps=(d.speed||1)+((d.lunge&&!free&&md>1&&(G.turn+e.id)%BAL.enemyAi.lungeEvery===0)?1:0);
  for(let s=0;s<steps;s++){
   if(e.dead)break;
   const dd=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);
   if(d.sweep&&e.enraged&&!free&&dd===1&&e.cd<=0){const w=sweepWind(e);if(w){e.wind=w;msg('The '+d.n+' whips its tail around!');floatFx(e.x,e.y,'!','#f55');break;}}
   if(d.breath&&!free&&e.cd<=0&&see){const w=breathWind(e);if(w){e.wind=w;msg(d.windMsg);floatFx(e.x,e.y,'!','#f55');break;}}
   if(d.wind&&!free&&dd===1&&e.cd<=0){const w=smashWind(e);if(w){e.wind=w;msg(d.windMsg);floatFx(e.x,e.y,'!','#f55');break;}}
   if(dd===1){
    if(d.kite){
     if(e.tired>0)e.tired--;
     else{const fs=fleeStep(e,p);if(fs){e.fl=(e.fl||0)+1;if(e.fl>=BAL.enemyAi.fleeSteps){e.tired=BAL.enemyAi.tiredTurns;e.fl=0;}moveEnemy(e,fs[0],fs[1]);break;}}
    }
    hurtPlayer(e,e.atk,true);break;}
   if(d.range&&see&&dd<=d.range&&e.cd<=0&&los(e.x,e.y,p.x,p.y,true)){hurtPlayer(e,e.atk,false);e.cd=d.cdmax||0;break;}
   if(d.kite&&see&&dd===2&&e.cd>0){const fs=fleeStep(e,p);if(fs){moveEnemy(e,fs[0],fs[1]);break;}}
   if(d.slow&&G.turn%2)break;
   let best=null;
   if(d.pack&&dd>1)best=surroundStep(e,p);
   if(!best){let bd=dist[ix(e.x,e.y)];
    for(const [dx,dy] of DIRS){const nx=e.x+dx,ny=e.y+dy;
     if(!walkable(nx,ny)||enemyAt(nx,ny)||(nx===p.x&&ny===p.y))continue;
     if(dist[ix(nx,ny)]<bd){bd=dist[ix(nx,ny)];best=[nx,ny];}}}
   if(best)moveEnemy(e,best[0],best[1]);else break;
  }
 }
}

function killEnemy(e,src){
 if(e.dead)return;
 e.dead=true;G.enemies=G.enemies.filter(o=>o!==e);G.kills++;meta.kills++;if(e.elite)meta.elites++;metaDirty=true;checkAch();
 const d=EN[e.t];msg((src||'You')+' slew the '+nm(e)+'.');if(!rmo())puffs.push({x:e.x,y:e.y,t:performance.now(),s:Math.random()*6});
 gainXp(Math.round((d.xp+G.floor)*(modIs('horde')?BAL.mod.horde.xpMul:1)*(e.hunter?BAL.mod.hunted.xpMul:1)));
 if(d.boss){G.won=true;return;}
 if(modIs('horde')&&!G.enemies.length)earn('horde');
 if(traitOf('weapon')==='cursed')curseDrain();
 {const p=G.p,ch=eqKind('charm');
  if(ch==='fang'){const h=BAL.charm.fangHeal+Math.floor(G.floor/BAL.charm.fangFloorDiv);p.hp=Math.min(p.mhp,p.hp+h);floatFx(p.x,p.y,'+'+h,'#6f6');}
  if(ch==='soul'){if(p.cls==='warrior')gainRage(BAL.charm.soulRage,true);else if(p.cls==='mage')p.mana=Math.min(mmax(),p.mana+BAL.charm.soulMana);else for(const k in G.cd)if(G.cd[k]>0)G.cd[k]--;}
  if(p.cls==='mage'){let m=BAL.mana.perKill+(pc('well')?BAL.perk.wellKill:0);if(G.syn.ow)m*=2;p.mana=Math.min(mmax(),p.mana+m);}}
 if(e.hunter)huntReward(e);
 else if(e.elite){dropAt(e.x,e.y,{t:'key',v:0});floatFx(e.x,e.y,'KEY','#ffd24a');msg('The elite drops a brass key!');}
 else if(rf()<BAL.drops.potionChance*(G.hard?BAL.hard.dropPotionMul:1))G.items.push({x:e.x,y:e.y,t:'potion',v:0});
 else if(rf()<(modIs('horde')?BAL.mod.horde.goldDrop:BAL.drops.goldChance))G.items.push({x:e.x,y:e.y,t:'gold',v:rnd(BAL.drops.goldMin,BAL.drops.goldMax)+G.floor});
 if(pc('midas'))dropAt(e.x,e.y,{t:'gold',v:rnd(BAL.drops.midasMin,BAL.drops.midasMax)+G.floor*BAL.drops.midasPerFloor});
 if(pc('scav')&&!itemAt(e.x,e.y)&&rf()<BAL.drops.scavChance*pc('scav'))G.items.push({x:e.x,y:e.y,t:'potion',v:0});
 if(pc('blood'))G.bl=1;
 if(pc('chain')&&!inChain)chainZap(e);
}
// kind: 'melee' | 'ranged' | 'magic' (shields care), undefined = poison / traps / impact (never reduced)
function hurtEnemy(e,dmg,col,crit,kind){
 if(e.dead)return;
 if(kind&&EN[e.t].shield&&!(e.stun>0||e.frz>0)){
  let m=1;
  if(isFront(e))m=BAL.weapon.shieldFront;
  if(kind!=='melee')m=Math.min(m,BAL.weapon.shieldRanged);
  if(m<1){dmg=Math.max(1,Math.round(dmg*m));floatFx(e.x,e.y,'shield','#9ab');}
 }
 e.hp-=dmg;e.awake=true;flashes[e.id]=performance.now();floatFx(e.x,e.y,'-'+dmg+(crit?'!':''),col||'#ffd24a',crit);
}
// resolve a hit: kill if dead, else maybe execute
function settle(e,src){
 if(e.dead)return;
 if(e.hp<=0){killEnemy(e,src);return;}
 if(!pc('exec')||EN[e.t].boss)return;
 if(e.hp/e.mhp<(pc('blood')?BAL.perk.execBlood:BAL.perk.execBase)){floatFx(e.x,e.y,'EXECUTE','#f55');msg('Executed the '+nm(e)+'!');killEnemy(e);}
}
function poison(e){
 const s=pc('venom');if(!s||e.dead||e.hp<=0)return;
 let d=BAL.perk.venomBase+s;if(EN[e.t].boss)d=Math.max(1,Math.floor(d/2));
 e.pois={t:BAL.perk.venomTurns,d:d};floatFx(e.x,e.y,'poison','#7be04b');
}
function tickPoison(){
 for(const e of G.enemies.slice()){
  if(e.dead||!e.pois)continue;
  const d=e.pois.d,col=e.pois.burn?'#ff9a3a':'#7be04b';e.pois.t--;if(e.pois.t<=0)delete e.pois;
  hurtEnemy(e,d,col);settle(e,e.pois&&e.pois.burn?'Burning':'Poison');
 }
}
function chainZap(from){
 inChain=true;
 try{
  let best=null,bd=99;
  for(const o of G.enemies){if(o.dead||o===from||!G.vis[ix(o.x,o.y)])continue;
   const dd=Math.abs(o.x-from.x)+Math.abs(o.y-from.y);if(dd<bd&&dd<=BAL.perk.chainRange){bd=dd;best=o;}}
  if(best){const dmg=BAL.perk.chainBase+G.floor*BAL.perk.chainPerFloor;hurtEnemy(best,dmg,'#9cf');
   msg('Chain Lightning arcs to the '+nm(best)+' for '+dmg+'.');
   if(pc('venom'))poison(best);
   settle(best,'Lightning');}
 }finally{inChain=false;}
}
function playerDmg(spell){
 const p=G.p;let d=Math.max(1,(spell?spellBase():meleeAtk())+rnd(-BAL.combat.dmgVar,BAL.combat.dmgVar));
 if(pc('berserk'))d*=1+BAL.perk.berserkMax*(1-Math.max(0,p.hp)/p.mhp);
 return Math.max(1,Math.round(d));
}
function lifeSteal(dmg){
 const p=G.p,lr=lifeRate();if(lr<=0)return;
 let h=Math.max(1,Math.round(dmg*lr));
 if(pc('berserk')&&pc('vamp')&&p.hp<p.mhp*BAL.perk.bloodFrenzyHp)h*=BAL.perk.bloodFrenzyMul;
 p.hp=Math.min(p.mhp,p.hp+h);floatFx(p.x,p.y,'+'+h,'#6f6');
}
function sneakMul(){const wk=wpK();let b=G.p.cls==='rogue'?BAL.combat.sneakMul:1;if(modIs('silent'))b=Math.max(b,BAL.mod.silent.sneakMul);return b+(wk&&wk.sneak||0);}
function playerAttack(e){
 const p=G.p,wk=wpK();let dmg=playerDmg(),crit=rf()<critChance();
 if(crit)dmg*=BAL.combat.critMul;
 const sn=sneakMul();
 if(sn>1&&!e.awake){dmg*=sn;msg('Sneak attack!');}
 if(G.vanish>0){G.vanish=0;msg('You step out of the shadows.');}
 if(G.bl){dmg=Math.round(dmg*BAL.perk.bloodlustMul);G.bl=0;msg('Bloodlust! Your strike is empowered.');}
 dmg=Math.max(1,Math.round(dmg));
 hurtEnemy(e,dmg,crit?'#ff8a3a':'#ffd24a',crit,'melee');
 sfx(crit?'crit':'hit');if(crit||dmg>=Math.max(8,e.mhp*0.5))shake(crit?5:3);
 msg((crit?'Critical! ':'')+'You hit the '+nm(e)+' for '+dmg+'.');
 lifeSteal(dmg);gainRage(BAL.rage.dealt);
 poison(e);
 settle(e);
 if(wk&&wk.sweep){
  const half=Math.max(1,Math.floor(dmg*wk.sweep));
  for(const o of G.enemies.slice()){
   if(o===e||o.dead||(cheb(o,p)>1&&cheb(o,e)>1))continue;
   hurtEnemy(o,half,'#ffb04a',false,'melee');msg('Your axe sweeps the '+nm(o)+' for '+half+'.');poison(o);settle(o);
  }
 }
}
function hurtPlayer(e,dmg,melee,verb){
 const p=G.p;
 if(e&&e.x!=null){e.face=[Math.sign(p.x-e.x),Math.sign(p.y-e.y)];}
 if(e&&e.blind>0&&rf()<BAL.ability.smoke.miss){floatFx(e.x,e.y,'miss','#ccc');msg('The blinded '+nm(e)+' swings wildly and misses.');return false;}
 if(rf()<dodgeChance()){floatFx(p.x,p.y,'dodge','#9cf');msg('You dodge the '+nm(e)+'.');return false;}
 if(eqKind('charm')==='ward'&&!G.ssUsed){G.ssUsed=1;floatFx(p.x,p.y,'blocked','#bbb');msg('Your Ward Sigil negates the '+nm(e)+"'s hit.");return false;}
 dmg=Math.max(1,Math.round(dmg*BAL.combat.armorK/(BAL.combat.armorK+defTotal()))+rnd(-BAL.combat.enemyDmgVar,BAL.combat.enemyDmgVar));
 if(dmg<1)dmg=1;
 const raw=dmg;let refl=0;
 if(G.brace){
  dmg=Math.max(1,Math.round(dmg*BAL.ability.brace.reduce));refl=melee?Math.round(raw*G.brace.reflect):0;
  floatFx(p.x,p.y,'braced','#9cf');if(--G.brace.hits<=0)G.brace=null;
 }
 p.hp-=dmg;G.killer=nm(e);flashUntil=performance.now()+250;floatFx(p.x,p.y,'-'+dmg,'#ff5a5a');
 msg('The '+nm(e)+' '+(verb||(melee?'hits':'blasts'))+' you for '+dmg+'.');playerHurtFx(dmg);
 gainRage(BAL.rage.taken);
 secondWind();
 if(refl>0&&!e.dead){hurtEnemy(e,refl,'#9cf');msg('Your brace reflects '+refl+' damage.');settle(e,'Reflection');}
 if(melee&&thornsDmg()>0&&!e.dead){hurtEnemy(e,thornsDmg(),'#8f8');settle(e,'Thorns');}
 if(melee&&!e.dead&&p.hp>0&&pc('riposte')&&rf()<BAL.perk.riposteChance*pc('riposte')){
  const d2=playerDmg();hurtEnemy(e,d2,'#fff',false,'melee');msg('Riposte! You counter for '+d2+'.');settle(e);}
 return true;
}
function kbDmg(){return BAL.combat.knockBase+Math.floor(G.floor/BAL.combat.knockFloorDiv);}
// push a unit one tile; never into walls/doors/units/out of bounds (those cause bump damage instead)
function knock(u,dx,dy){
 const p=G.p,isP=u===p;
 if(!isP&&EN[u.t].boss){msg('The '+nm(u)+' is too heavy to push.');return false;}
 const nx=u.x+dx,ny=u.y+dy;let bump=false,other=null,what='the wall';
 if(!inb(nx,ny)||G.map[ix(nx,ny)]===0||G.map[ix(nx,ny)]===3||G.map[ix(nx,ny)]===5||merchantAt(nx,ny))bump=true;
 else{other=(nx===p.x&&ny===p.y&&!isP)?p:enemyAt(nx,ny);if(other){bump=true;what=other===p?'you':'the '+nm(other);}}
 const hitU=(t,d)=>{
  if(t===p){p.hp-=d;G.killer='a wall slam';playerHurtFx(d);floatFx(p.x,p.y,'-'+d,'#ff5a5a');secondWind();}
  else{hurtEnemy(t,d,'#ffb04a');settle(t,'Impact');}
 };
 if(bump){
  const d=kbDmg();
  msg((isP?'You are':'The '+nm(u)+' is')+' slammed into '+what+' for '+d+'!');
  floatFx(u.x,u.y,'BUMP','#ffb04a');
  if(!isP)u.wind=null;
  hitU(u,d);
  if(other&&!other.dead)hitU(other,Math.max(1,Math.floor(d/2)));
  return false;
 }
 u.x=nx;u.y=ny;
 if(isP){pickup();}else{u.wind=null;}
 return true;
}
function endTurn(){
 const p=G.p;
 if(G.won){finish('win');return;}
 G.turn++;
 for(const k in G.cd)if(G.cd[k]>0)G.cd[k]--;
 if(eqKind('charm')==='hourglass'&&G.turn%BAL.charm.hourglassEvery===0)for(const k in G.cd)if(G.cd[k]>0)G.cd[k]--;
 if(p.cls==='mage'){p.mf=(p.mf||0)+manaRegen();const w=Math.floor(p.mf);p.mf-=w;p.mana=Math.min(mmax(),p.mana+w);}
 if(p.cls==='warrior'&&(p.rage||0)>0&&!G.enemies.some(e=>e.awake&&G.vis[ix(e.x,e.y)]))p.rage=Math.max(0,p.rage-BAL.rage.decay);
 if(G.brace&&--G.brace.t<=0)G.brace=null;
 if(G.smoke){for(const c of G.smoke)c.t--;G.smoke=G.smoke.filter(c=>c.t>0);}
 if(p.hp<p.mhp&&!modIs('cursed')){
  if(p.regen&&G.turn%BAL.player.regenEvery===0)p.hp=Math.min(p.mhp,p.hp+p.regen);
  if(G.turn%BAL.player.baseRegenEvery===0)p.hp=Math.min(p.mhp,p.hp+1);
 }
 if(G.ppois&&p.hp>0){const d=G.ppois.d;p.hp-=d;G.killer='dart poison';floatFx(p.x,p.y,'-'+d,'#7be04b');G.ppois.t--;if(G.ppois.t<=0){G.ppois=null;msg('The poison wears off.');}secondWind();}
 tickPoison();
 if(G.won){finish('win');return;}
 crackTick();
 enemiesAct();
 if(G.wade){G.wade=0;if(p.hp>0&&!G.won&&G.enemies.some(e=>e.awake)){msg('You slog through the water: enemies get a free move.');enemiesAct(true);}}
 if(traitOf('armor')==='heavy'&&G.turn%BAL.trait.heavyEvery===0&&p.hp>0&&!G.won&&G.enemies.some(e=>e.awake)){msg('Your heavy armor slows you: enemies get a free turn.');enemiesAct(true);}
 if(G.vanish>0)G.vanish--;
 if(G.won){finish('win');return;}
 if(p.hp<=0){p.hp=0;msg('You have died...');finish('dead');return;}
 computeVis();save();render();
 afterModals();
}

function showShrine(){
 const s=G&&G.shrine;if(!s||s.used||G.over)return;walkTok++;
 const p=G.p,better=!!meta.unl.shrine||modIs('cursed'),heal=better?BAL.shrine.healBetter:BAL.shrine.healBase,loss=better?BAL.shrine.lossBetter:BAL.shrine.lossBase,pct=n=>Math.round(n*100);
 const done=function(t){s.used=1;closeModal();msg(t);save();render();afterModals();};
 const opts=[
  {k:'pray',html:'<b>🙏 Pray</b><span>'+pct(heal)+'% chance of a full heal, '+pct(1-heal)+'% chance you lose '+pct(loss)+'% of max HP.</span>',fn:function(){
   if(rf()<heal){const h=p.mhp-p.hp;p.hp=p.mhp;floatFx(p.x,p.y,'+'+h,'#6f6');done('The shrine glows. You are fully healed.');}
   else{const l=Math.max(1,Math.round(p.mhp*loss));p.hp=Math.max(1,p.hp-l);G.killer='a cursed shrine';floatFx(p.x,p.y,'-'+l,'#ff5a5a');playerHurtFx(l);done('The shrine rejects you: -'+l+' HP.');}}},
  {k:'sac',html:'<b>🪙 Sacrifice '+BAL.shrine.sacrificeGold+' gold</b><span>Gain a random perk. You have '+p.gold+' gold.</span>',off:p.gold<BAL.shrine.sacrificeGold,fn:function(){
   const id=randomPerkId();if(!id){msg('No perks left to offer.');return;}
   p.gold-=BAL.shrine.sacrificeGold;addPerk(id);done('The shrine accepts your gold.');}},
  {k:'pact',html:'<b>🩸 Blood pact</b><span>-'+BAL.shrine.pactHp+' max HP, +'+BAL.shrine.pactAtk+' attack for the rest of the run. Only once per run.</span>',off:p.mhp<=BAL.shrine.pactMinHp||!!G.pact,fn:function(){
   G.pact=1;p.mhp=Math.max(BAL.shrine.pactMinHp,p.mhp-BAL.shrine.pactHp);p.hp=Math.min(p.hp,p.mhp);p.atk+=BAL.shrine.pactAtk;done('You sign in blood: -'+BAL.shrine.pactHp+' max HP, +'+BAL.shrine.pactAtk+' attack.');}}
 ];
 if(better)opts.splice(1,0,{k:'bless',html:'<b>✨ Blessing</b><span>Safe: heal 30% of max HP and gain +1 defense.</span>',fn:function(){
  const h=Math.round(p.mhp*BAL.shrine.blessHeal);p.hp=Math.min(p.mhp,p.hp+h);p.def++;floatFx(p.x,p.y,'+'+h,'#6f6');done('A warm light blesses you: +1 defense.');}});
 opts.push({k:'leave',label:'Leave',c:1,fn:function(){s.left=1;closeModal();render();}});
 showModal('🗿 Ancient shrine','<p>A strange altar hums with power. Choose carefully - it works only once.</p>',opts,'shrine');
}
function showShop(){
 if(!G||G.over||!G.merchant)return;walkTok++;
 const m=G.merchant,p=G.p;
 const btns=m.stock.map(function(it,i){return {k:'buy'+i,html:'<b>'+it.n+(it.sold?' (sold)':'')+' - <span class="gold">'+it.price+' 💰</span></b><span>'+it.d+'</span>',off:!!it.sold||p.gold<it.price,fn:function(){buy(i);}};});
 btns.push({k:'leave',label:'Leave',c:1,fn:closeModal});
 showModal('🧔 Merchant','<p>"Fine wares for fine coin." You have <span class="gold">'+p.gold+' 💰</span>.</p>',btns,'shop');
}
function buy(i){
 const m=G&&G.merchant,it=m&&m.stock[i],p=G&&G.p;if(!it||it.sold||p.gold<it.price)return;
 if(it.k==='pot'){if(G.inv.pot>=p.potCap){msg('Your potion belt is full.');return;}G.inv.pot++;}
 else if(it.k==='fire')G.inv.fire++;
 else if(it.k==='tele')G.inv.tele++;
 else if(it.k==='gear'){equipItem(it.item);}
 else if(it.k==='perk'){if(!addPerk(it.id)){msg('You cannot take that perk.');return;}}
 else if(it.k==='elixir'){p.mhp+=BAL.merchant.elixirHp;p.hp=p.mhp;}
 p.gold-=it.price;it.sold=1;msg('Bought: '+it.n.replace(/^\S+ /,'')+'.');save();render();showShop();
}

// abilities.js - the 12 class abilities (4 per class): costs, cooldowns, target rules, effects, arming; plus reach attacks and smoke.

function kit(){return CLS[G.p.cls].kit;}
function cheb(a,b){return Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));}
function manh(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);}
function cdFor(k){
 let c=BAL.ability[k].cd||0;if(!c)return 0;
 if(k==='blink'&&pc('phase'))return 0;
 if(pc('tempo'))c-=BAL.perk.tempoCut;
 if(k==='backstab'&&pc('assassin'))c-=BAL.perk.assassinCd;
 if(k==='vanish'&&pc('shadow'))c-=BAL.perk.shadowCd;
 return Math.max(1,c);
}
function costOf(k){
 const a=BAL.ability[k];let rage=a.rage||0,mana=a.mana||0;
 if(k==='charge'&&pc('stampede'))rage=Math.max(0,rage-BAL.perk.stampedeCost);
 if(k==='blink'&&pc('phase'))mana=Math.max(0,mana-BAL.perk.phaseCost);
 return {rage:rage,mana:mana};
}
function costLabel(k){const c=costOf(k);return c.rage?c.rage+' rage':c.mana?c.mana+' mana':k==='knife'?'1 knife':cdFor(k)?'cd '+cdFor(k):'free';}
function inSmoke(x,y){const k=ix(x,y);if(G.smoke)for(const c of G.smoke)if(c.cells.indexOf(k)>=0)return true;return false;}
function isFront(e){const p=G.p;if(!e.face)return true;return e.face[0]*(p.x-e.x)+e.face[1]*(p.y-e.y)>0;}
function isBehind(e){const p=G.p;if(!e.face)return false;return e.face[0]*(p.x-e.x)+e.face[1]*(p.y-e.y)<0;}
function gainRage(n,raw){
 const p=G.p;if(p.cls!=='warrior'||n<=0)return;
 if(!raw){n*=(armK()&&armK().rageMul||1)*(1+pc('fury')*BAL.perk.furyMul)*((G.syn&&G.syn.fb&&p.hp<p.mhp*0.5)?BAL.perk.bloodRageMul:1);}
 p.rage=Math.min(BAL.rage.max,(p.rage||0)+Math.max(1,Math.round(n)));
}
function advEnemies(vis){return G.enemies.filter(e=>!e.dead&&manh(e,G.p)===1&&(!vis||G.vis[ix(e.x,e.y)]));}
function chebEnemies(){return G.enemies.filter(e=>!e.dead&&cheb(e,G.p)===1&&G.vis[ix(e.x,e.y)]);}
function enemyShots(range){return G.enemies.filter(e=>!e.dead&&G.vis[ix(e.x,e.y)]&&manh(e,G.p)<=range&&los(G.p.x,G.p.y,e.x,e.y,true));}
function chargeLines(){
 const p=G.p,a=BAL.ability.charge,out=[];
 for(const [dx,dy] of DIRS){
  for(let k=1;k<=a.maxDist;k++){
   const x=p.x+dx*k,y=p.y+dy*k;
   if(!inb(x,y)||!walkable(x,y)||G.map[ix(x,y)]===3)break;
   const e=enemyAt(x,y);
   if(e){if(k>=a.minDist&&G.vis[ix(x,y)])out.push({e:e,lx:p.x+dx*(k-1),ly:p.y+dy*(k-1),dx:dx,dy:dy});break;}
  }
 }
 return out;
}
function blinkTiles(){
 const p=G.p,R=BAL.ability.blink.range,out=[],reach=bfsDist(p.x,p.y);   // only tiles you could also walk to: cave walls can leave sealed floor pockets that are visible but unreachable
 for(let y=p.y-R;y<=p.y+R;y++)for(let x=p.x-R;x<=p.x+R;x++){
  if(!inb(x,y)||Math.abs(x-p.x)+Math.abs(y-p.y)>R||(x===p.x&&y===p.y)||reach[ix(x,y)]>=9999)continue;
  const t=G.map[ix(x,y)];
  if(!G.vis[ix(x,y)]||(t!==1&&t!==2&&t!==4)||enemyAt(x,y)||merchantAt(x,y)||!los(p.x,p.y,x,y))continue;
  out.push([x,y]);
 }
 return out;
}
function groundTiles(range){
 const p=G.p,out=[];
 for(let y=p.y-range;y<=p.y+range;y++)for(let x=p.x-range;x<=p.x+range;x++){
  if(!inb(x,y)||Math.abs(x-p.x)+Math.abs(y-p.y)>range||!G.vis[ix(x,y)])continue;
  const t=G.map[ix(x,y)];if(t===0||t===5||merchantAt(x,y))continue;
  if(!los(p.x,p.y,x,y))continue;
  out.push([x,y]);
 }
 return out;
}
// valid target tiles for a targeted ability (also drives the highlight)
function targetTiles(k){
 if(!G)return [];
 switch(k){
  case 'bash':case 'backstab':return advEnemies(true).map(e=>[e.x,e.y]);
  case 'charge':return chargeLines().map(c=>[c.e.x,c.e.y]);
  case 'bolt':return enemyShots(BAL.ability.bolt.range).map(e=>[e.x,e.y]);
  case 'knife':return enemyShots(BAL.ability.knife.range).map(e=>[e.x,e.y]);
  case 'blink':return blinkTiles();
  case 'fire':return groundTiles(BAL.ability.fire.range);
  case 'smoke':return groundTiles(BAL.ability.smoke.range);
 }
 return [];
}
// reason an ability cannot be used right now ('' = usable)
function whyNot(k){
 const A=ABIL[k],c=costOf(k),p=G.p;
 if(G.cd[k]>0)return A.n+' is recharging ('+G.cd[k]+' turn'+(G.cd[k]>1?'s':'')+').';
 if(c.rage&&(p.rage||0)<c.rage)return 'Not enough rage for '+A.n+' (need '+c.rage+', have '+Math.floor(p.rage||0)+').';
 if(c.mana&&(p.mana||0)<c.mana)return 'Not enough mana for '+A.n+' (need '+c.mana+', have '+Math.floor(p.mana||0)+').';
 if(k==='knife'&&(G.knives||0)<1)return 'No knives left. Walk over a thrown knife to pick it up.';
 if((k==='cleave'||k==='nova')&&!chebEnemies().length)return A.n+' needs an enemy next to you.';
 if(A.tg!=='self'&&!targetTiles(k).length){
  return k==='charge'?'Charge needs an enemy in a straight line, '+BAL.ability.charge.minDist+'-'+BAL.ability.charge.maxDist+' tiles away.':
   (k==='bash'||k==='backstab')?A.n+' needs an enemy right next to you.':A.n+': no valid target in sight.';
 }
 return '';
}
function spend(k){
 const c=costOf(k),p=G.p;
 if(c.rage)p.rage=Math.max(0,(p.rage||0)-c.rage);
 if(c.mana)p.mana=Math.max(0,(p.mana||0)-c.mana);
 if(k==='knife')G.knives--;
 const cd=cdFor(k);if(cd)G.cd[k]=cd;
}
function breakVanish(){if(G.vanish>0){G.vanish=0;msg('You step out of the shadows.');}}
function stunEnemy(e,t,tb){
 if(e.dead||e.hp<=0)return;
 e.stun=Math.max(e.stun||0,EN[e.t].boss?tb:t);e.wind=null;floatFx(e.x,e.y,'stunned','#ffe066');
}
function lineDir(e){return [Math.sign(e.x-G.p.x),Math.sign(e.y-G.p.y)];}
// ---- the abilities. Each spends its cost, acts, then ends the turn. ----
const DO={
 bash:function(tx,ty){
  const e=enemyAt(tx,ty),a=BAL.ability.bash,p=G.p,[dx,dy]=lineDir(e);
  const victims=[e];
  if(eqKind('off')==='tower'){for(let k=2;k<=BAL.offhand.towerLine;k++){const x=p.x+dx*k,y=p.y+dy*k;if(!inb(x,y)||G.map[ix(x,y)]===0||G.map[ix(x,y)]===3||G.map[ix(x,y)]===5)break;const o=enemyAt(x,y);if(o)victims.push(o);}}
  spend('bash');breakVanish();
  for(const v of victims){
   const dmg=Math.max(1,Math.round(playerDmg()*a.mul));
   hurtEnemy(v,dmg,'#ffb04a',false,'melee');msg('Shield Bash hits the '+nm(v)+' for '+dmg+'.');lifeSteal(dmg);gainRage(BAL.rage.dealt);
   if(!v.dead&&v.hp>0){stunEnemy(v,a.stun,a.stunBoss);msg('The '+nm(v)+' is stunned.');if(v===e&&v.hp>0)knock(v,dx,dy);}
   settle(v);
  }
  endTurn();
 },
 cleave:function(){
  const a=BAL.ability.cleave,tg=chebEnemies();spend('cleave');breakVanish();
  msg('You cleave in a wide arc!');
  for(const e of tg){
   const dmg=Math.max(1,Math.round(playerDmg()*a.mul));
   hurtEnemy(e,dmg,'#ffb04a',false,'melee');lifeSteal(dmg);poison(e);
   gainRage(BAL.rage.dealt/2);if(eqKind('off')==='totem')gainRage(BAL.offhand.totemRage,true);
   settle(e);
  }
  endTurn();
 },
 charge:function(tx,ty){
  const c=chargeLines().find(l=>l.e.x===tx&&l.e.y===ty),a=BAL.ability.charge,p=G.p;
  spend('charge');breakVanish();walkTok++;
  p.x=c.lx;p.y=c.ly;msg('You charge!');
  const e=c.e,dmg=Math.max(1,Math.round(playerDmg()*a.mul));
  hurtEnemy(e,dmg,'#ffb04a',false,'melee');msg('Charge hits the '+nm(e)+' for '+dmg+'.');lifeSteal(dmg);gainRage(BAL.rage.dealt);
  if(!e.dead&&e.hp>0)stunEnemy(e,a.stun,a.stunBoss);
  if(pc('stampede'))for(const o of G.enemies)if(o!==e&&!o.dead&&cheb(o,p)<=1)stunEnemy(o,a.stun,a.stunBoss);
  settle(e);
  pickup();endTurn();
 },
 brace:function(){
  const a=BAL.ability.brace,O=BAL.offhand;
  const bulwark=eqKind('off')==='bulwark',retrib=pc('retrib');
  spend('brace');
  G.brace={hits:a.hits+(bulwark?O.bulwarkHits:0)+(retrib?BAL.perk.retribHits:0),t:a.turns,reflect:Math.max(a.reflect,bulwark?O.bulwarkReflect:0,retrib?BAL.perk.retribReflect:0)};
  floatFx(G.p.x,G.p.y,'BRACE','#9cf');msg('You brace: the next '+G.brace.hits+' hits are halved and '+Math.round(G.brace.reflect*100)+'% is reflected.');
  endTurn();
 },
 bolt:function(tx,ty){
  const e=enemyAt(tx,ty),a=BAL.ability.bolt,p=G.p;spend('bolt');breakVanish();
  const hit=[e];
  if(eqKind('off')==='lens'){
   const dx=e.x-p.x,dy=e.y-p.y,n=Math.max(Math.abs(dx),Math.abs(dy));
   for(let s=n+1;s<=n+BAL.ability.bolt.range&&hit.length<1+BAL.offhand.lensPierce;s++){
    const x=Math.round(p.x+dx*s/n),y=Math.round(p.y+dy*s/n);
    if(!inb(x,y)||G.map[ix(x,y)]===0||G.map[ix(x,y)]===3||G.map[ix(x,y)]===5)break;
    const o=enemyAt(x,y);if(o&&hit.indexOf(o)<0)hit.push(o);
   }
  }
  for(const v of hit){
   const dmg=Math.max(1,Math.round((playerDmg(true)*a.mul+a.add)*spellMul()));
   hurtEnemy(v,dmg,'#b48cff',false,'ranged');msg('Arcane Bolt hits the '+nm(v)+' for '+dmg+'.');
   poison(v);settle(v);
  }
  endTurn();
 },
 nova:function(){
  const a=BAL.ability.nova,tg=chebEnemies();spend('nova');breakVanish();
  floatFx(G.p.x,G.p.y,'NOVA','#9fe8ff');msg('A frost nova bursts around you!');
  const burn=BAL.offhand.tomeBurnBase+Math.floor(G.floor/BAL.offhand.tomeBurnFloorDiv);
  for(const e of tg){
   const dmg=Math.max(1,Math.round(playerDmg(true)*a.mul*spellMul()));
   hurtEnemy(e,dmg,'#9fe8ff',false,'magic');
   if(!e.dead&&e.hp>0){
    e.frz=Math.max(e.frz||0,EN[e.t].boss?a.freezeBoss:a.freeze+(pc('deepfreeze')?BAL.perk.freezeExtra:0));e.wind=null;floatFx(e.x,e.y,'frozen','#9fe8ff');
    if(eqKind('off')==='tome')e.pois={t:BAL.offhand.tomeBurnTurns,d:burn,burn:1};
   }
   settle(e);
  }
  endTurn();
 },
 blink:function(tx,ty){
  const p=G.p;spend('blink');walkTok++;
  floatFx(p.x,p.y,'blink','#d9c6ff');p.x=tx;p.y=ty;msg('You blink away.');
  pickup();if(G.map[ix(tx,ty)]===2)msg('Stairs! Tap yourself to descend.');
  endTurn();
 },
 fire:function(tx,ty){
  const a=BAL.ability.fire,O=BAL.offhand,prism=eqKind('off')==='prism';
  spend('fire');breakVanish();
  const R=a.radius+(prism?O.prismRadius:0);
  const dmg=Math.max(1,Math.round((a.base+a.perFloor*G.floor)*G.p.fireMul*spellMul()*(prism?O.prismMul:1)));
  floatFx(tx,ty,'BOOM','#ff9a3a',true);msg('Fireball! '+dmg+' damage in a '+(R*2+1)+'x'+(R*2+1)+' blast.');
  if(!rmo())puffs.push({x:tx,y:ty,t:performance.now(),s:Math.random()*6});
  for(const e of G.enemies.slice())if(!e.dead&&Math.max(Math.abs(e.x-tx),Math.abs(e.y-ty))<=R){hurtEnemy(e,dmg,'#ff7a2a',false,'magic');settle(e);}
  endTurn();
 },
 backstab:function(tx,ty){
  const e=enemyAt(tx,ty),a=BAL.ability.backstab,p=G.p;
  const cond=!e.awake||e.stun>0||e.frz>0||e.blind>0||isBehind(e);
  spend('backstab');breakVanish();
  let mul=cond?a.mul*(1+(pc('assassin')?BAL.perk.assassinMul:0))+(wpK()&&wpK().sneak||0):a.weakMul;
  const strikes=eqKind('off')==='dagger2'?[1,BAL.offhand.dagger2Frac]:[1];
  for(const f of strikes){
   if(e.dead||e.hp<=0)break;
   const crit=rf()<critChance();let dmg=Math.max(1,Math.round(playerDmg()*mul*f*(crit?BAL.combat.critMul:1)));
   hurtEnemy(e,dmg,cond?'#ff5a8a':'#ffd24a',crit,'melee');
   msg((cond?'Backstab! ':'Clumsy stab. ')+'You hit the '+nm(e)+' for '+dmg+'.');sfx(cond?'crit':'hit');if(cond)shake(4);
   lifeSteal(dmg);poison(e);settle(e);
  }
  endTurn();
 },
 vanish:function(){
  spend('vanish');walkTok++;G.vanish=BAL.ability.vanish.turns+(pc('shadow')?BAL.perk.shadowTurns:0);
  for(const e of G.enemies)e.awake=false;
  floatFx(G.p.x,G.p.y,'vanish','#cfc');msg('You vanish. Enemies lose track of you.');endTurn();
 },
 knife:function(tx,ty){
  const e=enemyAt(tx,ty),a=BAL.ability.knife,p=G.p;spend('knife');breakVanish();
  const crit=rf()<critChance();
  let dmg=Math.round(playerDmg()*a.mul)+a.add;
  const sn=(p.cls==='rogue'?BAL.combat.sneakMul:1)+(wpK()&&wpK().sneak||0);
  if(crit)dmg*=BAL.combat.critMul;
  if(!e.awake&&sn>1){dmg*=sn;msg('Sneak attack!');}
  dmg=Math.max(1,dmg);
  hurtEnemy(e,dmg,crit?'#ff8a3a':'#ffd24a',crit,'ranged');msg('Your knife hits the '+nm(e)+' for '+dmg+'.');
  lifeSteal(dmg);poison(e);settle(e);
  if(e.dead&&G.syn.sd){G.knives=Math.min(maxKnives(),G.knives+1);msg('Silent Death: the knife returns to your hand.');}
  else dropAt(tx,ty,{t:'knife',v:0});
  endTurn();
 },
 smoke:function(tx,ty){
  const a=BAL.ability.smoke,O=BAL.offhand,sat=eqKind('off')==='satchel';
  const R=a.radius+(sat?O.satchelRadius:0),cells=[];
  spend('smoke');breakVanish();
  for(let y=ty-R;y<=ty+R;y++)for(let x=tx-R;x<=tx+R;x++)if(inb(x,y)&&G.map[ix(x,y)]!==0&&G.map[ix(x,y)]!==5)cells.push(ix(x,y));
  (G.smoke=G.smoke||[]).push({cells:cells,t:a.turns+(sat?O.satchelTurns:0)});
  floatFx(tx,ty,'SMOKE','#ccd',true);msg('A smoke cloud blooms. Enemies inside are blinded.');
  for(const e of G.enemies){
   if(cells.indexOf(ix(e.x,e.y))<0)continue;
   e.blind=a.blindTurns;e.wind=null;if(!EN[e.t].boss)e.awake=false;
  }
  endTurn();
 }
};
// run an ability by key (the bot and the buttons both come through here). Returns true if the turn was used.
function useAbility(k,tx,ty){
 if(!G||G.over||modalOpen())return false;
 const why=whyNot(k);
 if(why){msg(why);render();return false;}
 const A=ABIL[k];
 if(A.tg!=='self'){
  if(tx==null||!targetTiles(k).some(t=>t[0]===tx&&t[1]===ty)){msg(A.n+': tap a highlighted target.');render();return false;}
 }
 armed=null;
 DO[k](tx,ty);
 return true;
}
function toggleAbility(k){
 walkTok++;if(!G||G.over||modalOpen())return;
 if(armed===k){cancelTarget();return;}
 const why=whyNot(k);
 if(why){msg(why);if(armed){armed=null;}render();return;}
 if(ABIL[k].tg==='self'){useAbility(k);return;}
 armed=k;msg(ABIL[k].n+' armed: tap a highlighted target (tap yourself or Cancel to back out).');render();
}
function cancelTarget(){if(armed){armed=null;msg('Cancelled.');}render();}
// ---- weapon reach (spear) ----
function reachOk(e){
 const wk=wpK();if(!wk||!wk.reach||!e||e.dead||!G.vis[ix(e.x,e.y)])return false;
 const p=G.p,dx=e.x-p.x,dy=e.y-p.y;
 if(!((dx===0&&Math.abs(dy)===wk.reach)||(dy===0&&Math.abs(dx)===wk.reach)))return false;
 const sx=Math.sign(dx),sy=Math.sign(dy);
 for(let k=1;k<wk.reach;k++){const x=p.x+sx*k,y=p.y+sy*k;if(!walkable(x,y)||G.map[ix(x,y)]===3||enemyAt(x,y))return false;}
 return true;
}
function reachAttack(e){
 if(!G||G.over||!reachOk(e))return false;
 walkTok++;msg('You thrust your spear.');playerAttack(e);endTurn();return true;
}

// player.js - class lookup and XP / level-up progression.

function clsOf(p){return CLS[p.cls]||CLS.warrior;}

function deathTip(){

 if(/spike|trap|dart/.test(k))return 'Traps are drawn once you stand next to them. Walk around drawn traps (Explore does it for you), and never rush through unexplored rooms at low HP.';
 if(/poison/.test(k))return 'Poison ticks every turn. A potion cures it - drink one before it stacks with enemy hits.';
 if(/archer|warlock/.test(k))return 'Archers and warlocks need a clear line of sight. Break the line around a corner or a door, then close in.';
 if(/troll|dragon/.test(k))return 'Red hatched tiles mark the next big hit. Step off them (one tile is enough) and it deals nothing.';
 if(/guard/.test(k))return 'Guards shrug off '+pct(1-BAL.weapon.shieldFront)+' of frontal damage and '+pct(1-BAL.weapon.shieldRanged)+' of ranged hits. Stun or freeze one (Bash, Charge, Nova) or hit it from behind.';
 if(/hound/.test(k))return 'Hounds move two tiles per turn: you cannot kite them. Meet them in melee, or stun them as they arrive.';
 if(/cultist/.test(k))return 'Cultists heal their friends. Dive them first: Charge, Blink or throw a knife.';
 if(/\b(rat|bat|whelp)\b/.test(k))return 'Packs wear you down. Hold a corridor, or use Cleave, Frost Nova, Fireball or a Smoke Bomb.';
 if(/ogre/.test(k))return 'Ogres act every other turn. Hit while the hourglass shows, then step back before it swings.';
 if(/wall|impact/.test(k))return 'Knockback into a wall or door adds damage. Fight with open floor behind you.';
 if(/shrine|curse/.test(k))return 'Gambles and cursed gear cost HP. Check your HP before praying at a shrine.';
 if(/elite/.test(k))return 'Elite enemies are tougher than they look. Lure them into a corridor, use flame scrolls, or skip the treasure room.';
 if(G.inv.pot>0)return 'You died holding '+G.inv.pot+' potion'+(G.inv.pot>1?'s':'')+'. Drink at about 40% HP - it costs a turn but saves the run.';
 if(G.p.hp<=0&&G.inv.fire>0)return 'You died with a flame scroll unused. It hits everything in sight - use it when a crowd closes in.';

}

// Tapping the stairs: below floor 1..MAXF-2 you choose between two floors; into the dragon lair there is only one way.
function descend(){
 if(!G||G.over)return;
 if(G.map[ix(G.p.x,G.p.y)]!==2){msg('No stairs here. Stand on the ▼ tile first.');return;}
 walkTok++;
 const nf=G.floor+1;
 if(nf<MAXF){if(!G.opts)G.opts=rollOpts(nf);showBranch();return;}
 goDown({mod:null,v:0});
}
function goDown(opt){
 if(!G||G.over)return;
 walkTok++;sfx('stairs');
 G.stopWalk=false;
 if(G.mod)meta.mods[G.mod]=1;   // survived a floor of this modifier
 newFloor(G.floor+1,opt);
 const p=G.p;
 if(p.renew>0){p.hp=Math.min(p.mhp,p.hp+Math.round(p.mhp*p.renew));}
 if(G.floor===BAL.ach.noArmorFloor&&!p.eq.armor)earn('bare');
 meta.best=Math.max(meta.best,G.floor);saveMeta();checkAch();
 msg('Floor '+G.floor+' - '+themeOf(G.floor,G.variant).n+(G.floor===MAXF?' (dragon lair!)':'')+'.');

}

// walk.js - player movement, auto-walk, Explore, and tap handling.

function tryMove(dx,dy){
 const p=G.p,nx=p.x+dx,ny=p.y+dy;
 if(inb(nx,ny)&&G.map[ix(nx,ny)]===5){
  if(G.keys>0){G.keys--;G.map[ix(nx,ny)]=4;msg('The key turns - the treasure room is open!');endTurn();return true;}
  msg('Locked. The key is carried by the marked elite (gold ring and star) on this floor.');render();return false;}
 if(merchantAt(nx,ny)){showShop();return false;}
 if(!walkable(nx,ny))return false;
 const e=enemyAt(nx,ny);
 if(e){playerAttack(e);endTurn();return true;}
 if(G.map[ix(nx,ny)]===3){G.map[ix(nx,ny)]=4;msg('You open the door.');endTurn();return true;}
 p.x=nx;p.y=ny;pickup();
 if(waterSet().has(ix(nx,ny)))G.wade=1;
 if(G.map[ix(nx,ny)]===2){msg('Stairs! Tap yourself to descend.');G.stopWalk=true;}
 endTurn();return true;
}
function wait(){msg('You wait.');endTurn();}
function startWalk(path,opts){
 opts=opts||{};
 const tok=++walkTok;
 const stop=function(){if(dest&&dest.tok===tok){dest=null;if(G)render();}};
 const step=function(){
  if(tok!==walkTok||!G||G.over||modalOpen()||!path.length)return;
  const p=G.p,tz=trapSet();
  if(tz.has(ix(path[0][0],path[0][1]))){
   const l=path[path.length-1],np=bfsPath(p.x,p.y,l[0],l[1]);
   if(np&&np.length&&!np.some(t=>tz.has(ix(t[0],t[1])))){path.length=0;for(const t of np)path.push(t);}
   else{msg('A trap blocks the way - walk around it.');stop();return;}
  }
  const nx=path[0][0],ny=path[0][1];
  if(enemyAt(nx,ny)){stop();return;}
  const dz=dangerSet();
  if(dz.size&&(dangerNear(dz)||dz.has(ix(nx,ny)))){msg('Danger tiles! Auto-walk stopped.');stop();return;}
  if(G.cracks.length&&crackSet().has(ix(nx,ny))){msg('The floor ahead is cracking - wait or go around.');stop();return;}
  if(G.map[ix(nx,ny)]!==3&&G.map[ix(nx,ny)]!==5)path.shift();
  const hp0=p.hp,v0=visIds(),f0=G.floor;G.stopWalk=false;
  if(!tryMove(nx-p.x,ny-p.y)){stop();return;}
  if(!G||G.over||G.floor!==f0||p.hp<hp0||G.stopWalk||modalOpen()){stop();return;}
  const v1=visIds();if(v1.some(id=>v0.indexOf(id)<0)){stop();return;}
  if(opts.explore&&G.enemies.some(e=>e.awake&&G.vis[ix(e.x,e.y)])){stop();return;}
  if(path.length)setTimeout(step,70);else{stop();if(opts.done&&G&&!G.over&&!modalOpen())opts.done();}
 };
 if(path.length){const l=path[path.length-1];dest={x:l[0],y:l[1],tok:tok};}
 step();
}
function explore(){
 if(!G||G.over||modalOpen())return;walkTok++;
 const p=G.p;
 if(G.enemies.some(e=>e.awake&&G.vis[ix(e.x,e.y)])){msg('Enemy in sight - tap it to attack, or tap a tile to move.');render();return;}
 const dz=dangerSet();
 if(dz.size&&dangerNear(dz)){msg('Danger tiles nearby - step away first.');render();return;}
 // unnoticed enemies: keep exploring, but try not to step next to them
const tz=trapSet(),cz=crackSet();
 const sleepers=G.enemies.filter(e=>!e.awake&&G.vis[ix(e.x,e.y)]);
 const near=new Set();for(const e of sleepers)for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)near.add(ix(e.x+dx,e.y+dy));
 const search=function(avoid){
  const prev=new Map();prev.set(ix(p.x,p.y),-1);const q=[[p.x,p.y]];let goal=-1;
  for(let i=0;i<q.length&&goal<0;i++){const [x,y]=q[i];
   for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,k=ix(nx,ny);
    if(!inb(nx,ny)||prev.has(k)||!G.seen[k]||G.map[k]===0||G.map[k]===5||merchantAt(nx,ny)||tz.has(k)||cz.has(k)||enemyAt(nx,ny)||dz.has(k)||(avoid&&near.has(k)))continue;
    prev.set(k,ix(x,y));q.push([nx,ny]);
    if(!G.exp[k]||G.map[k]===3){goal=k;break;}}}
  return {prev:prev,goal:goal};
 };
 let res=search(sleepers.length>0);
 if(res.goal<0&&sleepers.length)res=search(false);
 const prev=res.prev;let goal=res.goal;
 if(goal<0){
  // go to stairs if seen
  for(let k=0;k<W*H;k++)if(G.map[k]===2&&G.seen[k]){const pa=bfsPath(p.x,p.y,k%W,Math.floor(k/W));if(pa&&pa.length){msg('Explored. Heading to the stairs.');startWalk(pa);return;}}
  msg('Nothing left to explore.');render();return;
 }
 const path=[];let k=goal;while(k!==ix(p.x,p.y)){path.push([k%W,Math.floor(k/W)]);k=prev.get(k);}
 startWalk(path.reverse(),{explore:true});
}
function itemName(it){
 const base={gold:'Gold pile',potion:'Health potion',fire:'Flame scroll',tele:'Teleport scroll',knife:'Throwing knife'}[it.t];
 return base||(gearName(it)+': '+itemDesc(it).replace(/\.$/,''));
}
function onTap(tx,ty){
 walkTok++;
 if(!G||G.over||modalOpen())return;
 const p=G.p;
 if(armed){
  if(!inb(tx,ty))return;
  if(tx===p.x&&ty===p.y){cancelTarget();return;}
  tapMark={x:tx,y:ty,t:performance.now()};
  useAbility(armed,tx,ty);
  render();return;
 }
 if(inb(tx,ty)){tapMark={x:tx,y:ty,t:performance.now()};render();}
 if(tx===p.x&&ty===p.y){
  const sh=G.shrine;
  if(sh&&!sh.used&&sh.x===p.x&&sh.y===p.y){showShrine();return;}
  if(G.map[ix(tx,ty)]===2)descend();else wait();return;}
 if(!inb(tx,ty)||!G.seen[ix(tx,ty)]||G.map[ix(tx,ty)]===0){msg('Tap an explored floor tile.');return;}
 const adj=Math.abs(tx-p.x)+Math.abs(ty-p.y)===1;
 if(merchantAt(tx,ty)){
  if(adj){showShop();return;}
  const mp=bfsPath(p.x,p.y,tx,ty);
  if(mp&&mp.length>1){mp.pop();startWalk(mp,{done:showShop});}else msg("Can't reach the merchant.");
  return;}
 if(G.map[ix(tx,ty)]===5){
  if(adj){tryMove(tx-p.x,ty-p.y);return;}
  const lp=bfsPath(p.x,p.y,tx,ty);
  if(lp&&lp.length>1){lp.pop();startWalk(lp,{done:function(){if(G&&!G.over)tryMove(tx-G.p.x,ty-G.p.y);}});}else msg("Can't reach the locked door.");
  return;}
 {const tk=ix(tx,ty),rt=trapSet().has(tk);
  if(rt&&trapConfirm!==tk){const t=G.traps.find(a=>a.x===tx&&a.y===ty&&!a.done);trapConfirm=tk;msg(TRAPS[t.k].n+'! Tap it again if you really want to step on it.');return;}
  if(!rt)trapConfirm=-1;
  if(rt&&!adj){msg('Walk around the trap - Explore and auto-walk avoid it.');return;}}
 const e=enemyAt(tx,ty);
 if(e&&G.vis[ix(tx,ty)]){
  if(Math.abs(e.x-p.x)+Math.abs(e.y-p.y)===1){tryMove(e.x-p.x,e.y-p.y);return;}
  if(reachOk(e)){reachAttack(e);return;}
  const d=EN[e.t];
  msg((e.elite?'ELITE '+d.n+' '+e.name:d.n)+' HP '+e.hp+'/'+e.mhp+', ATK '+e.atk+'. '+d.tr+(e.pois?' Poisoned ('+e.pois.t+'t).':'')+(e.stun>0?' Stunned ('+e.stun+'t).':'')+(e.frz>0?' Frozen ('+e.frz+'t).':'')+(e.blind>0?' Blinded.':'')+(e.wind?' WINDING UP!':'')+(e.awake?'':' Unaware.'));
  const path=bfsPath(p.x,p.y,tx,ty);
  if(path&&path.length>1){path.pop();startWalk(path);}else msg("Can't reach it.");
  return;
 }
 const it=itemAt(tx,ty);if(it)msg(itemName(it)+'.');
 if(Math.abs(tx-p.x)+Math.abs(ty-p.y)===1){tryMove(tx-p.x,ty-p.y);return;}
 const path=bfsPath(p.x,p.y,tx,ty);
 if(!path||!path.length){msg("Can't reach that.");return;}
 startWalk(path);
}

// cheap status for a button: never scans the map for tile targets (render runs every animation frame)
function abStatus(k){
 const A=ABIL[k],c=costOf(k),p=G.p;
 if(G.cd[k]>0)return {dis:1,sub:'⏳ '+G.cd[k]};
 if(c.rage&&(p.rage||0)<c.rage)return {dis:1,sub:c.rage+' rage'};
 if(c.mana&&(p.mana||0)<c.mana)return {dis:1,sub:c.mana+' mana'};
 if(k==='knife'&&(G.knives||0)<1)return {dis:1,sub:'no knives'};
 if((k==='cleave'||k==='nova'||k==='bash'||k==='backstab')&&!(k==='bash'||k==='backstab'?advEnemies(true):chebEnemies()).length)return {dis:1,sub:costLabel(k)};
 if(k==='charge'&&!chargeLines().length)return {dis:1,sub:costLabel(k)};
 if((k==='bolt'||k==='knife')&&!enemyShots(BAL.ability[k].range).length)return {dis:1,sub:k==='knife'?'×'+G.knives:costLabel(k)};
 return {dis:0,sub:k==='knife'?'×'+G.knives:costLabel(k)};
}

// auto.js - Auto (autopilot): plays the run by calling the same action functions a tap would (tryMove, useAbility, drink, descend, the dialog buttons).
// One decision per timer tick (one turn, or one dialog choice). It is deliberately a simple player: no kiting, no retreating to regenerate.

const AUTO_SPEED_KEY='dcr_auto_speed',RANGED=['cultist','archer','warlock'];
const AUTO={on:false,tm:null,pick:null,speed:1,self:false,uiKey:'',ignore:new Set(),shopped:{},bad:new Set(),uses:{},uses8:{},ticks:0,modals:0,idle:0,mrun:0,hold:0,lastProg:0,pf:0,pexp:0,hp:1e9,kills:0,err:null,lastStop:''};
try{const s=+localStorage.getItem(AUTO_SPEED_KEY);if(BAL.auto.speeds.indexOf(s)>=0)AUTO.speed=s;}catch(e){}
function autoGoldWord(){return BAL.auto.goldMul===0.5?'half':Math.round(BAL.auto.goldMul*100)+'%';}
function autoDelay(flash){return Math.max(15,(flash?BAL.auto.flashMs:BAL.auto.tickMs)/AUTO.speed);}
// exactly one pending timer, ever: scheduling always cancels the previous one
function autoSchedule(ms){if(AUTO.tm)clearTimeout(AUTO.tm);AUTO.tm=setTimeout(autoTick,ms);}
function autoReset(){
 if(AUTO.tm){clearTimeout(AUTO.tm);AUTO.tm=null;}
 AUTO.on=false;AUTO.pick=null;AUTO.self=false;AUTO.ignore=new Set();AUTO.shopped={};AUTO.bad=new Set();AUTO.uses={};AUTO.uses8={};AUTO.ticks=0;AUTO.modals=0;AUTO.idle=0;AUTO.mrun=0;AUTO.hp=1e9;AUTO.kills=0;AUTO.err=null;AUTO.lastStop='';AUTO.pf=0;AUTO.pexp=0;AUTO.lastProg=0;AUTO.uiKey='';AUTO.fg=null;AUTO.sg=null;AUTO.last='';AUTO.tr=[];AUTO.pos=[];AUTO.loops=0;AUTO.hold=0;AUTO.crossed=0;
}
function autoStart(sync){
 if(!G||G.over||!G.auto||$('title').style.display!=='none')return false;
 walkTok++;armed=null;
 G.auto.on=1;AUTO.on=true;AUTO.pick=null;AUTO.idle=0;AUTO.mrun=0;AUTO.hp=1e9;AUTO.kills=G.kills;AUTO.pf=G.floor;AUTO.pexp=-1;AUTO.lastProg=G.turn;AUTO.lastStop='';AUTO.err=null;
 if(!G.auto.noticed){G.auto.noticed=1;const t='Auto runs bank '+autoGoldWord()+' gold.';msg(t);toast('🤖 '+t,4200);}
 msg('Auto on. Tap the map to take over.');
 save();render();
 if(!sync)autoSchedule(autoDelay(false));
 return true;
}
// why = log line (null: none). quiet = no save/render (the run is ending or being replaced).
function autoStop(why,quiet){
 if(AUTO.tm){clearTimeout(AUTO.tm);AUTO.tm=null;}
 const was=AUTO.on;AUTO.on=false;
 if(AUTO.pick){try{AUTO.pick.btn.classList.remove('autopick');}catch(e){}AUTO.pick=null;}
 if(G&&G.auto)G.auto.on=0;
 if(!was)return;
 AUTO.lastStop=why||'run ended';
 if(quiet||!G||G.over)return;
 if(why)msg(why);
 save();render();
}
function autoToggle(){if(!G||G.over)return;if(AUTO.on)autoStop('Auto off. You are in control.');else autoStart();}
function autoSpeedCycle(){
 const sp=BAL.auto.speeds;AUTO.speed=sp[(sp.indexOf(AUTO.speed)+1)%sp.length];
 try{localStorage.setItem(AUTO_SPEED_KEY,String(AUTO.speed));}catch(e){}
 if(AUTO.on&&AUTO.tm)autoSchedule(autoDelay(!!AUTO.pick));
 AUTO.uiKey='';autoUi();
}
// the button, speed button, amber frame and the "AUTO" strip (called from updateHud, so it follows every render)
function autoUi(){
 const show=!!G&&!G.over,on=show&&!!(G.auto&&G.auto.on),key=(show?1:0)+'|'+(on?1:0)+'|'+AUTO.speed;
 if(key===AUTO.uiKey)return;AUTO.uiKey=key;
 $('autoBox').style.display=show?'flex':'none';
 const b=$('autoBtn');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');
 b.innerHTML=on?'⏸ AUTO <small>ON</small>':'🤖 AUTO';
 const sp=$('autoSpd');sp.style.display=on?'block':'none';sp.textContent=AUTO.speed+'×';
 $('cv').classList.toggle('auto',on);$('autoTag').style.display=on?'block':'none';
}
$('autoBtn').addEventListener('click',function(){autoToggle();});
$('autoSpd').addEventListener('click',function(){autoSpeedCycle();});
// any tap that is not on the Auto controls gives control back. A tap on the map is swallowed (it must not also move you);
// a tap on a real button (potion, a dialog choice) stops Auto and then does what that button does.
document.addEventListener('click',function(ev){
 if(!AUTO.on||AUTO.self||!G||!G.auto||!G.auto.on)return;
 const t=ev.target;if(t&&t.closest&&t.closest('#autoBox'))return;
 autoStop('You took over: Auto is off.');
 if(t===cv)ev.stopPropagation();
},true);
document.addEventListener('keydown',function(ev){
 if(!AUTO.on||AUTO.self||!G||!G.auto||!G.auto.on||ev.ctrlKey||ev.metaKey||ev.altKey||ev.key==='Shift')return;
 autoStop('You took over: Auto is off.');ev.stopPropagation();ev.preventDefault();
},true);
document.addEventListener('visibilitychange',function(){if(document.hidden&&AUTO.on)autoStop('Page hidden: Auto paused.');});

function autoTick(){
 AUTO.tm=null;
 if(!AUTO.on)return;
 if(!G||G.over||!G.auto||!G.auto.on){autoStop(null,true);return;}
 if(document.hidden){autoStop('Page hidden: Auto paused.');return;}
 let r='off';
 try{r=autoStep(false);}catch(e){AUTO.err=String(e&&e.stack||e);autoStop('Auto stopped: internal error.');return;}
 if(AUTO.on)autoSchedule(autoDelay(r==='flash'));
}
// one decision. sync=true (simulator / tests) resolves dialogs at once instead of flashing them.
function autoStep(sync){
 if(!AUTO.on||!G||G.over||!G.auto)return 'off';
 if($('title').style.display!=='none'){autoStop('Auto paused: title screen.');return 'off';}
 AUTO.self=true;
 try{
  G.auto.used=1;AUTO.ticks++;
  if($('modal').style.display!=='none')return autoModal(sync);
  return autoAct();
 }finally{AUTO.self=false;}
}

// ---------------- dialogs ----------------
function autoModal(sync){
 const box=$('modalBox');
 if(++AUTO.mrun>40){autoStop('Auto stopped: stuck in dialogs.');return 'off';}
 let pk=AUTO.pick;
 if(!pk||!box.contains(pk.btn)||pk.btn.disabled){
  pk=autoChoose(box.dataset.kind||'',box);
  if(!pk||!pk.btn){AUTO.pick=null;autoStop('Auto stopped: an unknown dialog needs you.');return 'off';}
  AUTO.pick=pk;pk.btn.classList.add('autopick');msg('Auto: '+pk.why);
  if(!sync)return 'flash';
 }
 AUTO.pick=null;pk.btn.classList.remove('autopick');AUTO.modals++;
 pk.btn.click();
 return 'modal';
}

// ---------------- watchdog ----------------
function autoCountExp(){let n=0;for(let i=0;i<G.exp.length;i++)if(G.exp[i])n++;return n;}

function autoWatch(t0,f0){

 if(G.floor!==AUTO.pf){AUTO.pf=G.floor;AUTO.pexp=exp;AUTO.bad=new Set();AUTO.pos=[];AUTO.fg=null;AUTO.sg=null;AUTO.hp=tot;AUTO.kills=G.kills;prog=true;}
 else{
  if(exp>AUTO.pexp){AUTO.pexp=exp;prog=true;}
  if(G.kills>AUTO.kills){AUTO.kills=G.kills;prog=true;}
  if(tot<AUTO.hp){AUTO.hp=tot;prog=true;}
 }
 if(prog)AUTO.lastProg=G.turn;
 const idle=G.turn===t0&&G.floor===f0&&$('modal').style.display==='none';
 AUTO.idle=idle?AUTO.idle+1:0;
 if(G.turn-AUTO.lastProg>=BAL.auto.stuckTurns)return 'no progress for '+BAL.auto.stuckTurns+' turns';

// ---------------- acting ----------------
function autoAct(){

// who to shoot first: healers, then archers / warlocks, then the nearest

// tough foes (a Guard's shield, an Ogre, a Troll, elites, the boss) are worth a stun / freeze / blind before trading blows; not if already disabled
function autoGuarded(e){return (e.t==='guard'||e.t==='ogre'||e.t==='troll'||e.elite||EN[e.t].boss)&&!(e.stun>0||e.frz>0||e.blind>0);}
function autoUse(k,tx,ty){

function autoNote(s){(AUTO.tr||(AUTO.tr=[])).push(G.turn+':'+G.p.x+','+G.p.y+' '+s);if(AUTO.tr.length>24)AUTO.tr.shift();}   // short trail of what Auto did, for the dbg API / watchdog reports

 {const hpf=p.hp/p.mhp,sg=AUTO.sg;
