// idle.js - the idle / meta layer: upgrade levels and prices, blueprints, Heat, expeditions (the offline outcome model) and Auto's idle pay.
// The screens are in idleui.js; every number is in balance.js (BAL.upg / heat / exp / bp, UPG, PAIRS, HEAT, BPS, EXP_TABLE).

// ---------- upgrades ----------
function upLvl(k){return (meta.up&&meta.up[k])|0;}
function upItem(k){return UPG.find(u=>u.k===k)||PAIRS.find(q=>q.k===k)||null;}
function upShown(u,l){const v=upVal(u,l);return u.int?Math.round(v):v;}   // atk / def are whole numbers (half levels round)
function upBonus(k){const u=UPG.find(x=>x.k===k);return u?upShown(u,upLvl(k))+((meta.leg&&meta.leg[k])|0):0;}   // level bonus plus the veteran bonus of a migrated save
function upNext(it){const l=upLvl(it.k);return l>=upMax(it)?0:upCost(it,l);}
function upSpent(){let t=0;for(const it of UPG.concat(PAIRS))for(let l=0;l<upLvl(it.k);l++)t+=upCost(it,l);return t;}   // the "upgrade power": gold put into levels
function upMaxSpent(){let t=0;for(const it of UPG.concat(PAIRS))for(let l=0;l<upMax(it);l++)t+=upCost(it,l);return t;}
function upBuy(k){
 const it=upItem(k);if(!it)return false;
 const l=upLvl(k),c=upNext(it);
 if(l>=upMax(it)||meta.gold<c)return false;
 meta.gold-=c;meta.up[k]=l+1;saveMeta();return true;
}
function pairVar(q){return q.v[meta.pv[q.k]===1?1:0];}
function pairFee(q){return upLvl(q.k)>0?BAL.upg.switchFee:0;}   // a pair with no level yet is free to set
function pairSwitch(k){
 const q=PAIRS.find(x=>x.k===k);if(!q)return false;
 const fee=pairFee(q);if(meta.gold<fee)return false;
 meta.gold-=fee;meta.pv[k]=meta.pv[k]===1?0:1;saveMeta();return true;
}
// text for a card: what the current level gives and what the next one adds
// what one level of a pair variant gives, said BEFORE paying: 'Keen +2% crit per level'
function pairPer(q,v){return v.n+' '+v.d(1)+(q.max>1?' per level':'');}
function upText(it){
 const l=upLvl(it.k),mx=upMax(it);
 if(it.steps){
  const v=upBonus(it.k),leg=(meta.leg&&meta.leg[it.k])|0,n=l<mx?upShown(it,l+1)-upShown(it,l):0,u=it.u;   // the real total, veteran bonus of a migrated save included
  return '+'+v+u+(it.k==='pot'&&v!==1?'s':'')+(leg?' (incl. '+leg+' veteran)':'')+(n?' · next +'+n:' · MAX');
 }
 const va=pairVar(it);
 return (l?va.d(l):pairPer(it,va))+(l&&l>=mx?' · MAX':'');
}

// ---------- Heat ----------
function heatMax(){return Math.min(BAL.heat.max,Math.max(meta.heat|0,meta.wins>=1?1:0));}   // highest Heat that can be started (a win has always unlocked Heat 1)
function heatSel(){return Math.min(heatMax(),meta.heatSel|0);}
function heatGold(h){return BAL.heat.goldMul[Math.max(0,Math.min(BAL.heat.max,h|0))]||1;}
function heatScore(h){return BAL.heat.scoreMul[Math.max(0,Math.min(BAL.heat.max,h|0))]||1;}
// a won run at the highest unlocked Heat opens the next one. Returns the new Heat or 0.
function heatAfterWin(h){
 if(h<1||h<heatMax()||h>=BAL.heat.max)return 0;
 meta.heat=h+1;return h+1;
}

// ---------- blueprints ----------
function bpState(id){return (meta.bp&&meta.bp[id])|0;}
function bpOn(id){return bpState(id)===2;}
function bpOf(id){return BPS.find(b=>b.id===id)||null;}
function bpCounts(){let f=0,u=0;for(const b of BPS){const s=bpState(b.id);if(s>=1)f++;if(s===2)u++;}return {found:f,unlocked:u,total:BPS.length};}
function bpFound(id){if(!bpOf(id)||bpState(id))return false;meta.bp[id]=1;saveMeta();return true;}
function bpBuy(id){
 const b=bpOf(id);if(!b||bpState(id)!==1)return false;
 const c=BAL.bp.cost[b.tier];if(meta.gold<c)return false;
 meta.gold-=c;meta.bp[id]=2;saveMeta();return true;
}
// a blueprint of one of `tiers` that is not found yet (rng() in [0,1)), or null
function bpPick(tiers,rng){
 const pool=BPS.filter(b=>tiers.indexOf(b.tier)>=0&&!bpState(b.id));
 return pool.length?pool[Math.floor(rng()*pool.length)]:null;
}
// blueprint dropped by a finished manual run: best ones from the dragon or Heat 1+ runs, better ones from floor 5+. Auto runs find none. Returns the blueprint or null.
function bpRunDrop(won){
 const B=BAL.bp,g=G;if(!g||(g.auto&&g.auto.used))return null;
 const rng=Math.random,heat=g.heat|0,deep=g.floor>=B.deepFrom;
 let b=null;
 if(won&&rng()<(heat>=1?B.bestHeatWin:B.bestWin))b=bpPick(['b'],rng);
 else if(deep&&heat>=1&&rng()<B.bestHeat)b=bpPick(['b'],rng);
 if(!b&&deep&&rng()<B.deepChance)b=bpPick(['r'],rng)||bpPick(['c'],rng);

}
function bpIcon(b){return b.t==='perk'?'p_'+b.id:b.e;}
// the kind and class of a blueprint, said on its card: 'Off-hand · Rogue only'
function bpKind(b){
 const k={weapon:'Weapon',off:'Off-hand',charm:'Charm',perk:'Perk'}[b.t]||'Item',c=b.t==='off'?OFF[b.id].cls:b.t==='perk'?(perkById(b.id)||{}).cls:null;
 return k+' · '+(c?CLS[c].n+' only':'any class');
}
function bpDesc(b){
 const d=b.t==='weapon'?wpRule(b.id,false).replace(/(-?\+?\d+ attack)/,'$1 vs Sword'):b.t==='off'?offRule(b.id):b.t==='charm'?charmRule(b.id):(perkById(b.id)||{d:''}).d;

}
// loot pools only contain unlocked blueprints
function bpTable(T){const o={};for(const k in T)if(!T[k].bp||bpOn(k))o[k]=T[k];return o;}

// ---------- expeditions ----------
function mulberry(a){return function(){a=(a+0x6d2b79f5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const lerpA=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
// the table row for a class at upgrade power pw: linear blend of the two nearest calibrated rows
function expRow(cls,pw){
 const rows=EXP_TABLE[cls]||EXP_TABLE.warrior;
 if(pw<=rows[0].pw||rows.length===1)return rows[0];
 for(let i=1;i<rows.length;i++){
  if(pw<=rows[i].pw){
   const a=rows[i-1],b=rows[i],t=(pw-a.pw)/Math.max(1,b.pw-a.pw);
   return {pw:pw,reach:lerpA(a.reach,b.reach,t),gold:lerpA(a.gold,b.gold,t),kills:lerpA(a.kills,b.kills,t),turns:a.turns+(b.turns-a.turns)*t,gph:a.gph+(b.gph-a.gph)*t};
  }

function expDur(min){return BAL.exp.durs.find(d=>d.min===min)||BAL.exp.durs[0];}
// the deepest floor the player reached in MANUAL play (Auto does not count; at least 1): a hero never delves deeper
function expBest(rec){const b=rec&&rec.bf>0?rec.bf:meta.bestM|0;return Math.max(1,Math.min(MAXF,b));}   // a trip sent by an older build has no bf: it follows the current best
// gold per hour at the 8 h rate for a best floor and upgrade power
function expGph(best,pw){
 const X=BAL.exp,B=Math.max(1,Math.min(MAXF,best|0)),c=X.boost;let k=c[c.length-1][1];
 if(pw<=c[0][0])k=c[0][1];else for(let i=1;i<c.length;i++)if(pw<=c[i][0]){k=c[i-1][1]+(c[i][1]-c[i-1][1])*(pw-c[i-1][0])/(c[i][0]-c[i-1][0]);break;}
 return X.gph[B-1]*(1+k);
}
// expected gold of an expedition of `dur` minutes (shown on the send screen); cls is kept for callers, every class pays the same
function expEstimate(cls,dur,pw,best){return Math.round(expGph(best==null?expBest():best,pw==null?upSpent():pw)*expDur(dur).rate*dur/60);}
function expElapsed(rec,now){const m=(now-rec.t0)/60000;return m>0?Math.min(m,BAL.exp.capMin):0;}   // never negative, never more than the cap
function expReady(rec,now){return !!rec&&expElapsed(rec,now)>=rec.dur;}
function expLeft(rec,now){return Math.max(0,Math.min(rec.dur,rec.dur-expElapsed(rec,now)))*60000;}   // ms to go, never more than the trip length (a clock set back does not add time)
// The outcome of an expedition after `now`: pure (the record, the clock and which blueprints are already found decide it), so a reload cannot reroll it.
// The hero is back after rec.dur minutes (or `now` if recalled earlier) and made one delve per delveMin minutes; each delve draws the floor it
// ended on from the class row (every floor above the player's best manual floor is folded into it); gold / kills follow that floor's shape, scaled so the
// expedition pays expGph x rate per hour on average (BAL.exp.flat of every delve is the same on every floor, so a short trip is not a lottery).
function expResult(rec,now,found){
 const X=BAL.exp,D=expDur(rec.dur),el=expElapsed(rec,now),eff=Math.min(el,rec.dur),B=expBest(rec);
 const row=expRow(rec.cls,rec.pw);
 const reach=Array(9).fill(0),wg=Array(9).fill(0),wk=Array(9).fill(0);
 for(let i=0;i<9;i++){const t=B<MAXF&&i>B-1?B-1:i;reach[t]+=row.reach[i];wg[t]+=row.reach[i]*row.gold[i];wk[t]+=row.reach[i]*row.kills[i];}
 let tot=0,mg=0;for(let i=0;i<9;i++)tot+=reach[i];
 for(let i=0;i<9;i++)mg+=wg[i];mg=tot>0?mg/tot:1;
 const gold=reach.map((r,i)=>r>0?X.flat*mg+(1-X.flat)*wg[i]/r:0),kills=reach.map((r,i)=>r>0?wk[i]/r:0);
 let avg=0;for(let i=0;i<9;i++)avg+=reach[i]/Math.max(tot,1e-9)*gold[i];
 const scale=avg>0?expGph(B,rec.pw)*(X.delveMin/60)*D.rate/avg:0;
 const phase=mulberry(hashStr(rec.cls+'|'+rec.seed+'|'+rec.t0))();
 const n=Math.max(0,Math.floor(eff/X.delveMin+phase));
 let g=0,kl=0,deaths=0,floor=0,bp=null;
 for(let i=0;i<n;i++){
  const rng=mulberry(hashStr(rec.seed+'|'+rec.t0+'|'+rec.pw.toFixed(1)+'|'+i));
  let u=rng()*tot,f=0;for(;f<8;f++){u-=reach[f];if(u<0)break;}

  floor=Math.max(floor,Math.min(f+1,B));
  const roll=rng();
  if(!bp&&Math.min(f+1,B)>=X.bpMinFloor&&roll<X.bpChance){
   const pool=BPS.filter(b=>b.tier==='c'&&!bpState(b.id)&&!(found&&found.has(b.id)));
   if(pool.length)bp=pool[Math.floor(rng()*pool.length)].id;

}
function expFree(){const e=meta.exp;for(let i=0;i<(e.s2?2:1);i++)if(!e.run[i])return i;return -1;}
function expSend(slot,cls,dur){
 const e=meta.exp;
 if(slot<0||slot>1||(slot===1&&!e.s2)||e.run[slot]||!CLS[cls]||(cls!=='warrior'&&!meta.unl[cls])||!BAL.exp.durs.some(d=>d.min===dur))return false;
 e.run[slot]={cls:cls,dur:dur,t0:Date.now(),seed:Math.floor(Math.random()*4294967296)>>>0,pw:upSpent(),bf:expBest()};
 saveMeta();return true;
}
// pay the result of a slot (done or recalled early) and free it; the report is kept until the player closes it
function expCollect(slot,now){
 const e=meta.exp,rec=e.run[slot];if(!rec)return null;
 const r=expResult(rec,now==null?Date.now():now);
 meta.gold+=r.gold;if(r.bp)bpFound(r.bp);
 e.run[slot]=null;e.rep=r;saveMeta();
 return r;
}
function expBuySlot(){if(meta.exp.s2||meta.gold<BAL.exp.secondSlot)return false;meta.gold-=BAL.exp.secondSlot;meta.exp.s2=1;saveMeta();return true;}
function expReadyCount(now){now=now==null?Date.now():now;let n=0;for(const r of meta.exp.run)if(r&&expReady(r,now))n++;return n;}
function expActive(){return meta.exp.run.filter(Boolean).length;}
function fmtDur(ms){
 const m=Math.max(0,Math.ceil(ms/60000));
 return m>=60?Math.floor(m/60)+'h '+(m%60<10?'0':'')+(m%60)+'m':m+'m';
}

// ---------- Auto's idle pay ----------
// Auto pays by the TURNS it played (so 1x / 2x / 4x pay the same), at the 30-minute expedition rate for the player's best manual floor and upgrade power.
function autoGph(){return expGph(expBest(),upSpent())*BAL.exp.durs[0].rate;}
function autoRate(){return autoGph();}   // gold per hour of play (1 turn = BAL.exp.turnSec)
function autoPerTurn(){return autoGph()*BAL.exp.turnSec/3600;}
function autoTurns(g){return g&&g.auto?(g.auto.t|0)+(AUTO.self?Math.max(0,g.turn-AUTO.t0):0):0;}   // turns Auto played, including the one being resolved
function autoPay(g,turns){return Math.round(autoPerTurn()*(turns==null?autoTurns(g):turns));}
// what a run banks (and what the HUD shows once Auto has played in it): run gold of the turns the player played themselves (x Heat), plus idle pay for Auto's turns
function runBank(g,won){
 const aut=!!(g.auto&&g.auto.used),bonus=won?BAL.run.winBonus:0,heat=gHeat(g);
 const share=aut?Math.min(1,autoTurns(g)/Math.max(1,g.turn)):0,idle=aut?autoPay(g):0;
 return {banked:Math.round((g.p.gold+bonus)*(1-share)*heatGold(heat)+idle),idle:idle,share:share,bonus:bonus,heat:heat};
}

// audio.js - WebAudio sound effects, vibration and the sound on/off toggle.

function ac(){

// [freq, seconds, wave, volume, endFreq]
function sfx(k){
 try{
  const a=ac();if(!a||!SFX[k])return;let t=a.currentTime;
  for(const n of SFX[k]){
   const o=a.createOscillator(),g=a.createGain();o.type=n[2];o.frequency.setValueAtTime(n[0],t);
   if(n[4])o.frequency.exponentialRampToValueAtTime(n[4],t+n[1]);
   g.gain.setValueAtTime(n[3],t);g.gain.exponentialRampToValueAtTime(0.0001,t+n[1]);
   o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+n[1]+0.03);t+=n[1]*0.9;
  }
 }catch(e){}
}
function buzz(ms){try{if(meta.sound&&navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function soundLabel(){return meta.sound?'Sound: ON':'Sound: OFF';}
function toggleSound(){
 meta.sound=meta.sound?0:1;saveMeta();
 if(meta.sound){ac();sfx('pickup');buzz(25);}
}
document.addEventListener('pointerdown',function(){if(meta.sound&&!AC)ac();},true);

// effects.js - cosmetic effects state: screen shake, floating combat text, hurt flash.

function shake(a){if(rmo())return;shakeUntil=performance.now()+220;shakeAmt=a;}
// hurt flash: a red vignette at the screen edge, scaled by the share of max HP lost (0.12..0.5); only a hit of >=20% max HP washes the whole screen. None with reduced motion.
let flashAmt=0,flashFull=false,flashFrom=0;
function playerHurtFx(d){
 const p=G.p,now=performance.now()+vOff;flashes.p=now;sfx('hurt');
 const share=d/Math.max(1,p.mhp),big=d>=Math.max(6,p.mhp*0.2);
 if(!rmo()){
  const a=Math.max(0.12,Math.min(0.5,share*2.2)),live=now<flashUntil;
  flashFull=(live&&flashFull)||share>=0.2;flashAmt=live?Math.max(flashAmt,a):a;flashUntil=now+(flashFull?250:180);flashFrom=now;
 }
 buzz(big?70:30);if(big)shake(6);
}

// ---- sequencing: something that travels lands later than the action that threw it. What it hits (flash, number, death, the foe's own
// step) waits for it: holds[x,y] = the moment a projectile arrives on that tile. Cosmetic only; the game state has already moved on.
let holds={},faces={};
const TRAVEL={bolt:210,knife:190,fire:160,charge:130};
function holdAt(x,y){const h=holds[x+','+y];if(!h)return 0;const d=h-performance.now();return d>0?d:0;}
function holdSet(x,y,ms){const k=x+','+y,t=performance.now()+ms;if(!holds[k]||holds[k]<t)holds[k]=t;}
// ---- floating labels. kind n = damage / heal number (bare outlined digits), s = status word (small pill, lower case), a = announcement (upper-case pill).
// Every label is placed when it is spawned: its box is tested against the labels already alive on the screen (at the moment it appears) and it
// is stacked upward until it overlaps none. A status word waits 250 ms behind the number on its tile; the same word twice within 160 ms is one label.
const LBL_SZ={n:0.42,s:0.30,a:0.34},LBL_MS={n:800,s:700,a:900};
let lblCtx=null;const lblWc={};
function lblW(text,sz,k){ // box width in tile units
 const key=text+'|'+k;let w=lblWc[key];
 if(w==null){if(!lblCtx)lblCtx=mkCanvas(4,4).getContext('2d');lblCtx.font='800 100px system-ui,-apple-system,sans-serif';w=lblWc[key]=lblCtx.measureText(text).width/100;}
 return w*sz+(k==='n'?0.12:sz*1.1);
}
function lblBox(f){return lblW(f.text+(f.n>1?' x'+f.n:''),f.sz,f.k);}
function lblPos(f,T){ // centre of the label's box at time T, in tile units
 const a=Math.max(0,(T-f.t)/800);
 return [f.x+0.5+(f.dxo||0),f.y+0.2+(f.off||0)-a*0.6];
}
let vOff=0;   // while the enemy phase is drawn: how far behind the player's own action its visuals start (see enemiesAct)
const DEALT='#ffd24a',TAKEN='#ff5a5a';
function hpPulse(){const b=$('hpbar');if(!b)return;b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse');}
// Numbers: damage the player TAKES is red, on the left of the player's tile; damage DEALT is gold, on the right of the foe's tile. Within 450 ms a number of
// the same kind on the same tile is added to the one already there (a "x3" tag counts the hits) instead of stacking; a tile holds at most 3 rows of labels
// (1.2 tiles of height) and a fourth replaces the oldest; a heal of less than 5 HP only pulses the HP bar; numbers never wait for pills (pills dodge numbers).
function floatFx(x,y,text,color,big){
 const now=performance.now();
 const k=/^[-+]?\d|^!$/.test(text)?'n':(text===text.toUpperCase()&&/[A-Z]/.test(text))?'a':'s';
 const mine=!!G&&!!G.p&&x===G.p.x&&y===G.p.y;
 let dxo=0,col=color,base=0;
 if(k==='n'){
  if(/^\+\d+$/.test(text)&&mine&&+text.slice(1)<5){hpPulse();return;}
  if(text[0]==='-'){
   if(mine){dxo=-0.42;col=TAKEN;}
   else if(color!=='#7be04b'&&color!=='#ff9a3a'&&color!=='#c6f'){dxo=0.3;col=/!$/.test(text)?'#fff1b0':DEALT;}
  }
 }
 if(G&&G.enemies){const bo=G.enemies.find(e=>e.x===x&&e.y===y&&EN[e.t].boss);if(bo)base=-1.6;}   // the boss is 2.6 tiles tall: labels sit at its head, not its belly
 if(k==='a'&&big)base=Math.min(base,-0.9);                                                       // area pills (BOOM, NOVA, SMOKE) ride above the numbers
 let t=now+holdAt(x,y)+vOff;const t0=t;
 for(const g of fx){if(g.c)continue;
  if(k!=='n'&&g.text===text&&Math.abs(g.t0-t0)<160)return;                       // one word per volley
  if(k==='s'&&g.k==='n'&&g.x===x&&g.y===y&&g.t>now-300)t=Math.max(t,g.t+250);}  // after the number, not on top of it
 if(k==='n'){
  for(const g of fx){
   if(g.c||g.k!=='n'||g.x!==x||g.y!==y||g.dxo!==dxo||g.color!==col||g.big!==!!big)continue;
   if(!/^[-+]?\d+!?$/.test(g.text)||t-g.t>450||t<g.t)continue;
   const a=parseInt(g.text,10),b=parseInt(text,10);
   g.text=(a+b<0?'-':'+')+Math.abs(a+b)+(/!$/.test(text)||/!$/.test(g.text)?'!':'');g.n=(g.n||1)+1;g.t=t;g.t0=t;return;
  }
 }
 const live=fx.filter(g=>!g.c&&now<g.t+g.d).length;
 const sz=LBL_SZ[k]*(k==='n'&&big?1.4:1),f={x:x,y:y,text:text,color:col,big:!!big,t:t,t0:t0,k:k,sz:sz,d:k==='n'&&live>4?550:LBL_MS[k],off:base,dxo:dxo,n:1};
 const w=lblW(text,sz,k),h=sz*(k==='n'?1.15:1.5),step=Math.max(0.3,h);
 let row=-1;
 for(let tries=0;tries<12&&row<0;tries++){
  const own=fx.some(g=>!g.c&&g.x===x&&g.y===y&&g!==f&&t<g.t+g.d);   // the 1.2-tile cap is about a crowded tile; a clash with a neighbour's label just stacks higher
  for(let i=0;i<(own?3:6)&&row<0;i++){
   f.off=base-i*step;
   let hit=false;
   for(const g of fx){if(g.c||t>g.t+g.d||g.t>t+f.d)continue;if(k==='n'&&g.k==='a'&&g.big)continue;
    const Tc=Math.max(t,g.t),A=lblPos(f,Tc),B=lblPos(g,Tc),gw=lblBox(g),gh=g.sz*(g.k==='n'?1.15:1.5);
    if(Math.abs(A[0]-B[0])<(w+gw)/2&&Math.abs(A[1]-B[1])<(h+gh)/2){hit=true;break;}}
    if(!hit)row=i;
  }
  if(row<0){   // no room within the cap: the oldest label on this tile makes way
   let old=null;for(const g of fx)if(!g.c&&g.x===x&&g.y===y&&(!old||g.t<old.t))old=g;
   if(!old){f.off=base;break;}
   fx.splice(fx.indexOf(old),1);
  }
 }
 fx.push(f);
}
// callout: a brief on-map word or two (<=3 words, ~1 s) for the few events worth seeing without reading the log. Drawn on the canvas (so it can
// never take a tap), at most BAL.ui.calloutMax at once (a third one is dropped; the log keeps the history), no motion with reduced motion.
let calloutDelay=0;   // a boss's death plays for ~900 ms: pills born in the same turn (LEVEL UP) wait for it
function callout(x,y,text,color){
 const now=performance.now(),d=BAL.ui.calloutMs;let n=0;
 for(const f of fx)if(f.c&&now-f.t<d)n++;
 if(n>=BAL.ui.calloutMax)return;
 fx.push({x,y,text,color,big:true,t:now+calloutDelay,c:1,d:d});
}
// HP below 30%: one callout per crossing (it re-arms once HP is back above 40%). The first look at a run only records the state.
function lowHpWatch(){
 const p=G.p,U=BAL.ui;
 if(hpLowG!==G){hpLowG=G;hpLow=p.hp<p.mhp*U.lowHp;return;}
 if(p.hp>=p.mhp*U.lowHpReset)hpLow=false;
 else if(!hpLow&&p.hp>0&&p.hp<p.mhp*U.lowHp){hpLow=true;callout(p.x,p.y,'LOW HP','#ff5a5a');}
}
// an elite coming into view for the first time on a floor
function eliteWatch(){
 if(!G.enemies)return;
 if(eliteG!==G){eliteG=G;eliteSeen=new Set();}
 for(const e of G.enemies)if(e.elite&&G.vis[ix(e.x,e.y)]){const k=G.floor+':'+e.id;if(!eliteSeen.has(k)){eliteSeen.add(k);callout(e.x,e.y,'ELITE','#ffd24a');}}
}

// ---- motion: lunges, death pops and per-ability effects. All cosmetic, all <= 450 ms, none blocks input, none uses Math.random
// (a seeded run must play out identically with or without them), and all are skipped with prefers-reduced-motion. ----
let lunges={},ghosts=[],vfx=[];
const VFX_MS={bolt:300,knife:240,nova:380,blink:320,fire:440,cleave:240,charge:280,bash:240,brace:340,backstab:260,vanish:340,smoke:430};
function lunge(id,dx,dy){if(dx)faces[id]=Math.sign(dx);if(rmo())return;lunges[id]={t:performance.now()+vOff,dx:Math.sign(dx),dy:Math.sign(dy)};}
function ghostAdd(e){if(rmo())return;const boss=!!EN[e.t].boss;ghosts.push({id:EN[e.t].e,x:e.x,y:e.y,elite:!!e.elite,boss:boss,rage:!!e.enraged,t:performance.now()+holdAt(e.x,e.y)+vOff});if(boss)shake(8);}
function puffAdd(x,y){if(rmo())return;puffs.push({x:x,y:y,t:performance.now()+holdAt(x,y),s:Math.random()*6});}
function vfxAdd(k,x,y,x2,y2,r){
 if(rmo())return;
 vfx.push({k:k,x:x,y:y,x2:x2==null?x:x2,y2:y2==null?y:y2,r:r||1,t:performance.now(),d:VFX_MS[k]||300});
 if(TRAVEL[k]){const R=k==='fire'?(r||1):0;for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++)holdSet(x2+dx,y2+dy,TRAVEL[k]);}
 else if(k==='nova'){for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)holdSet(x+dx,y+dy,55*Math.max(Math.abs(dx),Math.abs(dy)));}
}
const lerp=(a,b,t)=>a+(b-a)*t;
function ring(cx,cy,r,col,w,al){ctx.globalAlpha=Math.max(0,al);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.arc(cx,cy,Math.max(0.5,r),0,7);ctx.stroke();ctx.globalAlpha=1;}
function ringE(cx,cy,rx,ry,col,w,al){ctx.globalAlpha=Math.max(0,al);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.ellipse(cx,cy,Math.max(0.5,rx),Math.max(0.5,ry),0,0,7);ctx.stroke();ctx.globalAlpha=1;}
function disc(cx,cy,r,col,al){ctx.globalAlpha=Math.max(0,al);ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy,Math.max(0.5,r),0,7);ctx.fill();ctx.globalAlpha=1;}
function star4(cx,cy,r,col,al,rot){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot||0);ctx.globalAlpha=Math.max(0,al);ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*0.28:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.restore();ctx.globalAlpha=1;}
// draws the live effects; returns true while any is still running (render keeps animating)
function drawVfx(ox,oy,ts,now){
 vfx=vfx.filter(f=>now-f.t<f.d);
 for(const f of vfx){
  const k=(now-f.t)/f.d,ax=ox+(f.x+0.5)*ts,ay=oy+(f.y+0.5)*ts,bx=ox+(f.x2+0.5)*ts,by=oy+(f.y2+0.5)*ts,e=1-(1-k)*(1-k);
  switch(f.k){
   case 'bolt':{const m=Math.min(1,k/0.7),px=lerp(ax,bx,m),py=lerp(ay,by,m);
    for(let i=1;i<=4;i++){const q=Math.max(0,m-i*0.07);disc(lerp(ax,bx,q),lerp(ay,by,q),ts*0.16*(1-i*0.17),'#c08cff',0.5*(1-i*0.2));}
    if(k<0.75){disc(px,py,ts*0.22,'#e9d6ff',1);disc(px,py,ts*0.13,'#fff',1);}
    else{const q=(k-0.7)/0.3;ring(bx,by,ts*(0.2+0.4*q),'#c08cff',3,1-q);star4(bx,by,ts*0.4*(1-q*0.4),'#fff',1-q,q*2);}break;}
   case 'knife':{const m=Math.min(1,k/0.8),px=lerp(ax,bx,m),py=lerp(ay,by,m);
    ctx.save();ctx.translate(px,py);ctx.rotate(m*12);ctx.globalAlpha=1-Math.max(0,(k-0.8)*5);ctx.drawImage(spriteBmp('knife',Math.round(ts*0.55)),-ts*0.275,-ts*0.275,ts*0.55,ts*0.55);ctx.restore();ctx.globalAlpha=1;
    if(k>0.75)star4(bx,by,ts*0.35,'#fff',1-(k-0.75)*4,0);break;}
   case 'nova':{ring(ax,ay,ts*(0.3+1.5*e),'#8fe3ff',4*(1-k)+1,1-k);ring(ax,ay,ts*(0.2+1.0*e),'#fff',2,0.8*(1-k));
    for(let i=0;i<6;i++){const a=i*Math.PI/3+0.4,rr=ts*(0.4+1.1*e);star4(ax+Math.cos(a)*rr,ay+Math.sin(a)*rr,ts*0.2*(1-k),'#e6fbff',1-k,a);}break;}
   case 'blink':{const m=Math.min(1,k/0.5);ring(ax,ay,ts*(0.5*(1-m)+0.05),'#d4ccff',3,1-m*0.5);disc(ax,ay,ts*0.4*(1-m),'#8f7bff',0.6);
    ctx.globalAlpha=0.5*(1-k);ctx.strokeStyle='#d4ccff';ctx.lineWidth=ts*0.14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(lerp(ax,bx,Math.min(1,k*2.5)),lerp(ay,by,Math.min(1,k*2.5)));ctx.stroke();ctx.globalAlpha=1;
    const q=Math.max(0,(k-0.3)/0.7);ring(bx,by,ts*(0.1+0.7*q),'#fff',3,1-q);star4(bx,by,ts*0.5*(1-q),'#d4ccff',1-q,q*3);break;}
   case 'fire':{const m=Math.min(1,k/0.36);
    if(k<0.36){const px=lerp(ax,bx,m),py=lerp(ay,by,m)-Math.sin(m*Math.PI)*ts*0.5;disc(px,py,ts*0.2,'#ff9a3a',1);disc(px,py,ts*0.11,'#ffe08a',1);}
    else{const q=(k-0.36)/0.64,R=(f.r+0.55)*ts*(0.5+0.5*(1-(1-q)*(1-q)));disc(bx,by,R,'#d4421a',0.55*(1-q));disc(bx,by,R*0.72,'#ff9a3a',0.7*(1-q));disc(bx,by,R*0.4,'#ffe08a',0.9*(1-q));}break;}
   case 'cleave':{const a0=-2.2+e*5.2;ctx.save();ctx.globalAlpha=1-k*k;ctx.strokeStyle='#ffd9a0';ctx.lineCap='round';ctx.lineWidth=ts*0.2*(1-k*0.6);ctx.beginPath();ctx.arc(ax,ay,ts*0.95,a0-1.5,a0);ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=ts*0.07;ctx.beginPath();ctx.arc(ax,ay,ts*0.95,a0-1.1,a0);ctx.stroke();ctx.restore();ctx.globalAlpha=1;break;}
   case 'charge':{ctx.globalAlpha=0.6*(1-k);ctx.strokeStyle='#97c6ff';ctx.lineCap='round';
    const dx=bx-ax,dy=by-ay,n=Math.hypot(dx,dy)||1,nx=-dy/n,ny=dx/n;
    for(const o of [-0.28,0,0.28]){ctx.lineWidth=ts*0.1;ctx.beginPath();ctx.moveTo(ax+nx*o*ts,ay+ny*o*ts);ctx.lineTo(lerp(ax,bx,Math.min(1,k*2.2))+nx*o*ts,lerp(ay,by,Math.min(1,k*2.2))+ny*o*ts);ctx.stroke();}
    ctx.globalAlpha=1;if(k>0.3){const q=(k-0.3)/0.7;ring(bx,by,ts*(0.2+0.6*q),'#fff',3,1-q);star4(bx,by,ts*0.55*(1-q*0.5),'#ffe066',1-q,0.4);}break;}
   case 'bash':{ring(bx,by,ts*(0.2+0.7*e),'#ffb04a',5*(1-k)+1,1-k);star4(bx,by,ts*0.7*(1-k*0.4),'#ffe066',1-k,0.2);star4(bx,by,ts*0.4*(1-k),'#fff',1-k,0.8);break;}
   case 'brace':{ring(ax,ay,ts*(0.45+0.5*e),'#97c6ff',4*(1-k)+1,1-k);ring(ax,ay,ts*(0.35+0.3*e),'#fff',2,0.7*(1-k));break;}
   case 'backstab':{ctx.save();ctx.globalAlpha=1-k;ctx.lineCap='round';
    for(const s of [[-1,-1,1,1],[1,-1,-1,1]]){const m=Math.min(1,k*3),L=ts*0.5;ctx.strokeStyle='#ff5a8a';ctx.lineWidth=ts*0.16*(1-k);ctx.beginPath();ctx.moveTo(ax+s[0]*L,ay+s[1]*L);ctx.lineTo(ax+(s[0]+(s[2]-s[0])*m)*L,ay+(s[1]+(s[3]-s[1])*m)*L);ctx.stroke();
     ctx.strokeStyle='#fff';ctx.lineWidth=ts*0.05;ctx.stroke();}
    ctx.restore();ctx.globalAlpha=1;star4(ax,ay,ts*0.45*(1-k),'#ffb0c8',1-k,0.5);break;}
   case 'vanish':{for(let i=0;i<8;i++){const a=i*Math.PI/4+0.3,rr=ts*(0.9*(1-e)+0.1);disc(ax+Math.cos(a)*rr,ay+Math.sin(a)*rr,ts*0.17,'#9fe8c6',0.7*(1-k));}ring(ax,ay,ts*(0.3+0.4*e),'#eafff4',2,1-k);break;}
   case 'smoke':{const R=(f.r+0.5)*ts*(0.4+0.6*e);const al=0.55*(1-k*k);
    for(let i=0;i<7;i++){const a=i*2.4,rr=R*(0.25+0.65*((i*37%10)/10));disc(bx+Math.cos(a)*rr,by+Math.sin(a)*rr,ts*(0.45+0.2*((i*13%5)/5)),'#c4cadc',al);}
    disc(bx,by,R*0.6,'#e6e9f6',al*0.7);break;}
  }
 }
 return vfx.length>0;
}

// items.js - gear (weapon / armor / off-hand / charm): names, derived stats, generation, comparison, drops, pickup, consumables.

const SLOTS=['weapon','armor','off','charm'];
const SLOT_LABEL={weapon:'Weapon',armor:'Armor',off:'Off-hand',charm:'Charm'};
function eqi(slot){return G.p.eq[slot]||null;}
function eqKind(slot){const i=eqi(slot);return i?i.k:null;}
function traitOf(slot){const i=eqi(slot);return i&&i.tr?i.tr:null;}
function kindTable(slot){return slot==='weapon'?WP:slot==='armor'?ARM:slot==='off'?OFF:CH;}
function itemSprite(it){return kindTable(it.t)&&it.k&&kindTable(it.t)[it.k]?itemIcon(it):(it.t==='gold'||it.t==='potion'||it.t==='fire'||it.t==='tele'||it.t==='key'||it.t==='knife'?it.t:'perk');}
function itemIcon(it){const t=it&&kindTable(it.t)[it.k];return t?t.e:'perk';}
function gearName(it){
 if(!it)return 'Nothing';
 const kt=kindTable(it.t)[it.k];if(!kt)return 'Strange item';
 let base=kt.n;
 if(it.t==='weapon')base=TIERS[Math.min(5,Math.floor(it.v/BAL.gear.tierDiv))]+' '+base;
 else if(it.t==='armor')base=TIERS[Math.min(5,it.v)]+' '+base;
 return it.tr&&TR[it.tr]?TR[it.tr].n+' '+base:base;
}
function itemRule(it){
 if(!it)return '';
 return it.t==='weapon'?wpRule(it.k):it.t==='armor'?armRule(it.k):it.t==='off'?offRule(it.k):charmRule(it.k);
}
function armorDef(it){if(!it)return 0;const a=ARM[it.k];if(!a||a.noDef)return 0;return Math.max(0,it.v+(a.def||0));}
function wpK(){const w=eqi('weapon');return w?WP[w.k]:null;}
function armK(){const a=eqi('armor');return a?ARM[a.k]:null;}
function wv(){const w=eqi('weapon');return w?w.v:0;}
function atkMod(){return (traitOf('armor')==='spiked'?BAL.trait.spikedAtk:0)+(eqKind('charm')==='frenzy'?Math.min(BAL.charm.frenzyMax,G.fz|0):0);}
function meleeAtk(){const k=wpK();return Math.max(1,G.p.atk+wv()+(k?k.atk:0)+atkMod());}
function spellBase(){return Math.max(1,G.p.atk+wv()+atkMod());}   // spells ignore the weapon's melee offset
function defTotal(){return G.p.def+armorDef(eqi('armor'));}
function critChance(){const p=G.p,k=wpK(),t=traitOf('weapon');return Math.max(0,Math.min(1,p.crit+(k&&k.crit||0)+(t==='keen'?BAL.trait.keenCrit:0)+(t==='brutal'?BAL.trait.brutalCrit:0)));}
function lifeRate(){return Math.max(0,G.p.life+(traitOf('weapon')==='vamp'?BAL.trait.vampLife:0));}
function dodgeChance(){const k=armK();return Math.min(BAL.combat.dodgeCap,G.p.dodge+(k&&k.dodge||0));}

function spellMul(){const k=wpK(),a=armK();return 1+(k&&k.spell||0)+(a&&a.spell||0)+pc('arcana')*BAL.perk.arcanaSpell;}
function mmax(){
 const p=G.p;if(!(p.mbase>0))return 0;
 const k=wpK(),a=armK(),ar=eqi('armor');let m=p.mbase+(k&&k.mana||0);
 if(a){m+=(a.mana||0);if(a.manaBase)m+=a.manaBase+a.manaPerV*ar.v;}

}
function manaRegen(){const a=armK();return BAL.mana.regen*(a&&a.manaRegenMul||1);}
function maxKnives(){return BAL.ability.knife.max+(eqKind('off')==='quiver'?BAL.offhand.quiverKnives:0)+(pc('bando')?BAL.perk.bandoMax:0);}
// stat vector used by the equip comparison: what changes if `it` replaces the current item in its slot
function statVec(){return {attack:meleeAtk(),defense:defTotal(),crit:Math.round(critChance()*100),dodge:Math.round(dodgeChance()*100),spell:Math.round((spellMul()-1)*100),mana:mmax()};}
// what changes if `it` replaces the current item in its slot: [[stat, change], ...]
function gearDeltaRaw(it){
 const p=G.p,old=p.eq[it.t],a=statVec();p.eq[it.t]={t:it.t,k:it.k,v:it.v,tr:it.tr||null};const b=statVec();p.eq[it.t]=old;

}
function gearDelta(it){return gearDeltaRaw(it).map(x=>x[0]+' '+sgn(x[1])+((x[0]==='crit'||x[0]==='dodge'||x[0]==='spell')?'%':''));}
// the same as green / red chips (more is always better for these stats)
function gearDeltaHtml(it){

 const d=gearDeltaRaw(it);
 if(!d.length)return '<span class="dlt same">Same stats</span>';
 return d.map(x=>'<span class="dlt '+(x[1]>0?'up':'dn')+'">'+L[x[0]]+' '+(x[1]>0?'+':'\u2212')+Math.abs(x[1])+((x[0]==='crit'||x[0]==='dodge'||x[0]==='spell')?'%':'')+'</span>').join('');

function itemDesc(it){
 const st=it.t==='weapon'?sgn(it.v+(WP[it.k]?WP[it.k].atk:0))+' attack':it.t==='armor'?'Defense '+armorDef(it):'';
 const r=itemRuleShort(it);
 return [st,r==='Balanced.'?'':r].filter(Boolean).join(' · ')+(it.tr?'<br>'+traitLine(it.tr):'');
}
// the rule line only (no stat numbers): weapon rules without the attack offset
function itemRuleShort(it){const c=G&&G.p?G.p.cls:undefined;return it.t==='weapon'?wpRule(it.k,true,c):it.t==='armor'?armRule(it.k,true,c):itemRule(it);}
// the rule phrases of an item (no stat numbers, nothing the class cannot use) plus its trait: used to say what a swap gives up
function itemTerms(it){
 if(!it)return [];const c=G.p.cls;
 const t=it.t==='weapon'?wpTerms(it.k,true,c):it.t==='armor'?armTerms(it.k,true,c):[itemRule(it)].filter(Boolean);

function traitLine(tr){return tr&&TR[tr]?TR[tr].n+': '+TR[tr].d:'';}
function applyTrait(v,tr){return tr&&TR[tr]?Math.max(1,v+TR[tr].dv):v;}
function rollTrait(slot,f){
 if(rf()>=Math.min(BAL.trait.chanceCap,BAL.trait.chanceBase+BAL.trait.chancePerFloor*f))return null;

function pickW(tbl){

}
function classOffs(cls){return Object.keys(OFF).filter(k=>OFF[k].cls===cls&&(!OFF[k].bp||bpOn(k)));}
// a fresh piece of gear for floor f. forced = treasure room / merchant: weapon and armor always carry a trait.
function newGear(slot,f,forced){
 if(slot==='off')return {t:'off',k:pick(classOffs(G.p.cls)),v:0,tr:null};
 if(slot==='charm')return {t:'charm',k:pick(Object.keys(CH).filter(k=>!CH[k].bp||bpOn(k))),v:0,tr:null};
 const fg=BAL.forcedGear,sp=BAL.spawn;
 let tr=null;
 if(forced){const pool=Object.keys(TR).filter(k=>TR[k].slot===slot&&TR[k].minF<=Math.max(f,fg.minTraitFloor));tr=pick(pool);}
 else tr=rollTrait(slot,f);

  const raw=forced?rnd(fg.weaponMin,fg.weaponMax)+Math.floor(f*fg.weaponPerFloor):rnd(sp.weaponMin,sp.weaponMax)+Math.floor(f*sp.weaponPerFloor);
  return {t:'weapon',k:pickW(bpTable(WP)),v:applyTrait(raw,tr),tr:tr};
 }

 return {t:'armor',k:pickW(ARM),v:applyTrait(raw,tr),tr:tr};
}
function forcedGear(f,slot){return newGear(slot,f,true);}
function dropAt(x,y,it){

 if(itemAt(x,y)){for(const [dx,dy] of DIRS){const a=x+dx,b=y+dy;if(inb(a,b)&&G.map[ix(a,b)]===1&&!itemAt(a,b)&&!trapAt(a,b)&&!merchantAt(a,b)){t=[a,b];break;}}}

function clampRes(){const p=G.p;p.mana=Math.min(p.mana||0,mmax());G.knives=Math.min(G.knives||0,maxKnives());}
// put `it` on the player and return what it replaced

}
function worthKeeping(old){return !!old&&(old.v>0||!!old.tr||old.t==='off'||old.t==='charm');}
function pickup(){

}
function sellGear(it,why){const g=Math.round((BAL.item.weakSaleBase+G.floor)*G.p.goldMul);G.p.gold+=g;msg(why+' '+gearName(it)+' sold for '+g+' gold.');}
function pickOne(it){
 const p=G.p;
 let take=true;
 if(it.t==='gold'){const g=Math.round(it.v*p.goldMul*goldMod());p.gold+=g;msg('+'+g+' gold.');checkAch();
  if(eqKind('charm')==='gilded'&&p.hp<p.mhp){const h=Math.min(p.mhp-p.hp,Math.floor(g/BAL.charm.gildedPer));if(h>0){p.hp+=h;floatFx(p.x,p.y,'+'+h,'#6f6');}}}

// perks.js - perk lookup, granting, synergies.

function pc(id){return (G&&G.perks&&G.perks[id])||0;}
function perkById(id){return PERKS.find(x=>x.id===id);}
function checkSyn(){

}
function addPerk(id){
 const pk=perkById(id);if(!G||!pk||pc(id)>=pk.max)return false;
 G.perks[id]=pc(id)+1;if(pk.f)pk.f(G.p);

// perks the current player can still be offered: unlocked, not maxed, and for their class
function perkPool(){return PERKS.filter(pk=>(!pk.lock||meta.unl[pk.lock])&&(!pk.bp||bpOn(pk.id))&&(!pk.cls||pk.cls===G.p.cls)&&pc(pk.id)<pk.max);}
function randomPerkId(){const pool=perkPool();return pool.length?pick(pool).id:null;}

// fov.js - line of sight, field of view, breadth-first distance maps and click-to-walk path finding.

function los(x0,y0,x1,y1,ub){
 let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx-dy,x=x0,y=y0;
 while(!(x===x1&&y===y1)){
  if(!(x===x0&&y===y0)){const t=G.map[ix(x,y)];if(t===0||t===3||t===5)return false;if(ub&&enemyAt(x,y))return false;}
  const e2=2*err;
  if(e2>-dy){err-=dy;x+=sx;}
  if(e2<dx){err+=dx;y+=sy;}
 }
 return true;
}
function bfsDist(sx,sy){
 const d=new Array(W*H).fill(9999);d[ix(sx,sy)]=0;const q=[[sx,sy]];
 for(let i=0;i<q.length;i++){const [x,y]=q[i];
  for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;
   if(walkable(nx,ny)&&d[ix(nx,ny)]===9999){d[ix(nx,ny)]=d[ix(x,y)]+1;q.push([nx,ny]);}}}
 return d;
}

function computeVis(){
 const p=G.p,R=visRadius();G.vis=new Array(W*H).fill(false);
 for(let y=p.y-R;y<=p.y+R;y++)for(let x=p.x-R;x<=p.x+R;x++){
  if(!inb(x,y))continue;
  if((x-p.x)*(x-p.x)+(y-p.y)*(y-p.y)>R*R+1)continue;
  if(!los(p.x,p.y,x,y))continue;
  const i=ix(x,y);G.vis[i]=true;G.seen[i]=true;
  if(G.map[i]!==0){G.exp[i]=true;
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(inb(x+dx,y+dy))G.seen[ix(x+dx,y+dy)]=true;}
 }
 const rr=pc('trapper')?BAL.vis.trapfinderRange:1;
 for(const t of G.traps)if(!t.rev&&!t.done&&Math.max(Math.abs(t.x-p.x),Math.abs(t.y-p.y))<=rr&&(rr===1||los(p.x,p.y,t.x,t.y))){t.rev=1;G.seen[ix(t.x,t.y)]=true;msg('You spot '+(t.k==='alarm'?'an ':'a ')+TRAPS[t.k].n.toLowerCase()+'!');}
 eliteWatch();
}

function bfsPath(sx,sy,tx,ty){
 const dz=dangerSet(),tz=trapSet(),cz=crackSet();
 const prev=new Map(),start=ix(sx,sy);prev.set(start,-1);const q=[[sx,sy]];
 const goal=ix(tx,ty);
 for(let i=0;i<q.length;i++){const [x,y]=q[i];if(ix(x,y)===goal)break;
  for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,k=ix(nx,ny);
   if(!inb(nx,ny)||prev.has(k)||!G.seen[k]||G.map[k]===0||dz.has(k)||(cz.has(k)&&k!==goal))continue;
   if(k!==goal&&(enemyAt(nx,ny)||G.map[k]===5||merchantAt(nx,ny)||tz.has(k)))continue;
   prev.set(k,ix(x,y));q.push([nx,ny]);}}
 if(!prev.has(goal))return null;
 const path=[];let k=goal;while(k!==start){path.push([k%W,Math.floor(k/W)]);k=prev.get(k);}
 return path.reverse();
}
function visIds(){return G.enemies.filter(e=>G.vis[ix(e.x,e.y)]).map(e=>e.id);}

// mapgen.js - dungeon layout: rooms, corridors, doors, caves, the locked treasure room.

function genFloor(f){
 for(let attempt=0;attempt<BAL.map.attempts;attempt++){
  const m=new Array(W*H).fill(0),rooms=[];
  for(let i=0;i<BAL.map.roomTries&&rooms.length<BAL.map.maxRooms;i++){
   const big=f===MAXF&&rooms.length===0;
   const w=big?BAL.map.bossRoomW:rnd(BAL.map.roomMinW,BAL.map.roomMaxW),h=big?BAL.map.bossRoomH:rnd(BAL.map.roomMinH,BAL.map.roomMaxH),x=rnd(1,Math.min(W,BAL.map.span)-w-1),y=rnd(1,Math.min(H,BAL.map.span)-h-1);   // rooms only use the top-left span x span corner: shorter corridors, shorter runs
   if(rooms.some(r=>x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y))continue;
   const rcx=x+(w>>1),rcy=y+(h>>1);
   rooms.push({x,y,w,h,cx:rcx,cy:rcy});
   const cave=f>=BAL.map.caveFrom&&f<=BAL.map.caveTo&&!big&&rf()<BAL.map.caveChance;
   for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){
    m[ix(xx,yy)]=1;
    if(cave&&xx!==rcx&&yy!==rcy){
     const ring=(xx===x||xx===x+w-1||yy===y||yy===y+h-1);
     if(rf()<(ring?BAL.map.caveRingWall:BAL.map.caveInnerWall))m[ix(xx,yy)]=0;
    }
   }
  }
  if(rooms.length<BAL.map.minRooms)continue;
  if(f===MAXF)rooms.push(rooms.shift());
  for(let i=0;i<rooms.length-1;i++){
   const a=rooms[i],b=rooms[i+1];let x=a.cx,y=a.cy;
   while(x!==b.cx){m[ix(x,y)]=1;x+=b.cx>x?1:-1;}
   while(y!==b.cy){m[ix(x,y)]=1;y+=b.cy>y?1:-1;}
   m[ix(x,y)]=1;
  }
  const last=rooms[rooms.length-1];
  if(f<MAXF)m[ix(last.cx,last.cy)]=2;
  // verify connectivity
  const seen=new Array(W*H).fill(false),q=[[rooms[0].cx,rooms[0].cy]];seen[ix(q[0][0],q[0][1])]=true;
  for(let i=0;i<q.length;i++){const [x,y]=q[i];for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;
   if(inb(nx,ny)&&m[ix(nx,ny)]!==0&&!seen[ix(nx,ny)]){seen[ix(nx,ny)]=true;q.push([nx,ny]);}}}
  if(!seen[ix(last.cx,last.cy)])continue;
  let ok=true;for(const r of rooms)if(!seen[ix(r.cx,r.cy)])ok=false;
  if(!ok)continue;
  // doors on straight corridor tiles right next to a room
  const inRoom=(x,y)=>rooms.some(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h);
  const fl=(x,y)=>inb(x,y)&&m[ix(x,y)]!==0;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
   if(m[ix(x,y)]!==1||inRoom(x,y))continue;
   let isD=false;
   if(fl(x-1,y)&&fl(x+1,y)&&!fl(x,y-1)&&!fl(x,y+1)&&(inRoom(x-1,y)||inRoom(x+1,y)))isD=true;
   if(fl(x,y-1)&&fl(x,y+1)&&!fl(x-1,y)&&!fl(x+1,y)&&(inRoom(x,y-1)||inRoom(x,y+1)))isD=true;
   if(isD&&rf()<BAL.map.doorChance)m[ix(x,y)]=3;
  }
  return {m,rooms};
 }
 // fallback: simple open map
 const m=new Array(W*H).fill(0);for(let y=2;y<W-2;y++)for(let x=2;x<W-2;x++)m[ix(x,y)]=1;
 if(f<MAXF)m[ix(W-4,H-4)]=2;
 return {m,rooms:[{x:2,y:2,w:26,h:26,cx:3,cy:3},{x:2,y:2,w:26,h:26,cx:W-4,cy:H-4}]};
}
function carveTreasure(rooms,f){
 const cand=rooms.filter((r,i)=>i>0&&!(f===MAXF&&i===rooms.length-1));
 for(let a=0;a<60&&cand.length;a++){
  const r=pick(cand),side=rnd(0,3),dx=[1,-1,0,0][side],dy=[0,0,1,-1][side];
  const ddx=dx?(dx>0?r.x+r.w:r.x-1):r.cx,ddy=dx?r.cy:(dy>0?r.y+r.h:r.y-1);
  const cx=ddx+dx*2,cy=ddy+dy*2;let ok=true;
  for(let y=cy-2;y<=cy+2&&ok;y++)for(let x=cx-2;x<=cx+2;x++){if(x<1||y<1||x>W-2||y>H-2||G.map[ix(x,y)]!==0){ok=false;break;}}
  if(!ok||G.map[ix(ddx-dx,ddy-dy)]!==1)continue;
  G.map[ix(ddx,ddy)]=5;const cells=[];
  for(let y=cy-1;y<=cy+1;y++)for(let x=cx-1;x<=cx+1;x++){G.map[ix(x,y)]=1;cells.push([x,y]);}
  return {door:[ddx,ddy],cells:cells};

// mods.js - floor modifiers (rules for the 8 in MODS), the two-way exit choice and the HUD chip. Numbers: BAL.mod; text: MODS in balance.js.

function modIs(id){return !!G&&G.mod===id;}
function goldMod(){return modIs('rich')?BAL.mod.rich.goldMul:1;}
function visRadius(){return modIs('dark')?BAL.mod.dark.sight:BAL.vis.radius;}
function enemySight(){return modIs('silent')?BAL.mod.silent.sight:BAL.enemyAi.sightRange;}
function waterSet(){const w=G&&G.water;if(!w||!w.length)return wsc.empty||(wsc.empty=new Set());if(wsc.arr!==w){wsc.arr=w;wsc.set=new Set(w);}return wsc.set;}
function crackSet(){const st=new Set();if(G&&G.cracks)for(const c of G.cracks)st.add(ix(c.x,c.y));return st;}
// hp / attack multipliers a modifier or Hard mode puts on a freshly created enemy of kind d
function enemyMul(d){
 let hp=1,atk=1;const M=BAL.mod,H=BAL.hard;
 if(!d.boss){
  if(modIs('horde')){hp*=M.horde.hpMul;atk*=M.horde.atkMul;}
  if(modIs('rich')){hp*=M.rich.hpMul;atk*=M.rich.atkMul;}
  if(G.hard){hp*=H.hpMul;atk*=H.atkMul;}
 }else if(G.hard)atk*=H.bossAtkMul;

}
// Flooded: a few pools per room on plain floor tiles that hold nothing else. Water never blocks movement, so reachability is untouched.
function placeWater(rooms,taken){
 const M=BAL.mod.flooded,out=[],used=new Set();
 for(const r of rooms){
  if(r.w>=BAL.map.bossRoomW)continue;
  const ok=(x,y)=>inb(x,y)&&G.map[ix(x,y)]===1&&!taken.has(ix(x,y))&&!used.has(ix(x,y))&&x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h;
  let sx=-1,sy=-1;
  for(let a=0;a<30;a++){const x=rnd(r.x,r.x+r.w-1),y=rnd(r.y,r.y+r.h-1);if(ok(x,y)){sx=x;sy=y;break;}}
  if(sx<0)continue;

function crackTick(){

// enemies.js - enemy AI: waking, movement, kiting, pack surround, healing casters, wind-up telegraphed attacks, dragon phases.

function dangerSet(){const st=new Set();if(!G)return st;for(const e of G.enemies)if(e.wind&&!e.dead)for(const t of e.wind.tiles)st.add(ix(t[0],t[1]));return st;}
function dangerNear(dz){const p=G.p;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dz.has(ix(p.x+dx,p.y+dy))&&inb(p.x+dx,p.y+dy))return true;return false;}
// a wind-up is only started if the player has a free adjacent tile outside the marked area
function canEscape(tiles){
 const p=G.p,st=new Set(tiles.map(t=>ix(t[0],t[1])));
 for(const [dx,dy] of DIRS){const nx=p.x+dx,ny=p.y+dy;if(!inb(nx,ny))continue;const t=G.map[ix(nx,ny)];
  if(t===0||t===3||t===5||merchantAt(nx,ny)||enemyAt(nx,ny))continue;if(!st.has(ix(nx,ny)))return true;}
 return false;
}
function smashWind(e){
 const p=G.p,dx=p.x-e.x,dy=p.y-e.y,px=Math.abs(dy),py=Math.abs(dx),tiles=[];
 for(const o of [0,1,-1]){const x=p.x+px*o,y=p.y+py*o;if(inb(x,y)&&G.map[ix(x,y)]!==0&&G.map[ix(x,y)]!==3&&G.map[ix(x,y)]!==5&&!(x===e.x&&y===e.y))tiles.push([x,y]);}
 if(!canEscape(tiles))return null;
 return {k:'smash',tiles:tiles,dx:dx,dy:dy};
}
function breathWind(e){
 const p=G.p,dx=p.x-e.x,dy=p.y-e.y;let ax=0,ay=0,off,k;
 if(Math.abs(dx)>=Math.abs(dy)){ax=Math.sign(dx);off=dy;k=Math.abs(dx);}else{ay=Math.sign(dy);off=dx;k=Math.abs(dy);}
 if(k<1||k>BAL.enemyAi.breathRange||Math.abs(off)>1)return null;
 const px=ay!==0?1:0,py=ax!==0?1:0;
 const s0=off>0?-1:off<0?1:(rf()<0.5?1:-1);
 for(const sd of [s0,-s0]){
  const offs=[off,off+sd,off+2*sd],tiles=[];
  for(const o of offs){
   for(let kk=1;kk<=BAL.enemyAi.breathLength;kk++){
    const x=e.x+ax*kk+px*o,y=e.y+ay*kk+py*o;
    if(!inb(x,y)||G.map[ix(x,y)]===0||G.map[ix(x,y)]===3||G.map[ix(x,y)]===5)break;
    tiles.push([x,y]);
   }
  }
  if(tiles.some(t=>t[0]===p.x&&t[1]===p.y)&&canEscape(tiles))return {k:'breath',tiles:tiles,dx:ax,dy:ay};
 }
 return null;
}
// enraged dragon: telegraphed sweep over the ring of tiles around it (only started when you are next to it and can step out)
function sweepWind(e){
 const tiles=[];
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const x=e.x+dx,y=e.y+dy;
  if(inb(x,y)&&G.map[ix(x,y)]!==0&&G.map[ix(x,y)]!==3&&G.map[ix(x,y)]!==5)tiles.push([x,y]);}
 if(!canEscape(tiles))return null;
 return {k:'sweep',tiles:tiles,dx:0,dy:0};
}
function summonWhelps(e){
 const c=[];
 for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const x=e.x+dx,y=e.y+dy;
  if(inb(x,y)&&G.map[ix(x,y)]===1&&!enemyAt(x,y)&&!(x===G.p.x&&y===G.p.y)&&!trapAt(x,y))c.push([x,y]);}
 c.sort(()=>rf()-0.5);
 let n=0;
 for(const t of c){if(n>=BAL.enemyAi.summonN)break;const w=makeEnemy('whelp',t[0],t[1],G.floor);w.awake=true;n++;}
 msg('The '+EN[e.t].n+' calls its brood: '+n+' whelps!');floatFx(e.x,e.y,'BROOD','#f95',true);
}
function summonList(){return G.hard?[BAL.hard.extraSummonAt].concat(BAL.enemyAi.summonAt):BAL.enemyAi.summonAt;}
function bossPhase(e){
 const at=summonList();
 while((e.sm||0)<at.length&&e.hp<e.mhp*at[e.sm||0]){e.sm=(e.sm||0)+1;summonWhelps(e);}
}
function resolveWind(e,d){
 const w=e.wind,p=G.p;e.wind=null;e.cd=w.k==='smash'?BAL.enemyAi.smashCooldown:w.k==='sweep'?BAL.enemyAi.sweepCd:Math.max(1,(e.enraged?BAL.enemyAi.enrageBreathCd:BAL.enemyAi.breathCooldown)-(d.boss&&gHeat(G)>=5?BAL.heat.breathCut:0));
 if(w.tiles.some(t=>t[0]===p.x&&t[1]===p.y)){
  if(d.boss&&w.k!=='smash')G.stats.dragonHit=1;
  const dmg=Math.round(e.atk*(w.k==='sweep'?BAL.enemyAi.sweepMul:(d.windMul||BAL.enemyAi.defaultWindMul)));
  if(w.k==='sweep')hurtPlayer(e,dmg,true,'sweeps');
  else if(w.k==='smash'){if(hurtPlayer(e,dmg,true,'SMASHES')&&p.hp>0)knock(p,w.dx,w.dy);}
  else hurtPlayer(e,dmg,false,'scorches');
 }else{msg('The '+d.n+"'s attack hits empty ground.");floatFx(e.x,e.y,'miss','#ccc');}
}
function moveEnemy(e,x,y){
 const i=ix(x,y);markGone(e.x,e.y);if(vOff>0)holdSet(e.x,e.y,vOff);   // the step is drawn after the player's own action
 if(waterSet().has(i))e.wade=1;
 if(G.map[i]===3){G.map[i]=4;if(G.vis[i])msg('The '+nm(e)+' opens the door.');}
 e.face=[Math.sign(x-e.x),Math.sign(y-e.y)];e.x=x;e.y=y;
 const tp=trapAt(x,y);if(tp)springEnemy(e,tp);
}
function fleeStep(e,p){
 let best=null,bd=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);
 for(const [dx,dy] of DIRS){const nx=e.x+dx,ny=e.y+dy;
  if(!walkable(nx,ny)||G.map[ix(nx,ny)]===3||enemyAt(nx,ny)||(nx===p.x&&ny===p.y))continue;
  const nd=Math.abs(nx-p.x)+Math.abs(ny-p.y);if(nd>bd){bd=nd;best=[nx,ny];}}
 return best;
}
// pack AI: head for a free tile next to the player rather than queueing behind others
function surroundStep(e,p){
 const dm=bfsDist(e.x,e.y);let tg=null,bd=9999;
 for(const [dx,dy] of DIRS){const tx=p.x+dx,ty=p.y+dy,k=ix(tx,ty);
  if(!walkable(tx,ty)||G.map[k]===3||enemyAt(tx,ty)||claimed.has(k))continue;
  if(dm[k]<bd){bd=dm[k];tg=[tx,ty];}}
 if(!tg||bd>=9999)return null;
 claimed.add(ix(tg[0],tg[1]));
 const dt=bfsDist(tg[0],tg[1]);let best=null,cd=dt[ix(e.x,e.y)];
 for(const [dx,dy] of DIRS){const nx=e.x+dx,ny=e.y+dy;
  if(!walkable(nx,ny)||enemyAt(nx,ny)||(nx===p.x&&ny===p.y))continue;
  if(dt[ix(nx,ny)]<cd){cd=dt[ix(nx,ny)];best=[nx,ny];}}
 return best;
}
function enemiesAct(free){
 const p=G.p,dist=bfsDist(p.x,p.y);claimed=new Set();let beat=0;
 try{
 for(const e of G.enemies.slice()){
  if(p.hp<=0)break;if(e.dead)continue;
  // everything the enemy phase shows starts 140 ms behind the player's own action, attackers 60 ms apart (at most 300 ms): cause, then effect
  vOff=Math.min(300,140+60*beat);if(e.awake&&G.vis[ix(e.x,e.y)])beat++;
  const d=EN[e.t];if(!free&&e.cd>0)e.cd--;if(!free&&e.hcd>0)e.hcd--;
  if(d.boss&&!free)bossPhase(e);
  if(e.stun>0||e.frz>0){e.wind=null;if(!free){if(e.stun>0)e.stun--;if(e.frz>0)e.frz--;}continue;}
  if(e.wade){if(!free)e.wade=0;continue;}   // Flooded: it waded into water and loses this move
  if(G.smoke&&inSmoke(e.x,e.y))e.blind=Math.max(e.blind||0,2);
  const blindNow=e.blind>0;if(!free&&e.blind>0)e.blind--;
  if(G.vanish>0){e.awake=false;e.wind=null;continue;}
  if(free&&(e.wind||d.slowAct))continue;
  if(e.wind){resolveWind(e,d);continue;}
  const md=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);
  const sightR=Math.max(1,enemySight()-(eqKind('charm')==='veil'?BAL.charm.veilSight:0));
  const see=!blindNow&&md<=(G.smoke&&inSmoke(p.x,p.y)?1:sightR)&&los(e.x,e.y,p.x,p.y);
  if(see)e.awake=true;
  if(!e.awake)continue;
  if(!see&&!e.alarm&&dist[ix(e.x,e.y)]>BAL.enemyAi.loseTrackDist){e.awake=false;continue;}
  if(d.slowAct){if(e.rest){e.rest=0;continue;}e.rest=1;}
  if(d.boss&&!e.enraged&&e.hp<e.mhp*(gHeat(G)>=5?BAL.heat.enrageFrac:G.hard?BAL.hard.enrageFrac:BAL.enemyAi.enrageFrac)){e.enraged=1;e.atk=Math.round(e.atk*BAL.enemyAi.enrageAtkMul);msg('The '+d.n+' roars in fury!');callout(e.x,e.y,'ENRAGED','#f55');}
  if(d.heal&&!free&&!(e.hcd>0)){
   let tg=null,bf=BAL.enemyAi.healBelow;
   for(const o of G.enemies){if(o===e||o.dead)continue;const fr=o.hp/o.mhp;
    if(fr<bf&&manh(o,e)<=BAL.enemyAi.healRange&&los(e.x,e.y,o.x,o.y)){bf=fr;tg=o;}}
   if(tg){const h=Math.max(1,Math.round(tg.mhp*BAL.enemyAi.healFrac));tg.hp=Math.min(tg.mhp,tg.hp+h);e.hcd=BAL.enemyAi.healEvery;
    floatFx(tg.x,tg.y,'+'+h,'#8f8');if(G.vis[ix(tg.x,tg.y)])msg('The '+d.n+' mends the '+nm(tg)+'.');continue;}
  }
  const steps=(d.speed||1)+((d.lunge&&!free&&md>1&&(G.turn+e.id)%BAL.enemyAi.lungeEvery===0)?1:0);
  for(let s=0;s<steps;s++){
   if(e.dead)break;
   const dd=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);
   if(d.sweep&&e.enraged&&!free&&dd===1&&e.cd<=0){const w=sweepWind(e);if(w){e.wind=w;msg('The '+d.n+' whips its tail around!');floatFx(e.x,e.y,'!','#f55');break;}}
   if(d.breath&&!free&&e.cd<=0&&see){const w=breathWind(e);if(w){e.wind=w;msg(d.windMsg);floatFx(e.x,e.y,'!','#f55');break;}}
   if(d.wind&&!free&&dd===1&&e.cd<=0){const w=smashWind(e);if(w){e.wind=w;msg(d.windMsg);floatFx(e.x,e.y,'!','#f55');break;}}
   if(dd===1){
    if(d.kite){
     if(e.tired>0)e.tired--;
     else{const fs=fleeStep(e,p);if(fs){e.fl=(e.fl||0)+1;if(e.fl>=BAL.enemyAi.fleeSteps){e.tired=BAL.enemyAi.tiredTurns;e.fl=0;}moveEnemy(e,fs[0],fs[1]);break;}}
    }
    hurtPlayer(e,e.atk,true);break;}
   if(d.range&&see&&dd<=d.range&&e.cd<=0&&los(e.x,e.y,p.x,p.y,true)){hurtPlayer(e,e.atk,false);e.cd=d.cdmax||0;break;}
   if(d.kite&&see&&dd===2&&e.cd>0){const fs=fleeStep(e,p);if(fs){moveEnemy(e,fs[0],fs[1]);break;}}
   if(d.slow&&G.turn%2)break;
   let best=null;
   if(d.pack&&dd>1)best=surroundStep(e,p);
   if(!best){let bd=dist[ix(e.x,e.y)];
    for(const [dx,dy] of DIRS){const nx=e.x+dx,ny=e.y+dy;
     if(!walkable(nx,ny)||enemyAt(nx,ny)||(nx===p.x&&ny===p.y))continue;
     if(dist[ix(nx,ny)]<bd){bd=dist[ix(nx,ny)];best=[nx,ny];}}}
   if(best)moveEnemy(e,best[0],best[1]);else break;
  }
 }
}finally{vOff=0;}
}

 {const p=G.p,ch=eqKind('charm');

  }

  if(ch==='soul'){if(p.cls==='warrior')gainRage(BAL.charm.soulRage,true);else if(p.cls==='mage')p.mana=Math.min(mmax(),p.mana+BAL.charm.soulMana);else for(const k in G.cd)if(G.cd[k]>0)G.cd[k]--;}

// push a unit one tile; never into walls/doors/units/out of bounds (those cause bump damage instead)
function knock(u,dx,dy){
 const p=G.p,isP=u===p;
 if(!isP&&EN[u.t].boss){msg('The '+nm(u)+' is too heavy to push.');return false;}
 const nx=u.x+dx,ny=u.y+dy;let bump=false,other=null,what='the wall';
 if(!inb(nx,ny)||G.map[ix(nx,ny)]===0||G.map[ix(nx,ny)]===3||G.map[ix(nx,ny)]===5||merchantAt(nx,ny))bump=true;
 else{other=(nx===p.x&&ny===p.y&&!isP)?p:enemyAt(nx,ny);if(other){bump=true;what=other===p?'you':'the '+nm(other);}}
 const hitU=(t,d)=>{
  if(t===p){p.hp-=d;G.killer='a wall slam';playerHurtFx(d);floatFx(p.x,p.y,'-'+d,'#ff5a5a');secondWind();}
  else{hurtEnemy(t,d,'#ffb04a');settle(t,'Impact');}
 };
 if(bump){
  const d=kbDmg();
  msg((isP?'You are':'The '+nm(u)+' is')+' slammed into '+what+' for '+d+'!');
  floatFx(u.x,u.y,'BUMP','#ffb04a');
  if(!isP)u.wind=null;
  hitU(u,d);
  if(other&&!other.dead)hitU(other,Math.max(1,Math.floor(d/2)));
  return false;
 }
 if(!isP)markGone(u.x,u.y);
 u.x=nx;u.y=ny;

 return true;
}

 if(p.cls==='mage'){p.mf=(p.mf||0)+manaRegen();const w=Math.floor(p.mf);p.mf-=w;p.mana=Math.min(mmax(),p.mana+w);}

 }
 if(G.ppois&&p.hp>0){const d=G.ppois.d;p.hp-=d;G.killer='dart poison';floatFx(p.x,p.y,'-'+d,'#7be04b');G.ppois.t--;if(G.ppois.t<=0){G.ppois=null;msg('The poison wears off.');}secondWind();}
 tickPoison();
 if(G.won){finish('win');return;}
 crackTick();
 enemiesAct();
 if(G.wade){G.wade=0;if(p.hp>0&&!G.won&&G.enemies.some(e=>e.awake)){msg('You slog through the water: enemies get a free move.');enemiesAct(true);}}
 if(traitOf('armor')==='heavy'&&G.turn%BAL.trait.heavyEvery===0&&p.hp>0&&!G.won&&G.enemies.some(e=>e.awake)){msg('Your heavy armor slows you: enemies get a free turn.');enemiesAct(true);}
 if(G.vanish>0)G.vanish--;
 if(G.won){finish('win');return;}
 if(p.hp<=0){p.hp=0;msg('You have died...');finish('dead');return;}

}

function cdFor(k){

function costLabel(k){const c=costOf(k);return c.rage?c.rage+' rage':c.mana?c.mana+' mana':k==='knife'?'1 knife':cdFor(k)?'ready':'free';}
function inSmoke(x,y){const k=ix(x,y);if(G.smoke)for(const c of G.smoke)if(c.cells.indexOf(k)>=0)return true;return false;}
function isFront(e){const p=G.p;if(!e.face)return true;return e.face[0]*(p.x-e.x)+e.face[1]*(p.y-e.y)>0;}
function isBehind(e){const p=G.p;if(!e.face)return false;return e.face[0]*(p.x-e.x)+e.face[1]*(p.y-e.y)<0;}
function gainRage(n,raw){
 const p=G.p;if(p.cls!=='warrior'||n<=0)return;
 if(!raw){n*=(armK()&&armK().rageMul||1)*(1+pc('fury')*BAL.perk.furyMul)*((G.syn&&G.syn.fb&&p.hp<p.mhp*0.5)?BAL.perk.bloodRageMul:1);}
 p.rage=Math.min(BAL.rage.max,(p.rage||0)+Math.max(1,Math.round(n)));
}
function advEnemies(vis){return G.enemies.filter(e=>!e.dead&&manh(e,G.p)===1&&(!vis||G.vis[ix(e.x,e.y)]));}
function chebEnemies(){return G.enemies.filter(e=>!e.dead&&cheb(e,G.p)===1&&G.vis[ix(e.x,e.y)]);}
function enemyShots(range){return G.enemies.filter(e=>!e.dead&&G.vis[ix(e.x,e.y)]&&manh(e,G.p)<=range&&los(G.p.x,G.p.y,e.x,e.y,true));}
function chargeLines(){
 const p=G.p,a=BAL.ability.charge,out=[];
 for(const [dx,dy] of DIRS){
  for(let k=1;k<=a.maxDist+(eqKind('off')==='gauntlet'?BAL.offhand.gauntletRange:0);k++){
   const x=p.x+dx*k,y=p.y+dy*k;
   if(!inb(x,y)||!walkable(x,y)||G.map[ix(x,y)]===3)break;
   const e=enemyAt(x,y);
   if(e){if(k>=a.minDist&&G.vis[ix(x,y)])out.push({e:e,lx:p.x+dx*(k-1),ly:p.y+dy*(k-1),dx:dx,dy:dy});break;}
  }
 }
 return out;
}
function blinkTiles(){
 const p=G.p,R=BAL.ability.blink.range,out=[],reach=bfsDist(p.x,p.y);   // only tiles you could also walk to: cave walls can leave sealed floor pockets that are visible but unreachable
 for(let y=p.y-R;y<=p.y+R;y++)for(let x=p.x-R;x<=p.x+R;x++){
  if(!inb(x,y)||Math.abs(x-p.x)+Math.abs(y-p.y)>R||(x===p.x&&y===p.y)||reach[ix(x,y)]>=9999)continue;
  const t=G.map[ix(x,y)];
  if(!G.vis[ix(x,y)]||(t!==1&&t!==2&&t!==4)||enemyAt(x,y)||merchantAt(x,y)||!los(p.x,p.y,x,y))continue;
  out.push([x,y]);
 }
 return out;
}
function groundTiles(range){
 const p=G.p,out=[];
 for(let y=p.y-range;y<=p.y+range;y++)for(let x=p.x-range;x<=p.x+range;x++){
  if(!inb(x,y)||Math.abs(x-p.x)+Math.abs(y-p.y)>range||!G.vis[ix(x,y)])continue;
  const t=G.map[ix(x,y)];if(t===0||t===5||merchantAt(x,y))continue;
  if(!los(p.x,p.y,x,y))continue;
  out.push([x,y]);
 }
 return out;
}
// valid target tiles for a targeted ability (also drives the highlight)
function targetTiles(k){
 if(!G)return [];
 switch(k){
  case 'bash':case 'backstab':return advEnemies(true).map(e=>[e.x,e.y]);
  case 'charge':return chargeLines().map(c=>[c.e.x,c.e.y]);
  case 'bolt':return enemyShots(BAL.ability.bolt.range).map(e=>[e.x,e.y]);
  case 'knife':return enemyShots(BAL.ability.knife.range).map(e=>[e.x,e.y]);
  case 'blink':return blinkTiles();
  case 'fire':return groundTiles(BAL.ability.fire.range);
  case 'smoke':return groundTiles(BAL.ability.smoke.range);
 }
 return [];
}
// reason an ability cannot be used right now ('' = usable)
function whyNot(k){
 const A=ABIL[k],c=costOf(k),p=G.p;
 if(G.cd[k]>0)return A.n+': '+G.cd[k]+' turn'+(G.cd[k]>1?'s':'')+' to recharge.';
 if(c.rage&&(p.rage||0)<c.rage)return A.n+' needs '+c.rage+' rage (have '+Math.floor(p.rage||0)+').';
 if(c.mana&&(p.mana||0)<c.mana)return A.n+' needs '+c.mana+' mana (have '+Math.floor(p.mana||0)+').';
 if(k==='knife'&&(G.knives||0)<1)return 'No knives. Walk over one to pick it up.';
 if((k==='cleave'||k==='nova')&&!chebEnemies().length)return A.n+': no enemy next to you.';
 if(A.tg!=='self'&&!targetTiles(k).length){
  return k==='charge'?'Charge: need a foe in line, '+BAL.ability.charge.minDist+'-'+BAL.ability.charge.maxDist+' tiles.':
   (k==='bash'||k==='backstab')?(chebEnemies().length?A.n+': that foe is diagonal. Straight lines only.':A.n+': no enemy next to you.'):A.n+': no target.';
 }
 return '';
}
function spend(k){
 const c=costOf(k),p=G.p;
 if(c.rage)p.rage=Math.max(0,(p.rage||0)-c.rage);
 if(c.mana)p.mana=Math.max(0,(p.mana||0)-c.mana);
 if(k==='knife')G.knives--;
 const cd=cdFor(k);if(cd)G.cd[k]=cd;
}

 e.stun=Math.max(e.stun||0,EN[e.t].boss?tb:t);e.wind=null;floatFx(e.x,e.y,'stunned','#ffe066');

// run an ability by key (the bot and the buttons both come through here). Returns true if the turn was used.
function useAbility(k,tx,ty){
 if(!G||G.over||modalOpen())return false;
 const why=whyNot(k);
 if(why){msg(why);render();return false;}
 const A=ABIL[k];
 if(A.tg!=='self'){
  if(tx==null||!targetTiles(k).some(t=>t[0]===tx&&t[1]===ty)){msg(A.n+': tap a lit tile.');render();return false;}
 }
 armed=null;
 DO[k](tx,ty);
 return true;
}
function toggleAbility(k){
 walkTok++;if(!G||G.over||modalOpen())return;
 if(armed===k){cancelTarget();return;}
 const why=whyNot(k);
 if(why){msg(why);if(armed){armed=null;}render();return;}
 if(ABIL[k].tg==='self'){useAbility(k);return;}
 armed=k;msg(ABIL[k].n+': tap a target.');render();
}
function cancelTarget(){if(armed){armed=null;msg('Cancelled.');}render();}
// ---- weapon reach (spear) ----
function reachOk(e){
 const wk=wpK();if(!wk||!wk.reach||!e||e.dead||!G.vis[ix(e.x,e.y)])return false;
 const p=G.p,dx=e.x-p.x,dy=e.y-p.y;
 if(!((dx===0&&Math.abs(dy)===wk.reach)||(dy===0&&Math.abs(dx)===wk.reach)))return false;
 const sx=Math.sign(dx),sy=Math.sign(dy);
 for(let k=1;k<wk.reach;k++){const x=p.x+sx*k,y=p.y+sy*k;if(!walkable(x,y)||G.map[ix(x,y)]===3||enemyAt(x,y))return false;}
 return true;
}
function reachAttack(e){
 if(!G||G.over||!reachOk(e))return false;
 walkTok++;msg('You thrust your spear.');playerAttack(e);endTurn();return true;
}

// player.js - class lookup and XP / level-up progression.

function clsOf(p){return CLS[p.cls]||CLS.warrior;}
function needXp(l){return BAL.xp.base+l*BAL.xp.perLevel;}
function gainXp(n){
 const p=G.p;p.xp+=Math.round(n*p.xpMul);
 while(p.xp>=needXp(p.lvl)){p.xp-=needXp(p.lvl);p.lvl++;G.pending++;const lg=LG[p.cls]||LG.warrior;p.mhp+=lg.hp;p.hp+=lg.hp;if(lg.atkE&&p.lvl%lg.atkE===0)p.atk++;msg('Level up! You are level '+p.lvl+'.');pulseUntil=performance.now()+700;callout(p.x,p.y,'LEVEL UP','#ffd24a');sfx('level');try{if(!rmo()){const h=$('hpbar');h.classList.remove('pulse');void h.offsetWidth;h.classList.add('pulse');}}catch(e){}}
}

// run.js - run lifecycle: starting a run, populating floors, descending, death tip and the end-of-run summary.

function makeEnemy(type,x,y,f){
 const d=EN[type],s=d.boss?1:1+BAL.enemy.hpPerFloor*(f-1)*(d.range?BAL.enemy.rangedHpFactor:1),sa=d.boss?1:1+BAL.enemy.atkPerFloor*(f-1)*(d.range?BAL.enemy.rangedAtkFactor:1);
 const fl=d.flat?1:s,fa=d.flat?1:sa;
 const em=enemyMul(d),ea=d.boss?1:(BAL.enemy.early[f-1]||1),hp=Math.round(d.hp*fl*em[0]*ea),e={id:G.nid++,t:type,x,y,hp,mhp:hp,atk:Math.round(d.atk*fa*em[1]*ea),awake:false,cd:0,face:pick(DIRS)};
 G.enemies.push(e);return e;
}
function stairsOk(){
 let t=G.map.indexOf(2);
 if(t<0){const d=G.enemies.find(e=>EN[e.t].boss);if(!d)return true;t=ix(d.x,d.y);}
 const p=G.p,blk=new Set(G.traps.map(a=>ix(a.x,a.y))),seen=new Set([ix(p.x,p.y)]),q=[[p.x,p.y]];
 for(let i=0;i<q.length;i++){const [x,y]=q[i];
  for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,k=ix(nx,ny);
   if(!walkable(nx,ny)||seen.has(k)||blk.has(k))continue;seen.add(k);q.push([nx,ny]);}}
 if(!seen.has(t))return false;
 const m=G.merchant;
 if(m&&!DIRS.some(d=>seen.has(ix(m.x+d[0],m.y+d[1]))))return false;
 const sh=G.shrine;
 if(sh&&!seen.has(ix(sh.x,sh.y)))return false;
 return true;
}
// opt = {mod, v}: the floor modifier id (or null) and the theme variant, chosen on the previous floor's exit. A Daily floor is generated from
// the date, the depth and the option alone, so it comes out the same for everyone and whatever happened on earlier floors.
function newFloor(f,opt){
 opt=opt||{mod:null,v:0};
 G.mod=modOf(opt.mod)?opt.mod:null;G.variant=opt.v|0;
 if(G.daily)withStream(hashStr(G.daily+'|F'+f+'|'+G.variant+'|'+(G.mod||'-')),function(){buildFloor(f);});else buildFloor(f);
 const th=themeOf(f,G.variant),m=G.mod?modOf(G.mod):null;
 bannerText='Floor '+f+' - '+th.n;bannerUntil=performance.now()+1800;
 if(m){bannerText+=' - '+m.n;msg(m.n+': '+m.tip);}
 G.opts=null;
 if(f+1<MAXF)G.opts=rollOpts(f+1);
 computeVis();

   if(i>0){msg('Trap in the way.');startWalk(full.slice(0,i),{explore:true});return;}
  }
 }
 if(goal<0&&cz.size){
  // unexplored ground (or the stairs' way) exists only through a cracking tile: walk up to it and say so, instead of "nothing left" (Wait lets it settle)
  const q=[[p.x,p.y]],pv=new Map([[ix(p.x,p.y),-1]]);let g3=-1;
  for(let i=0;i<q.length&&g3<0;i++){const [x,y]=q[i];
   for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,k=ix(nx,ny);
    if(!inb(nx,ny)||pv.has(k)||!G.seen[k]||G.map[k]===0||G.map[k]===5||merchantAt(nx,ny)||tz.has(k)||enemyAt(nx,ny)||dz.has(k))continue;
    pv.set(k,ix(x,y));q.push([nx,ny]);
    if(!G.exp[k]||G.map[k]===3||loot.has(k)||G.map[k]===2){g3=k;break;}}}
  if(g3>=0){
   const full=[];let k=g3;while(k!==ix(p.x,p.y)){full.push([k%W,Math.floor(k/W)]);k=pv.get(k);}full.reverse();
   const i=full.findIndex(t=>cz.has(ix(t[0],t[1])));
   if(i>=0){msg('The floor is cracking ahead. Wait for it to settle.');if(i>0)startWalk(full.slice(0,i),{explore:true});else render();return;}
  }
 }
 if(goal<0){
  // go to stairs if seen
  for(let k=0;k<W*H;k++)if(G.map[k]===2&&G.seen[k]){const pa=bfsPath(p.x,p.y,k%W,Math.floor(k/W));if(pa&&pa.length){msg('Explored. To the stairs.');startWalk(pa);return;}}
  msg('Nothing left to explore.');render();return;
 }
 const path=[];let k=goal;while(k!==ix(p.x,p.y)){path.push([k%W,Math.floor(k/W)]);k=prev.get(k);}

function itemName(it){
 const base={gold:'Gold pile',potion:'Potion',fire:'Flames',tele:'Teleport',knife:'Knife',key:'Brass key'}[it.t];
 return base||(gearName(it)+': '+(it.tr&&TR[it.tr]?TR[it.tr].d:itemRuleShort(it)).replace(/\.$/,''));

// Stale taps. A tap lands where a foe WAS: it died to the previous tap, or it stepped away while the finger was on its way down. That must never
// turn into a walk. Rule: a tap on an EMPTY tile is ignored (no move, no turn) when (1) a foe left or died on that tile in the turn that has just
// resolved, less than BAL.ui.staleMs ago (it is what the player aimed at), or (2) it is the tile the previous tap attacked or closed in on, less
// than BAL.ui.burstMs after that tap (a burst of taps at one spot); every ignored burst tap extends that window. A foe standing on the tile NOW
// is attacked as usual; any other tap acts at once.
function markGone(x,y){if(goneT.size>64)goneT.clear();goneT.set(ix(x,y),performance.now());}
function staleTap(tx,ty){
 const k=ix(tx,ty),now=performance.now();
 if(enemyAt(tx,ty))return false;
 const g=goneT.get(k);
 if(g!=null&&now-g<BAL.ui.staleMs)return true;
 if(lastAtk&&lastAtk.k===k&&lastAtk.g===G&&now-lastAtk.t<BAL.ui.burstMs){lastAtk.t=now;return true;}
 return false;
}
function onTap(tx,ty){
 walkTok++;
 if(!G||G.over||modalOpen())return;
 const p=G.p;
 if(armed){
  if(!inb(tx,ty))return;
  if(tx===p.x&&ty===p.y){cancelTarget();return;}
  tapMark={x:tx,y:ty,t:performance.now()};
  useAbility(armed,tx,ty);
  render();return;
 }
 if(inb(tx,ty)){tapMark={x:tx,y:ty,t:performance.now()};render();}
 if(tx===p.x&&ty===p.y){
  const sh=G.shrine;
  if(sh&&!sh.used&&sh.x===p.x&&sh.y===p.y){showShrine();return;}
  const gi=G.items.find(i=>i.x===p.x&&i.y===p.y&&SLOTS.indexOf(i.t)>=0);
  if(gi&&gi.skip){gi.skip=0;gearQ=gi;showGear();return;}   // tap yourself on a gear item you declined: its card again
  if(G.map[ix(tx,ty)]===2)descend();else wait();return;}
 if(!inb(tx,ty)||!G.seen[ix(tx,ty)]||G.map[ix(tx,ty)]===0){msg('Tap an explored tile.');return;}
 if(staleTap(tx,ty)){msg('That foe is gone.');return;}
 const adj=Math.abs(tx-p.x)+Math.abs(ty-p.y)===1;
 if(merchantAt(tx,ty)){
  if(adj){showShop();return;}
  const mp=bfsPath(p.x,p.y,tx,ty);
  if(mp&&mp.length>1){mp.pop();startWalk(mp,{done:showShop});}else msg("Can't reach the merchant.");
  return;}
 if(G.map[ix(tx,ty)]===5){
  if(adj){tryMove(tx-p.x,ty-p.y);return;}
  const lp=bfsPath(p.x,p.y,tx,ty);
  if(lp&&lp.length>1){lp.pop();startWalk(lp,{done:function(){if(G&&!G.over)tryMove(tx-G.p.x,ty-G.p.y);}});}else msg("Can't reach the locked door.");
  return;}
 const e=enemyAt(tx,ty);
 if(!(e&&G.vis[ix(tx,ty)])){
  const pr=perilAt(ix(tx,ty));
  if(pr){ // a revealed trap or a tile about to be hit: the first tap only marks it, a second tap on it goes ahead
   const now=performance.now();
   if(!(guard&&guard.k===ix(tx,ty)&&guard.f===G.floor&&now<guard.until)){
    guard={k:ix(tx,ty),x:tx,y:ty,f:G.floor,until:now+BAL.ui.guardMs};
    msg(pr==='trap'?'Trap: tap again to go.':'Danger: tap again to go.');render();return;}
   guard.until=now+BAL.ui.guardMs;
   if(adj){guard=null;tryMove(tx-p.x,ty-p.y);return;}
   let best=null;
   for(const [dx,dy] of DIRS){const nx=tx+dx,ny=ty+dy;
    if(!walkable(nx,ny)||enemyAt(nx,ny)||perilAt(ix(nx,ny)))continue;
    const pa=bfsPath(p.x,p.y,nx,ny);if(pa&&pa.length&&(!best||pa.length<best.length))best=pa;}
   if(!best){msg("Can't reach that.");return;}
   startWalk(best,{done:function(){
    if(!G||G.over||modalOpen()||Math.abs(G.p.x-tx)+Math.abs(G.p.y-ty)!==1)return;
    guard=null;tryMove(tx-G.p.x,ty-G.p.y);}});
   return;
  }
  guard=null;
 }
 if(e&&G.vis[ix(tx,ty)]){
  lastAtk={k:ix(tx,ty),t:performance.now(),g:G};
  if(Math.abs(e.x-p.x)+Math.abs(e.y-p.y)===1){tryMove(e.x-p.x,e.y-p.y);return;}
  // melee is straight only (up / down / left / right): a foe on a diagonal cannot hit you either. A tap never steps out of position for it.
  if(cheb(e,p)===1&&!reachOk(e)){msg('Diagonal: no strike either way. Wait, or step in line.');return;}
  if(reachOk(e)){reachAttack(e);return;}
  const d=EN[e.t];   // short log line; hold the foe for the full card (trait, state)
  msg((e.elite?'ELITE '+d.n+' '+e.name:d.n)+' HP '+e.hp+'/'+e.mhp+', ATK '+e.atk+'.'+(e.wind?' WINDING UP!':'')+(e.awake?'':' Unaware.'));
  const path=bfsPath(p.x,p.y,tx,ty);
  if(path&&path.length>1){path.pop();startWalk(path);}else msg("Can't reach it.");
  return;
 }
 const it=itemAt(tx,ty);if(it)msg(itemName(it)+'.');
 if(Math.abs(tx-p.x)+Math.abs(ty-p.y)===1){tryMove(tx-p.x,ty-p.y);return;}
 const path=bfsPath(p.x,p.y,tx,ty);
 if(!path||!path.length){
  // no way round a trap / red tile: walk up to it and stop (the tile itself is then tapped twice to cross)
  const raw=rawPath(p.x,p.y,tx,ty);
  if(raw&&raw.length){
   const i=raw.findIndex(t=>perilAt(ix(t[0],t[1])));
   if(i>=0){msg(perilAt(ix(raw[i][0],raw[i][1]))==='trap'?'Trap in the way.':'Danger in the way.');if(i>0)startWalk(raw.slice(0,i));else render();return;}
  }
  msg("Can't reach that.");return;}
 startWalk(path);
}
// what makes a tile unsafe to step on right now: a revealed trap, a wind-up tile (fires when this turn ends), a crack about to break
function perilAt(k){
 if(!G)return null;
 if(dangerSet().has(k))return 'danger';
 if(trapSet().has(k))return 'trap';
 for(const c of G.cracks||[])if(ix(c.x,c.y)===k&&c.t<=1)return 'danger';
 return null;
}
// like bfsPath but through traps, cracks and red tiles (used only to find out where a walk has to stop)
function rawPath(sx,sy,tx,ty){
 const prev=new Map(),start=ix(sx,sy);prev.set(start,-1);const q=[[sx,sy]],goal=ix(tx,ty);
 for(let i=0;i<q.length;i++){const [x,y]=q[i];if(ix(x,y)===goal)break;
  for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,k=ix(nx,ny);
   if(!inb(nx,ny)||prev.has(k)||!G.seen[k]||G.map[k]===0)continue;
   if(k!==goal&&(enemyAt(nx,ny)||G.map[k]===5||merchantAt(nx,ny)))continue;
   prev.set(k,ix(x,y));q.push([nx,ny]);}}
 if(!prev.has(goal))return null;
 const path=[];let k=goal;while(k!==start){path.push([k%W,Math.floor(k/W)]);k=prev.get(k);}
 return path.reverse();
}

// A dialog that opens because of something that happened (level-up, gear underfoot, shrine, exit choice, merchant, end of run) may appear
// under a finger that is still tapping the map. Real taps are ignored for BAL.ui.modalGraceMs after it opens, and so is any tap whose finger
// went down BEFORE it opened (never both counted). Clicks made through the DOM (Auto, bots) and keyboard activations are not touched.
const GRACE_KINDS={perk:1,gear:1,shrine:1,path:1,shop:1,end:1,reset:1};
document.addEventListener('pointerdown',function(){lastDown=performance.now();},true);

 if(html){const d=document.createElement('div');d.innerHTML=html;d.style.display='flex';d.style.flexDirection='column';d.style.gap='8px';b.appendChild(d);}

  const el=document.createElement('button');if(bt.c)el.className='c';if(bt.cls)el.classList.add(bt.cls);if(bt.k)el.dataset.k=bt.k;

}

function wrapTo(s,n){

// auto.js - Auto (autopilot): plays the run by calling the same action functions a tap would (tryMove, useAbility, drink, descend, the dialog buttons).
// One decision per timer tick (one turn, or one dialog choice). It is deliberately a simple player: no kiting, no retreating to regenerate.

 AUTO.on=false;AUTO.pick=null;AUTO.self=false;AUTO.ignore=new Set();AUTO.shopped={};AUTO.bad=new Set();AUTO.uses={};AUTO.uses8={};AUTO.ticks=0;AUTO.modals=0;AUTO.idle=0;AUTO.mrun=0;AUTO.hp=1e9;AUTO.kills=0;AUTO.err=null;AUTO.lastStop='';AUTO.pf=0;AUTO.pexp=0;AUTO.lastProg=0;AUTO.uiKey='';AUTO.fg=null;AUTO.sg=null;AUTO.last='';AUTO.tr=[];AUTO.pos=[];AUTO.loops=0;AUTO.hold=0;AUTO.crossed=0;

function autoStart(sync){

// a small, class-aware worth for an item in a slot: derived stats (read by briefly equipping it) plus trait adjustments. Off-hands / charms:
// any class-legal one beats an empty slot, but Auto never swaps one for another.
function autoGearScore(slot,it){

// merchant: potions first (up to the belt), then the best-scoring affordable upgrade. -1 = nothing worth buying.

  if(exp>AUTO.pexp){AUTO.pexp=exp;prog=true;}
  if(G.kills>AUTO.kills){AUTO.kills=G.kills;prog=true;}
  if(tot<AUTO.hp){AUTO.hp=tot;prog=true;}

 if(prog)AUTO.lastProg=G.turn;

  if(G.inv.fire>0&&awake.length&&(adj.length>=A.surround||stuck||(big&&awake.some(e=>manh(e,p)<=6)))&&autoDid(fireball)){if(stuck)AUTO.lastProg=G.turn-Math.floor(A.stuckTurns/2);return;}

   if(autoDid(()=>tryMove(t.x-p.x,t.y-p.y)))return;
  }

function autoAbilities(adj,awake,hpf){
 const p=G.p,A=BAL.auto,n=adj.length,S=A.surround;
 if(p.cls==='warrior'){
  if(n>=S){
   if(autoUse('cleave'))return true;
   if(hpf<A.braceHp&&!G.brace&&autoUse('brace'))return true;
   if(autoUse('bash',adj[0].x,adj[0].y))return true;
  }
  if(n){
   const t=adj.find(e=>e.wind||autoGuarded(e));if(t&&autoUse('bash',t.x,t.y))return true;
   if((p.rage||0)>=BAL.rage.max-10&&autoUse('cleave'))return true;
  }else{const c=targetTiles('charge').find(t=>{const e=enemyAt(t[0],t[1]);return e&&e.awake;});if(c&&autoUse('charge',c[0],c[1]))return true;}
 }else if(p.cls==='mage'){
  if((n>=S||adj.some(autoGuarded))&&autoUse('nova'))return true;

   if(n>=3&&hpf<A.blinkHp){
    let best=null,bs=-1;for(const t of targetTiles('blink')){const d=Math.min(...awake.concat(adj).map(e=>Math.abs(e.x-t[0])+Math.abs(e.y-t[1])));if(d>bs){bs=d;best=t;}}
    if(best&&autoUse('blink',best[0],best[1]))return true;
   }
  }

   for(const t of targetTiles('fire')){let w=0;for(const e of awake)if(Math.max(Math.abs(e.x-t[0]),Math.abs(e.y-t[1]))<=R)w+=EN[e.t].boss?3:1;if(w>bw){bw=w;best=t;}}
   if(best&&bw>=2&&autoUse('fire',best[0],best[1]))return true;

 }else{

// out of combat: loot, key door, merchant, shrine, unexplored ground, stairs, the dragon
function autoTravel(dz,cz,tz){
 const p=G.p,A=BAL.auto,fl=G.floor,me=ix(p.x,p.y);
 const block=new Set([...dz,...tz]);   // cracked tiles are not blocked: they only hurt whoever is still standing on one when they collapse, and Auto steps off at once
 let r=autoBfs(block,false);
 // items
 let bi=-1,bd=1e9;
 for(const it of G.items){
  const k=ix(it.x,it.y);if(r.dist[k]<=0||r.dist[k]>A.lootDist+(AUTO.last==='item:'+k?A.hysteresis:0)||r.dist[k]>=bd)continue;   // hysteresis: a goal being walked to is kept a little beyond the limit, or Auto flips between two goals at the border
  if(AUTO.ignore.has(it.x+','+it.y+','+fl)||AUTO.bad.has('item:'+k))continue;

 }
 if(bi>=0&&autoGo(r,bi,'item'))return;
 // locked treasure door (only with a key, and only if it is close)
 if(G.keys>0&&G.treasure&&G.map[ix(G.treasure.door[0],G.treasure.door[1])]===5){
  const dx=G.treasure.door[0],dy=G.treasure.door[1];

 }
 // merchant

 {const hpf=p.hp/p.mhp,sg=AUTO.sg;

   const sl=G.enemies.filter(e=>!e.dead&&!e.awake&&G.vis[ix(e.x,e.y)]&&!AUTO.bad.has('sleeper:'+e.id));

 const near=new Set();
