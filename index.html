<script>
(function(){
'use strict';
const W=30,H=30,RUN_KEY='dcr_run_v1',META_KEY='dcr_meta_v1',MAXF=8;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
let G=null,fx=[],flashUntil=0,rafPending=false,view={ts:40,ox:0,oy:0,cw:300,ch:300,dpr:1},walkTok=0,dest=null,tapMark=null,bigMap=false,armed=null,inChain=false;

// ---------- meta ----------
const SHOP=[
 {k:'hp',n:'Hardy',d:'+6 starting HP',base:25},
 {k:'atk',n:'Sharpened',d:'+1 starting attack',base:45},
 {k:'pot',n:'Supplies',d:'+1 starting potion',base:35},
 {k:'goldp',n:'Greed',d:'+15% gold found',base:40},
 {k:'def',n:'Padded',d:'+1 starting defense',base:60}
];
const SHOPMAX=8;
let meta={seenHelp:0,gold:0,hp:0,atk:0,pot:0,goldp:0,def:0,wins:0,best:0};
try{const m=JSON.parse(localStorage.getItem(META_KEY));if(m&&typeof m==='object')Object.assign(meta,m);}catch(e){}
function saveMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(meta));}catch(e){}}
function cost(s){const l=meta[s.k];return Math.round(s.base*(l+1)*(1+l*0.3));}

// ---------- defs ----------
const EN={
 rat:{n:'Rat',e:'🐀',hp:6,atk:2,speed:2,xp:3,minF:1,tr:'Fast: moves twice per turn.'},
 goblin:{n:'Goblin',e:'👺',hp:10,atk:3,xp:5,minF:1,tr:'Plain melee brute.'},
 archer:{n:'Archer',e:'🏹',hp:8,atk:3,range:6,xp:6,minF:2,tr:'Shoots from up to 6 tiles.'},
 skeleton:{n:'Skeleton',e:'💀',hp:15,atk:5,xp:8,minF:3,tr:'Tough melee fighter.'},
 troll:{n:'Troll',e:'🧌',hp:34,atk:7,slow:true,xp:16,minF:4,tr:'Slow, hits hard, lots of HP.'},
 warlock:{n:'Warlock',e:'🦹',hp:12,atk:6,range:6,xp:12,minF:5,tr:'Casts blasts from 6 tiles.'},
 dragon:{n:'Dragon',e:'🐉',hp:160,atk:11,range:5,cdmax:2,xp:100,minF:99,boss:true,tr:'Boss: fire breath from 5 tiles.'}
};
const WNAMES=['Dagger','Short Sword','Mace','Longsword','Warhammer','Runeblade'];
const ANAMES=['Rags','Leather','Chainmail','Scale Mail','Plate','Dragon Mail'];
const PERKS=[
 {id:'vit',n:'Vitality',d:'+12 max HP and heal 12',f:p=>{p.mhp+=12;p.hp=Math.min(p.mhp,p.hp+12);}},
 {id:'might',n:'Might',d:'+2 attack',f:p=>{p.atk+=2;}},
 {id:'bul',n:'Bulwark',d:'+1 defense',f:p=>{p.def+=1;}},
 {id:'vamp',n:'Vampirism',d:'Heal 10% of damage dealt (min 1)',f:p=>{p.life+=0.1;}},
 {id:'keen',n:'Keen Eye',d:'+12% critical chance (x2 damage)',f:p=>{p.crit+=0.12;}},
 {id:'renew',n:'Renewal',d:'Heal 30% HP on each new floor',f:p=>{p.renew+=0.3;}},
 {id:'thorns',n:'Thorns',d:'Melee attackers take 2 damage',f:p=>{p.thorns+=2;}},
 {id:'pockets',n:'Deep Pockets',d:'+2 potion capacity',f:p=>{p.potCap+=2;}},
 {id:'evade',n:'Evasion',d:'+8% chance to dodge attacks',f:p=>{p.dodge+=0.08;}},
 {id:'scholar',n:'Scholar',d:'+30% XP gained',f:p=>{p.xpMul+=0.3;}},
 {id:'pyro',n:'Pyromancer',d:'Fireball +50% damage, +1 scroll',f:p=>{p.fireMul+=0.5;G.inv.fire++;}},
 {id:'regen',n:'Regeneration',d:'+1 HP every 5 turns',f:p=>{p.regen+=1;}},
 {id:'treasure',n:'Treasure Hunter',d:'+25% gold found',f:p=>{p.goldMul+=0.25;}},
 // behaviour perks
 {id:'cleave',n:'Cleave',beh:1,d:'Melee hits also strike adjacent enemies for half damage'},
 {id:'venom',n:'Venom',beh:1,max:3,d:'Hits poison for 3 turns (+1 poison damage per level; halved on bosses)'},
 {id:'chain',n:'Chain Lightning',beh:1,d:'Kills zap the nearest visible enemy (once, no further chains)'},
 {id:'blood',n:'Bloodlust',beh:1,d:'After a kill, your next hit deals +75% damage'},
 {id:'riposte',n:'Riposte',beh:1,max:3,d:'20% chance per level to counterattack when hit in melee'},
 {id:'dash',n:'Dash',beh:1,act:1,d:'ACTIVE: move up to 3 tiles in a line as one turn (cooldown 5)'},
 {id:'arcane',n:'Arcane Bolt',beh:1,act:1,d:'ACTIVE: ranged blast at a visible enemy (cooldown 4)'},
 {id:'second',n:'Second Wind',beh:1,d:'Once per floor, a lethal hit leaves you at 1 HP instead'},
 {id:'glass',n:'Glass Cannon',beh:1,d:'+5 attack but -25% max HP',f:p=>{p.atk+=5;p.mhp=Math.max(8,Math.round(p.mhp*0.75));p.hp=Math.min(p.hp,p.mhp);}},
 {id:'scav',n:'Scavenger',beh:1,max:2,d:'Slain enemies drop an extra potion 20% of the time (per level)'},
 {id:'berserk',n:'Berserk',beh:1,d:'Up to +80% damage as your HP drops'},
 {id:'stone',n:'Stone Skin',beh:1,d:'The first hit you take each floor is negated'},
 {id:'exec',n:'Executioner',beh:1,d:'Instantly slay non-boss enemies below 20% HP after a hit'}
];
PERKS.forEach(p=>{if(!p.max)p.max=p.beh?1:5;});
const SYN=[
 {id:'vc',a:'venom',b:'cleave',n:'Toxic Sweep',d:'Cleave also spreads poison'},
 {id:'bv',a:'berserk',b:'vamp',n:'Blood Frenzy',d:'Lifesteal is doubled below half HP'},
 {id:'be',a:'blood',b:'exec',n:'Bloody Verdict',d:'Executioner threshold rises to 30%'},
 {id:'cv',a:'chain',b:'venom',n:'Storm Toxin',d:'Chain Lightning also poisons its target'},
 {id:'db',a:'dash',b:'arcane',n:'Phase Hunter',d:'Dash cuts Arcane Bolt cooldown by 2'}
];
const CLS={
 warrior:{n:'Warrior',e:'🛡',hp:42,atk:3,def:2,crit:0.05,fire:1,d:'42 HP, +2 defense, slow attack growth.',ab:'Shield Bash: hit an adjacent enemy and stun it for 2 turns (cooldown 6).'},
 mage:{n:'Mage',e:'🧙',hp:22,atk:4,def:0,crit:0.05,fire:2,d:'22 HP. Starts with Arcane Bolt (stronger, faster) and an extra fireball scroll.',ab:'Arcane Bolt: ranged blast at a visible enemy (cooldown 4).'},
 rogue:{n:'Rogue',e:'🗡',hp:30,atk:4,def:0,crit:0.2,fire:1,d:'30 HP, high crit. Your first attack on an enemy that has not noticed you deals double damage.',ab:'Vanish: enemies lose track of you for 3 turns (cooldown 8). Attacking breaks it.'}
};
const LG={warrior:{hp:4,atkE:0},mage:{hp:1,atkE:2},rogue:{hp:2,atkE:2}};
const TR={
 cursed:{slot:'weapon',n:'Cursed',dv:3,minF:2,d:'+3 attack, but you lose 1 HP per kill.'},
 vamp:{slot:'weapon',n:'Vampiric',dv:-2,minF:1,d:'-2 attack, but heal 25% of damage dealt.'},
 brutal:{slot:'weapon',n:'Brutal',dv:2,minF:2,d:'+2 attack, but -10% crit chance.'},
 keen:{slot:'weapon',n:'Keen',dv:-1,minF:1,d:'-1 attack, but +15% crit chance.'},
 heavy:{slot:'armor',n:'Heavy',dv:2,minF:2,d:'+2 defense, but enemies get a free turn every 4th turn.'},
 spiked:{slot:'armor',n:'Spiked',dv:0,minF:1,d:'Melee attackers take 3 damage, but -1 attack.'},
 light:{slot:'armor',n:'Light',dv:-1,minF:1,d:'-1 defense, but +12% dodge.'},
 leaden:{slot:'armor',n:'Leaden',dv:2,minF:3,d:'+2 defense, but potions heal 40% less.'}
};
let gearQ=null;
function clsOf(p){return CLS[p.cls]||CLS.warrior;}
function gearName(slot,v,tr){
 const base=slot==='weapon'?WNAMES[Math.min(5,Math.floor(v/2))]:ANAMES[Math.min(5,Math.floor(v))];
 if(tr&&TR[tr]){if(tr==='vamp')return 'Vampiric Dagger';return TR[tr].n+' '+base;}
 return base;
}
function rollTrait(slot,f){
 if(Math.random()>=Math.min(0.65,0.2+0.07*f))return null;
 const pool=Object.keys(TR).filter(k=>TR[k].slot===slot&&TR[k].minF<=f);
 return pool.length?pick(pool):null;
}
function applyTrait(v,tr){return tr&&TR[tr]?Math.max(1,v+TR[tr].dv):v;}
function atkMod(){const p=G.p;return p.at==='spiked'?-1:0;}
function critChance(){const p=G.p;return Math.max(0,Math.min(1,p.crit+(p.wt==='keen'?0.15:0)+(p.wt==='brutal'?-0.1:0)));}
function lifeRate(){const p=G.p;return Math.max(0,p.life+(p.wt==='vamp'?0.25:0));}
function dodgeChance(){const p=G.p;return Math.min(0.75,p.dodge+(p.at==='light'?0.12:0));}
function thornsDmg(){const p=G.p;return p.thorns+(p.at==='spiked'?3:0);}
function secondWind(){
 const p=G.p;
 if(p.hp<=0&&pc('second')&&!G.swUsed){G.swUsed=1;p.hp=1;msg('Second Wind! You cling to life at 1 HP.');return true;}
 return false;
}
function curseDrain(){
 const p=G.p;if(p.hp<=0)return;
 p.hp-=1;floatFx(p.x,p.y,'-1','#c6f');msg('The cursed blade drinks 1 HP.');secondWind();
}
function traitLine(tr){return tr&&TR[tr]?TR[tr].n+': '+TR[tr].d:'No trait.';}
const ABIL=[{k:'bash',cls:'warrior',e:'🛡',n:'Bash'},{k:'vanish',cls:'rogue',e:'👻',n:'Vanish'},{k:'dash',perk:'dash',e:'💨',n:'Dash'},{k:'bolt',perk:'arcane',e:'🔮',n:'Bolt'}];
function pc(id){return (G&&G.perks&&G.perks[id])||0;}
function perkById(id){return PERKS.find(x=>x.id===id);}
function checkSyn(){
 for(const s of SYN)if(pc(s.a)&&pc(s.b)&&!G.syn[s.id]){G.syn[s.id]=1;msg('Synergy! '+s.n+': '+s.d+'.');}
}
function addPerk(id){
 const pk=perkById(id);if(!G||!pk||pc(id)>=pk.max)return false;
 G.perks[id]=pc(id)+1;if(pk.f)pk.f(G.p);
 msg('Perk gained: '+pk.n+(pk.max>1?' (Lv '+pc(id)+')':'')+'.');checkSyn();return true;
}

// ---------- helpers ----------
const ix=(x,y)=>y*W+x;
const inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function walkable(x,y){return inb(x,y)&&G.map[ix(x,y)]!==0;}
function enemyAt(x,y){for(const e of G.enemies)if(e.x===x&&e.y===y)return e;return null;}
function itemAt(x,y){for(const i of G.items)if(i.x===x&&i.y===y)return i;return null;}
function msg(t){
 const last=G.log[G.log.length-1],m=last&&last.match(/^(.*) \(x(\d+)\)$/),base=m?m[1]:last;
 if(base===t){G.log[G.log.length-1]=t+' (x'+((m?+m[2]:1)+1)+')';renderLog();return;}
 G.log.push(t);if(G.log.length>30)G.log.shift();renderLog();}
function los(x0,y0,x1,y1){
 let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx-dy,x=x0,y=y0;
 while(!(x===x1&&y===y1)){
  if(!(x===x0&&y===y0)&&G.map[ix(x,y)]===0)return false;
  const e2=2*err;
  if(e2>-dy){err-=dy;x+=sx;}
  if(e2<dx){err+=dx;y+=sy;}
 }
 return true;
}
function bfsDist(sx,sy){
 const d=new Array(W*H).fill(9999);d[ix(sx,sy)]=0;const q=[[sx,sy]];
 for(let i=0;i<q.length;i++){const [x,y]=q[i];
  for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;
   if(walkable(nx,ny)&&d[ix(nx,ny)]===9999){d[ix(nx,ny)]=d[ix(x,y)]+1;q.push([nx,ny]);}}}
 return d;
}

// ---------- level gen ----------
function genFloor(f){
 for(let attempt=0;attempt<50;attempt++){
  const m=new Array(W*H).fill(0),rooms=[];
  for(let i=0;i<80&&rooms.length<9;i++){
   const w=rnd(4,8),h=rnd(4,7),x=rnd(1,W-w-1),y=rnd(1,H-h-1);
   if(rooms.some(r=>x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y))continue;
   rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)});
   for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)m[ix(xx,yy)]=1;
  }
  if(rooms.length<5)continue;
  for(let i=0;i<rooms.length-1;i++){
   const a=rooms[i],b=rooms[i+1];let x=a.cx,y=a.cy;
   while(x!==b.cx){m[ix(x,y)]=1;x+=b.cx>x?1:-1;}
   while(y!==b.cy){m[ix(x,y)]=1;y+=b.cy>y?1:-1;}
   m[ix(x,y)]=1;
  }
  const last=rooms[rooms.length-1];
  if(f<MAXF)m[ix(last.cx,last.cy)]=2;
  // verify connectivity
  const seen=new Array(W*H).fill(false),q=[[rooms[0].cx,rooms[0].cy]];seen[ix(q[0][0],q[0][1])]=true;
  for(let i=0;i<q.length;i++){const [x,y]=q[i];for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;
   if(inb(nx,ny)&&m[ix(nx,ny)]!==0&&!seen[ix(nx,ny)]){seen[ix(nx,ny)]=true;q.push([nx,ny]);}}}
  if(!seen[ix(last.cx,last.cy)])continue;
  let ok=true;for(const r of rooms)if(!seen[ix(r.cx,r.cy)])ok=false;
  if(!ok)continue;
  return {m,rooms};
 }
 // fallback: simple open map
 const m=new Array(W*H).fill(0);for(let y=2;y<W-2;y++)for(let x=2;x<W-2;x++)m[ix(x,y)]=1;
 if(f<MAXF)m[ix(W-4,H-4)]=2;
 return {m,rooms:[{x:2,y:2,w:26,h:26,cx:3,cy:3},{x:2,y:2,w:26,h:26,cx:W-4,cy:H-4}]};
}
function newFloor(f){
 const g=genFloor(f);G.map=g.m;G.floor=f;G.enemies=[];G.items=[];G.ssUsed=0;G.swUsed=0;
 G.seen=new Array(W*H).fill(false);G.exp=new Array(W*H).fill(false);
 const rooms=g.rooms,p=G.p;p.x=rooms[0].cx;p.y=rooms[0].cy;
 const taken=new Set([ix(p.x,p.y)]);
 function free(room){
  for(let i=0;i<60;i++){
   const x=rnd(room.x,room.x+room.w-1),y=rnd(room.y,room.y+room.h-1);
   if(G.map[ix(x,y)]===1&&!taken.has(ix(x,y))){taken.add(ix(x,y));return [x,y];}
  }
  return null;
 }
 function addEnemy(type,room,x,y){
  const d=EN[type],s=d.boss?1:1+0.15*(f-1),sa=d.boss?1:1+0.1*(f-1);
  const hp=Math.round(d.hp*s);
  G.enemies.push({id:G.nid++,t:type,x,y,hp,mhp:hp,atk:Math.round(d.atk*sa),awake:false,cd:0});
 }
 const others=rooms.slice(1);
 if(f===MAXF){const r=rooms[rooms.length-1];taken.add(ix(r.cx,r.cy));addEnemy('dragon',r,r.cx,r.cy);}
 const n=3+Math.floor(f*0.8)+rnd(0,2);
 const pool=Object.keys(EN).filter(k=>!EN[k].boss&&EN[k].minF<=f&&!(k==='rat'&&f>5));
 for(let i=0;i<n;i++){const r=pick(others),t=free(r);if(t)addEnemy(pick(pool),r,t[0],t[1]);}
 // items
 function addItem(t,v,tr){const r=pick(rooms),pos=free(r);if(pos)G.items.push({x:pos[0],y:pos[1],t,v,tr:tr||null});}
 for(let i=0;i<4;i++)addItem('gold',rnd(6,12)+f*3);
 for(let i=0;i<rnd(1,2);i++)addItem('potion',0);
 if(Math.random()<0.5){const tr=rollTrait('weapon',f);addItem('weapon',applyTrait(rnd(1,3)+f-1,tr),tr);}
 if(Math.random()<0.5){const tr=rollTrait('armor',f);addItem('armor',applyTrait(Math.floor((f+rnd(0,2))/2)+1,tr),tr);}
 if(Math.random()<0.5)addItem('fire',0);
 if(Math.random()<0.35)addItem('tele',0);
 computeVis();
}
function computeVis(){
 const p=G.p,R=7;G.vis=new Array(W*H).fill(false);
 for(let y=p.y-R;y<=p.y+R;y++)for(let x=p.x-R;x<=p.x+R;x++){
  if(!inb(x,y))continue;
  if((x-p.x)*(x-p.x)+(y-p.y)*(y-p.y)>R*R+1)continue;
  if(!los(p.x,p.y,x,y))continue;
  const i=ix(x,y);G.vis[i]=true;G.seen[i]=true;
  if(G.map[i]!==0){G.exp[i]=true;
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(inb(x+dx,y+dy))G.seen[ix(x+dx,y+dy)]=true;}
 }
}

// ---------- run ----------
function startRun(cls){
 if(!CLS[cls])cls='warrior';const C=CLS[cls];
 const p={x:0,y:0,cls:cls,hp:C.hp+6*meta.hp,mhp:C.hp+6*meta.hp,atk:C.atk+meta.atk,def:C.def+meta.def,wb:0,ab:0,wn:'Fists',an:'Cloth',wt:null,at:null,
  xp:0,lvl:1,gold:0,potCap:3,life:0,crit:C.crit,renew:0,thorns:0,dodge:0,xpMul:1,fireMul:1,regen:0,goldMul:1+0.15*meta.goldp};
 G={floor:1,p,inv:{pot:Math.min(1+meta.pot,3),fire:C.fire,tele:0},enemies:[],items:[],log:[],turn:0,nid:1,pending:0,kills:0,over:false,won:false,stopWalk:false,perks:{},cd:{dash:0,bolt:0,bash:0,vanish:0},syn:{},bl:0,ssUsed:0,swUsed:0,vanish:0};
 if(cls==='mage')G.perks.arcane=1;
 gearQ=null;armed=null;dest=null;tapMark=null;bigMap=false;newFloor(1);
 msg('You descend into the Emberfall depths as a '+C.n+'.');
 hideTitle();closeModal();save();render();
 if(!meta.seenHelp){meta.seenHelp=1;saveMeta();showHelp(closeModal);}
}
function save(){if(!G||G.over)return;try{localStorage.setItem(RUN_KEY,JSON.stringify(G));}catch(e){}}
function clearSave(){try{localStorage.removeItem(RUN_KEY);}catch(e){}}
function hasSave(){try{return !!localStorage.getItem(RUN_KEY);}catch(e){return false;}}
function continueRun(){
 try{
  const g=JSON.parse(localStorage.getItem(RUN_KEY));
  if(!g||!g.p||!g.map||g.map.length!==W*H)throw 0;
  G=g;G.stopWalk=false;G.perks=G.perks||{};G.cd=Object.assign({dash:0,bolt:0,bash:0,vanish:0},G.cd||{});G.vanish=G.vanish||0;G.syn=G.syn||{};if(!CLS[G.p.cls])G.p.cls='warrior';G.p.wt=TR[G.p.wt]?G.p.wt:null;G.p.at=TR[G.p.at]?G.p.at:null;gearQ=null;G.bl=G.bl||0;G.ssUsed=G.ssUsed||0;G.swUsed=G.swUsed||0;armed=null;dest=null;tapMark=null;bigMap=false;computeVis();hideTitle();closeModal();render();
  if(G.pending>0)showPerk();
 }catch(e){clearSave();G=null;showTitle();}
}
function needXp(l){return 8+l*7;}
function gainXp(n){
 const p=G.p;p.xp+=Math.round(n*p.xpMul);
 while(p.xp>=needXp(p.lvl)){p.xp-=needXp(p.lvl);p.lvl++;G.pending++;const lg=LG[p.cls]||LG.warrior;p.mhp+=lg.hp;p.hp+=lg.hp;if(lg.atkE&&p.lvl%lg.atkE===0)p.atk++;msg('Level up! You are level '+p.lvl+'.');}
}
function finish(kind){
 G.over=true;armed=null;gearQ=null;const p=G.p;walkTok++;
 const bonus=kind==='win'?150:0,banked=p.gold+bonus;
 meta.gold+=banked;if(kind==='win')meta.wins++;meta.best=Math.max(meta.best,G.floor);saveMeta();clearSave();
 computeVis();render();
 const dead=kind==='dead';
 showModal((dead?'You Died':kind==='win'?'Victory!':'Run Ended'),
  (kind==='win'?'<p>The dragon falls. You conquer the Emberfall depths!</p>':dead?'<p>The dungeon claims another adventurer.</p>':'<p>You left the dungeon.</p>')+
  '<p>Class: <b>'+clsOf(p).e+' '+clsOf(p).n+'</b><br>Gear: <b>'+p.wn+'</b>, <b>'+p.an+'</b><br>Floor reached: <b>'+G.floor+'</b><br>Level: <b>'+p.lvl+'</b><br>Enemies slain: <b>'+G.kills+'</b><br>Turns: <b>'+G.turn+'</b><br>Gold banked: <span class="gold">'+banked+(bonus?' (incl. 150 win bonus)':'')+'</span></p>',
  [{label:'Back to title',c:1,fn:function(){closeModal();G=null;showTitle();}}]);
}

// ---------- combat ----------
function floatFx(x,y,text,color){fx.push({x,y,text,color,t:performance.now()});}
function killEnemy(e,src){
 if(e.dead)return;
 e.dead=true;G.enemies=G.enemies.filter(o=>o!==e);G.kills++;
 const d=EN[e.t];msg((src||'You')+' slew the '+d.n+'.');
 gainXp(d.xp+G.floor);
 if(d.boss){G.won=true;return;}
 if(G.p.wt==='cursed')curseDrain();
 if(Math.random()<0.15)G.items.push({x:e.x,y:e.y,t:'potion',v:0});
 else if(Math.random()<0.4)G.items.push({x:e.x,y:e.y,t:'gold',v:rnd(3,7)+G.floor*2});
 if(pc('scav')&&!itemAt(e.x,e.y)&&Math.random()<0.2*pc('scav'))G.items.push({x:e.x,y:e.y,t:'potion',v:0});
 if(pc('blood'))G.bl=1;
 if(pc('chain')&&!inChain)chainZap(e);
}
function hurtEnemy(e,dmg,col){
 if(e.dead)return;
 e.hp-=dmg;e.awake=true;floatFx(e.x,e.y,'-'+dmg,col||'#ffd24a');
}
// resolve a hit: kill if dead, else maybe execute
function settle(e,src){
 if(e.dead)return;
 if(e.hp<=0){killEnemy(e,src);return;}
 if(!pc('exec')||EN[e.t].boss)return;
 if(e.hp/e.mhp<(pc('blood')?0.3:0.2)){floatFx(e.x,e.y,'EXECUTE','#f55');msg('Executed the '+EN[e.t].n+'!');killEnemy(e);}
}
function poison(e){
 const s=pc('venom');if(!s||e.dead||e.hp<=0)return;
 let d=1+s;if(EN[e.t].boss)d=Math.max(1,Math.floor(d/2));
 e.pois={t:3,d:d};floatFx(e.x,e.y,'poison','#7be04b');
}
function tickPoison(){
 for(const e of G.enemies.slice()){
  if(e.dead||!e.pois)continue;
  const d=e.pois.d;e.pois.t--;if(e.pois.t<=0)delete e.pois;
  hurtEnemy(e,d,'#7be04b');settle(e,'Poison');
 }
}
function chainZap(from){
 inChain=true;
 try{
  let best=null,bd=99;
  for(const o of G.enemies){if(o.dead||o===from||!G.vis[ix(o.x,o.y)])continue;
   const dd=Math.abs(o.x-from.x)+Math.abs(o.y-from.y);if(dd<bd&&dd<=8){bd=dd;best=o;}}
  if(best){const dmg=4+G.floor*2;hurtEnemy(best,dmg,'#9cf');
   msg('Chain Lightning arcs to the '+EN[best.t].n+' for '+dmg+'.');
   if(pc('venom'))poison(best);
   settle(best,'Lightning');}
 }finally{inChain=false;}
}
function playerDmg(){
 const p=G.p;let d=Math.max(1,p.atk+p.wb+atkMod()+rnd(-1,1));
 if(pc('berserk'))d*=1+0.8*(1-Math.max(0,p.hp)/p.mhp);
 return Math.max(1,Math.round(d));
}
function lifeSteal(dmg){
 const p=G.p,lr=lifeRate();if(lr<=0)return;
 let h=Math.max(1,Math.round(dmg*lr));
 if(pc('berserk')&&pc('vamp')&&p.hp<p.mhp*0.5)h*=2;
 p.hp=Math.min(p.mhp,p.hp+h);
}
function playerAttack(e){
 const p=G.p;let dmg=playerDmg(),crit=Math.random()<critChance();
 if(crit)dmg*=2;
 if(p.cls==='rogue'&&!e.awake){dmg*=2;msg('Sneak attack!');}
 if(G.vanish>0){G.vanish=0;msg('You step out of the shadows.');}
 if(G.bl){dmg=Math.round(dmg*1.75);G.bl=0;msg('Bloodlust! Your strike is empowered.');}
 hurtEnemy(e,dmg,crit?'#ff8a3a':'#ffd24a');
 msg((crit?'Critical! ':'')+'You hit the '+EN[e.t].n+' for '+dmg+'.');
 lifeSteal(dmg);
 poison(e);
 settle(e);
 if(pc('cleave')){
  const half=Math.max(1,Math.floor(dmg/2));
  for(const o of G.enemies.slice()){
   if(o===e||o.dead||Math.max(Math.abs(o.x-p.x),Math.abs(o.y-p.y))>1)continue;
   hurtEnemy(o,half,'#ffb04a');msg('Cleave hits the '+EN[o.t].n+' for '+half+'.');
   if(pc('venom'))poison(o);
   settle(o);
  }
 }
}
function hurtPlayer(e,dmg,melee){
 const p=G.p;
 if(Math.random()<dodgeChance()){floatFx(p.x,p.y,'dodge','#9cf');msg('You dodge the '+EN[e.t].n+'.');return;}
 if(pc('stone')&&!G.ssUsed){G.ssUsed=1;floatFx(p.x,p.y,'blocked','#bbb');msg('Stone Skin negates the '+EN[e.t].n+"'s hit.");return;}
 dmg=Math.max(1,dmg-(p.def+p.ab)+rnd(-1,1));
 if(dmg<1)dmg=1;
 p.hp-=dmg;flashUntil=performance.now()+250;floatFx(p.x,p.y,'-'+dmg,'#ff5a5a');
 msg('The '+EN[e.t].n+(melee?' hits':' blasts')+' you for '+dmg+'.');
 secondWind();
 if(melee&&thornsDmg()>0&&!e.dead){hurtEnemy(e,thornsDmg(),'#8f8');settle(e,'Thorns');}
 if(melee&&!e.dead&&p.hp>0&&pc('riposte')&&Math.random()<0.2*pc('riposte')){
  const d2=playerDmg();hurtEnemy(e,d2,'#fff');msg('Riposte! You counter for '+d2+'.');settle(e);}
}
function enemiesAct(free){
 const p=G.p,dist=bfsDist(p.x,p.y);
 for(const e of G.enemies.slice()){
  if(p.hp<=0)break;if(e.dead)continue;
  const d=EN[e.t];if(!free&&e.cd>0)e.cd--;
  if(e.stun>0){if(!free)e.stun--;continue;}
  if(G.vanish>0){e.awake=false;continue;}
  const md=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);
  const see=md<=9&&los(e.x,e.y,p.x,p.y);
  if(see)e.awake=true;
  if(!e.awake)continue;
  if(!see&&dist[ix(e.x,e.y)]>14){e.awake=false;continue;}
  const steps=d.speed||1;
  for(let s=0;s<steps;s++){
   const dd=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);
   if(dd===1){hurtPlayer(e,e.atk,true);break;}
   if(d.range&&see&&dd<=d.range&&e.cd<=0){hurtPlayer(e,d.boss?e.atk-2:e.atk,false);e.cd=d.cdmax||0;break;}
   if(d.slow&&G.turn%2)break;
   let best=null,bd=dist[ix(e.x,e.y)];
   for(const [dx,dy] of DIRS){const nx=e.x+dx,ny=e.y+dy;
    if(!walkable(nx,ny)||enemyAt(nx,ny)||(nx===p.x&&ny===p.y))continue;
    if(dist[ix(nx,ny)]<bd){bd=dist[ix(nx,ny)];best=[nx,ny];}}
   if(best){e.x=best[0];e.y=best[1];}else break;
  }
 }
}
function endTurn(){
 const p=G.p;
 if(G.won){finish('win');return;}
 G.turn++;
 for(const k in G.cd)if(G.cd[k]>0)G.cd[k]--;
 if(p.hp<p.mhp){
  if(p.regen&&G.turn%5===0)p.hp=Math.min(p.mhp,p.hp+p.regen);
  if(G.turn%8===0)p.hp=Math.min(p.mhp,p.hp+1);
 }
 tickPoison();
 if(G.won){finish('win');return;}
 enemiesAct();
 if(p.at==='heavy'&&G.turn%4===0&&p.hp>0&&!G.won&&G.enemies.some(e=>e.awake)){msg('Your heavy armor slows you: enemies get a free turn.');enemiesAct(true);}
 if(G.vanish>0)G.vanish--;
 if(G.won){finish('win');return;}
 if(p.hp<=0){p.hp=0;msg('You have died...');finish('dead');return;}
 computeVis();save();render();
 if(G.pending>0)showPerk();else if(gearQ)showGear();
}
function pickup(){
 const p=G.p,it=itemAt(p.x,p.y);if(!it)return;
 let take=true;
 if(it.t==='gold'){const g=Math.round(it.v*p.goldMul);p.gold+=g;msg('You pick up '+g+' gold.');}
 else if(it.t==='potion'){
  if(G.inv.pot<p.potCap){G.inv.pot++;msg('You pick up a health potion.');}
  else{msg('Potion belt is full.');take=false;}
 }
 else if(it.t==='weapon'||it.t==='armor'){
  const w=it.t==='weapon',cv=w?p.wb:p.ab,ct=w?p.wt:p.at,nm=gearName(it.t,it.v,it.tr);
  if(!it.tr&&!ct){
   if(it.v>cv){if(w){p.wb=it.v;p.wn=nm;}else{p.ab=it.v;p.an=nm;}msg('Equipped '+nm+' (+'+it.v+(w?' attack).':' defense).'));}
   else{const g=Math.round((4+G.floor*2)*p.goldMul);p.gold+=g;msg('Weak '+nm+' sold for '+g+' gold.');}
  }else{gearQ=it;take=false;}
 }
 else if(it.t==='fire'){G.inv.fire++;msg('Found a Fireball scroll.');}
 else if(it.t==='tele'){G.inv.tele++;msg('Found a Teleport scroll.');}
 if(take)G.items=G.items.filter(o=>o!==it);
 G.stopWalk=true;
}
function tryMove(dx,dy){
 const p=G.p,nx=p.x+dx,ny=p.y+dy;
 if(!walkable(nx,ny))return false;
 const e=enemyAt(nx,ny);
 if(e){playerAttack(e);endTurn();return true;}
 p.x=nx;p.y=ny;pickup();
 if(G.map[ix(nx,ny)]===2){msg('Stairs! Tap yourself to descend.');G.stopWalk=true;}
 endTurn();return true;
}
function wait(){msg('You wait.');endTurn();}
function descend(){
 if(!G||G.over)return;
 if(G.map[ix(G.p.x,G.p.y)]!==2){msg('No stairs here. Stand on the ▼ tile first.');return;}
 walkTok++;
 G.stopWalk=false;
 newFloor(G.floor+1);
 const p=G.p;
 if(p.renew>0){p.hp=Math.min(p.mhp,p.hp+Math.round(p.mhp*p.renew));}
 meta.best=Math.max(meta.best,G.floor);saveMeta();
 msg('Floor '+G.floor+(G.floor===MAXF?' - dragon lair!':'.'));
 save();render();
}
function drink(){
 const p=G.p;
 if(G.inv.pot<=0){msg('No potions. Find them in the dungeon.');return;}
 if(p.hp>=p.mhp){msg('Already at full health.');return;}
 G.inv.pot--;let h=Math.max(12,Math.round(p.mhp*0.4));if(p.at==='leaden')h=Math.max(1,Math.round(h*0.6));p.hp=Math.min(p.mhp,p.hp+h);
 floatFx(p.x,p.y,'+'+h,'#6f6');msg('You drink a potion (+'+h+' HP).');endTurn();
}
function fireball(){
 if(G.inv.fire<=0){msg('No fireball scrolls. Find them in the dungeon.');return;}
 const t=G.enemies.filter(e=>G.vis[ix(e.x,e.y)]);
 if(!t.length){msg('No visible enemies - scroll kept.');return;}
 G.inv.fire--;const dmg=Math.round((10+G.floor*3)*G.p.fireMul);
 msg('Fireball! '+dmg+' damage to all in sight.');
 for(const e of t){hurtEnemy(e,dmg,'#ff7a2a');settle(e);}
 endTurn();
}
function teleport(){
 if(G.inv.tele<=0){msg('No teleport scrolls. Find them in the dungeon.');return;}
 const p=G.p,c=[];
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)
  if(G.map[ix(x,y)]===1&&!enemyAt(x,y)&&!itemAt(x,y)&&Math.abs(x-p.x)+Math.abs(y-p.y)>=8)c.push([x,y]);
 if(!c.length){msg('The scroll fizzles.');return;}
 G.inv.tele--;const t=pick(c);p.x=t[0];p.y=t[1];msg('You teleport away!');walkTok++;endTurn();
}

// ---------- active abilities ----------
function dashTiles(){
 const p=G.p,out=[];
 for(const [dx,dy] of DIRS){for(let k=1;k<=3;k++){const x=p.x+dx*k,y=p.y+dy*k;
  if(!walkable(x,y)||!G.seen[ix(x,y)]||enemyAt(x,y))break;out.push([x,y]);}}
 return out;
}
function boltOk(e){return !e.dead&&G.vis[ix(e.x,e.y)]&&Math.abs(e.x-G.p.x)+Math.abs(e.y-G.p.y)<=8;}
function useDash(tx,ty){
 if(!dashTiles().some(t=>t[0]===tx&&t[1]===ty)){msg('Dash: tap a highlighted tile (straight line, up to 3).');return;}
 const p=G.p;armed=null;walkTok++;G.cd.dash=6;p.x=tx;p.y=ty;msg('You dash!');
 if(pc('arcane')&&G.cd.bolt>0){G.cd.bolt=Math.max(0,G.cd.bolt-2);msg('Phase Hunter: Bolt recharges faster.');}
 pickup();
 if(G.map[ix(tx,ty)]===2)msg('Stairs! Tap yourself to descend.');
 endTurn();
}
function bashOk(e){return !e.dead&&G.vis[ix(e.x,e.y)]&&Math.abs(e.x-G.p.x)+Math.abs(e.y-G.p.y)===1;}
function useBash(tx,ty){
 const e=enemyAt(tx,ty);
 if(!e||!bashOk(e)){msg('Shield Bash: tap an adjacent enemy.');return;}
 armed=null;walkTok++;G.cd.bash=7;
 const dmg=playerDmg();hurtEnemy(e,dmg,'#ffb04a');
 msg('Shield Bash hits the '+EN[e.t].n+' for '+dmg+'.');lifeSteal(dmg);
 if(!e.dead&&e.hp>0){e.stun=EN[e.t].boss?1:2;floatFx(e.x,e.y,'stunned','#ffe066');msg('The '+EN[e.t].n+' is stunned.');}
 settle(e);endTurn();
}
function useVanish(){
 armed=null;walkTok++;G.cd.vanish=9;G.vanish=3;
 for(const e of G.enemies)e.awake=false;
 floatFx(G.p.x,G.p.y,'vanish','#cfc');msg('You vanish. Enemies lose track of you.');endTurn();
}
function useBolt(tx,ty){
 const e=enemyAt(tx,ty);
 if(!e||!boltOk(e)){msg('Arcane Bolt: tap a visible enemy.');return;}
 const mg=G.p.cls==='mage';armed=null;walkTok++;G.cd.bolt=mg?4:5;
 const dmg=Math.round(playerDmg()*1.5)+3+(mg?3:0);
 hurtEnemy(e,dmg,'#b48cff');msg('Arcane Bolt hits the '+EN[e.t].n+' for '+dmg+'.');
 poison(e);settle(e);
 endTurn();
}
function toggleAbility(k){
 walkTok++;if(!G||G.over||modalOpen())return;
 if(armed===k){armed=null;msg('Cancelled.');render();return;}
 if(G.cd[k]>0){msg('Still recharging ('+G.cd[k]+').');return;}
 if(k==='vanish'){useVanish();return;}
 armed=k;msg(k==='dash'?'Dash armed: tap a highlighted tile.':k==='bash'?'Shield Bash armed: tap an adjacent enemy.':'Arcane Bolt armed: tap a visible enemy.');render();
}

// ---------- walking ----------
function bfsPath(sx,sy,tx,ty,allowEnemyTarget){
 const prev=new Map(),start=ix(sx,sy);prev.set(start,-1);const q=[[sx,sy]];
 const goal=ix(tx,ty);
 for(let i=0;i<q.length;i++){const [x,y]=q[i];if(ix(x,y)===goal)break;
  for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,k=ix(nx,ny);
   if(!inb(nx,ny)||prev.has(k)||!G.seen[k]||G.map[k]===0)continue;
   if(k!==goal&&enemyAt(nx,ny))continue;
   prev.set(k,ix(x,y));q.push([nx,ny]);}}
 if(!prev.has(goal))return null;
 const path=[];let k=goal;while(k!==start){path.push([k%W,Math.floor(k/W)]);k=prev.get(k);}
 return path.reverse();
}
function visIds(){return G.enemies.filter(e=>G.vis[ix(e.x,e.y)]).map(e=>e.id);}
function startWalk(path){
 const tok=++walkTok;
 const stop=function(){if(dest&&dest.tok===tok){dest=null;if(G)render();}};
 const step=function(){
  if(tok!==walkTok||!G||G.over||modalOpen()||!path.length)return;
  const p=G.p,nx=path[0][0],ny=path[0][1];
  if(enemyAt(nx,ny)){stop();return;}
  path.shift();
  const hp0=p.hp,v0=visIds(),f0=G.floor;G.stopWalk=false;
  if(!tryMove(nx-p.x,ny-p.y)){stop();return;}
  if(!G||G.over||G.floor!==f0||p.hp<hp0||G.stopWalk||modalOpen()){stop();return;}
  const v1=visIds();if(v1.some(id=>v0.indexOf(id)<0)){stop();return;}
  if(path.length)setTimeout(step,70);else stop();
 };
 if(path.length){const l=path[path.length-1];dest={x:l[0],y:l[1],tok:tok};}
 step();
}
function explore(){
 if(!G||G.over||modalOpen())return;walkTok++;
 const p=G.p;
 if(G.enemies.some(e=>e.awake&&G.vis[ix(e.x,e.y)])){msg('Enemies awake nearby - fight first.');render();return;}
 const prev=new Map();prev.set(ix(p.x,p.y),-1);const q=[[p.x,p.y]];let goal=-1;
 for(let i=0;i<q.length&&goal<0;i++){const [x,y]=q[i];
  for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,k=ix(nx,ny);
   if(!inb(nx,ny)||prev.has(k)||!G.seen[k]||G.map[k]===0||enemyAt(nx,ny))continue;
   prev.set(k,ix(x,y));q.push([nx,ny]);
   if(!G.exp[k]){goal=k;break;}}}
 if(goal<0){
  // go to stairs if seen
  for(let k=0;k<W*H;k++)if(G.map[k]===2&&G.seen[k]){const pa=bfsPath(p.x,p.y,k%W,Math.floor(k/W));if(pa&&pa.length){msg('Explored. Heading to the stairs.');startWalk(pa);return;}}
  msg('Nothing left to explore.');render();return;
 }
 const path=[];let k=goal;while(k!==ix(p.x,p.y)){path.push([k%W,Math.floor(k/W)]);k=prev.get(k);}
 startWalk(path.reverse());
}
function itemName(it){
 return {gold:'Gold pile',potion:'Health potion',fire:'Fireball scroll',tele:'Teleport scroll'}[it.t]||
  (gearName(it.t,it.v,it.tr)+' (+'+it.v+(it.t==='weapon'?' atk)':' def)')+(it.tr?' - '+TR[it.tr].d.replace(/\.$/,''):''));

function onTap(tx,ty){
 walkTok++;
 if(!G||G.over||modalOpen())return;
 const p=G.p;
 if(armed){
  if(!inb(tx,ty))return;
  if(tx===p.x&&ty===p.y){armed=null;msg('Cancelled.');render();return;}
  tapMark={x:tx,y:ty,t:performance.now()};
  if(armed==='dash')useDash(tx,ty);else if(armed==='bash')useBash(tx,ty);else useBolt(tx,ty);
  render();return;
 }
 if(inb(tx,ty)){tapMark={x:tx,y:ty,t:performance.now()};render();}
 if(tx===p.x&&ty===p.y){if(G.map[ix(tx,ty)]===2)descend();else wait();return;}
 if(!inb(tx,ty)||!G.seen[ix(tx,ty)]||G.map[ix(tx,ty)]===0){msg('Tap an explored floor tile.');return;}
 const e=enemyAt(tx,ty);
 if(e&&G.vis[ix(tx,ty)]){
  if(Math.abs(e.x-p.x)+Math.abs(e.y-p.y)===1){tryMove(e.x-p.x,e.y-p.y);return;}
  const d=EN[e.t];
  msg(d.n+' HP '+e.hp+'/'+e.mhp+', ATK '+e.atk+'. '+d.tr+(e.pois?' Poisoned ('+e.pois.t+'t).':'')+(e.stun>0?' Stunned ('+e.stun+'t).':'')+(e.awake?'':' Unaware.'));
  const path=bfsPath(p.x,p.y,tx,ty);
  if(path&&path.length>1){path.pop();startWalk(path);}else msg("Can't reach it.");
  return;
 }
 const it=itemAt(tx,ty);if(it)msg(itemName(it)+'.');
 const path=bfsPath(p.x,p.y,tx,ty);
 if(!path||!path.length){msg("Can't reach that.");return;}
 startWalk(path);
}
